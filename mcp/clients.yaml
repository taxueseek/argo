# mcp/clients.yaml — 多客户端 MCP 注入的声明式真源（自研，零第三方依赖）
#
# 设计：加/改客户端只需编辑本文件（对齐 config.yaml / engines/specs/*.yaml 的
# "配置真源"哲学），无需改代码。mcp_setup.py 读取本文件做 探测/注入/诊断/还原。
#
# 字段说明：
#   id           客户端标识（CLI --client 用）
#   name         展示名
#   config_path  配置文件路径（相对 home；用 {home} 占位可指绝对路径）
#   servers_key  MCP 服务器所在顶层键（mcpServers / servers / mcp_servers / mcp）
#   format       json | toml（toml 走"行级 append section"，注释零破坏）
#   detect       探测目录/文件（相对 home，逗号分隔；存在即"已安装"）。
#                只写宿主自身的目录/文件——写别家客户端的配置文件路径会把
#                别家已配置误判成本家已安装（cline 曾挂 .cursor/mcp.json）
#
# 注入形态：当前全部为 stdio（command=mcp_launch.sh），由 mcp_setup._mcp_command
# 统一生成；HTTP/远程形态是未来能力，尚未实现——字段表里不设占位。
#
# 运行：
#   python3 scripts/mcp_setup.py status             # 诊断各客户端
#   python3 scripts/mcp_setup.py inject --all       # 注入所有已安装客户端
#   python3 scripts/mcp_setup.py inject --cursor    # 注入指定客户端
#   python3 scripts/mcp_setup.py undo --all         # 还原所有（含备份历史）
#   python3 scripts/mcp_setup.py inject --all --dry-run

clients:
  - id: claude-code
    name: Claude Code
    config_path: .claude.json
    servers_key: mcpServers
    format: json
    detect: [.claude]

  - id: cursor
    name: Cursor
    config_path: .cursor/mcp.json
    servers_key: mcpServers
    format: json
    detect: [.cursor/mcp.json, .cursor]

  - id: windsurf
    name: Windsurf
    config_path: .codeium/windsurf/mcp_config.json
    servers_key: mcpServers
    format: json
    detect: [.codeium]

  - id: codex
    name: Codex
    config_path: .codex/config.toml
    servers_key: mcp_servers
    format: toml
    detect: [.codex]

  - id: opencode
    name: OpenCode
    config_path: .config/opencode/opencode.json
    servers_key: mcp
    format: json
    detect: [.config/opencode]

  - id: cline
    name: Cline
    config_path: .cline/mcp_settings.json
    servers_key: mcpServers
    format: json
    detect: [.cline]

  - id: workbuddy
    name: WorkBuddy
    config_path: .workbuddy/mcp.json
    servers_key: mcpServers
    format: json
    detect: [.workbuddy]
