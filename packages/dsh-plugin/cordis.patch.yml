# argo-dsh bundle：默认一行 —
#   wide-research：本包 apply() 注册 wide_research 编排 + 原生一等工具
#   （argo_search / argo_fetch）+ 原生 web_search seam（argo 引擎链）
#   + 原生 web_fetch seam（argo 抓取链）
#
# fetch seam 的 pin 说明（必读，漏配会打挂 web_fetch）：
#   宿主 dsh-web 的选择规则是「配置 id 优先，都没有且恰好一个可用则选它，
#   多个可用则 WEB_PROVIDER_AMBIGUOUS 直接报错」。web profile 默认挂着
#   dsh-web-fetch-http（免 key、永远可用），我们再注册一个 fetch provider
#   就是两个可用——不 pin 的话 web_fetch 整个挂掉。故启用 fetch seam 的
#   profile 必须在 web 服务行配 fetchProvider: argo（searchProvider 同理）。
#
# MCP 形态（mcp-argo，19 个 mcp__argo__* 完整工具面）默认不挂载：
# 工具定义每轮注入上下文且压缩清不掉（实测 19 工具 ≈3.7K token/轮），而搜索 /
# 抓取高频路径已由原生工具与 web seam 覆盖，走 CLI 单发同引擎同守卫、
# 零常驻开销。需要长尾取证能力（screenshot / pdf / social / article /
# job / extract / preflight / answer / watch / cite / evidence / clarify /
# crawl / local_*）时取消下方注释按需开启。
#
# 依赖：Node.js ≥ 18（npx）+ Python 3.9+（pip install pyyaml）。
# 安装由官方 plugin manager 应用；RC2 profile HMR 可同 PID 重组 bundle，
# 无需也不应默认重启 Host。官方 dsh CLI 没有 restart 子命令，只有
# `dsh plugin --profile <name> add|remove`；仅当 manager 明确返回
# restart-required 才考虑从进程外重启当前受监督的 Host。见 devkit
# knowledge/contracts/live-activation.md 与 playbooks/restart-outside.md。
#
# 同 id 可在用户层 cordis.patch.yml 覆盖（同 id + name 才是替换）。
# worker 取证工具白名单用内置默认（mcp__argo__* 与原生工具双写，
# MCP 挂载与否两态自洽），不含 argo_research，避免研究套研究。

- insert:
    # 按需开启：MCP 完整工具面（取消注释后按 live activation 分支验证生效）
    # - id: mcp-argo
    #   name: '@deepseek-ai/dsh-mcp-client'
    #   config:
    #     serverName: argo
    #     transport: stdio
    #     command: npx
    #     args:
    #       - '-y'
    #       - 'github:taxueseek/argo'
    - id: wide-research
      name: '@taxueseek/argo-dsh'
      config:
        toolName: wide_research
        provider: spawn
        defaultWorkers: 6
        maxWorkers: 9
        maxTracks: 9
        maxSourcesPerTrack: 5
        workerMaxTokens: 5000
        synthesisMaxTokens: 7000
