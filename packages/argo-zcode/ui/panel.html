<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Argo 面板</title>
<style>
  :root {
    color-scheme: light dark;
    --fg: #1a1a1a;
    --muted: #6b7280;
    --line: color-mix(in srgb, currentColor 14%, transparent);
    --fill: color-mix(in srgb, currentColor 5%, transparent);
    --fill-2: color-mix(in srgb, currentColor 9%, transparent);
    --accent: #3478f6;
    --ok: #2f9e44;
    --warn: #d9820b;
    --danger: #cc3333;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #e8e8e8;
      --muted: #9aa0a6;
      --ok: #51cf66;
      --warn: #ffa94d;
      --danger: #ff6b6b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 0 20px 32px; font: 13px/1.55 -apple-system, "PingFang SC", sans-serif;
         background: transparent; color: var(--fg); }
  code { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  button { font: inherit; color: inherit; }

  .top { display: flex; align-items: center; gap: 12px; padding: 18px 0 10px; }
  .brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  .logo { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center;
          background: var(--accent); color: #fff; font-weight: 700; font-size: 13px; }
  h1 { margin: 0; font-size: 15px; font-weight: 600; }
  .sub { font-size: 11px; color: var(--muted); }

  .btn { padding: 5px 12px; border-radius: 7px; border: 1px solid var(--line);
         background: transparent; cursor: pointer; }
  .btn:hover { background: var(--fill); }
  .btn.primary { border-color: var(--accent); color: var(--accent); }
  .btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); }
  .btn.small { padding: 3px 9px; font-size: 12px; border-radius: 6px; }
  .btn[disabled] { opacity: .45; cursor: default; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  .tab { padding: 7px 12px 8px; border: 0; background: transparent; cursor: pointer;
         color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab.active { color: var(--fg); border-bottom-color: var(--accent); font-weight: 600; }
  .tab:hover { color: var(--fg); }

  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 240px)); gap: 10px; }
  .metric { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--fill); }
  .metric .k { font-size: 11px; color: var(--muted); }
  .metric .v { font-size: 22px; font-weight: 600; margin-top: 2px; }
  .metric .s { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .card { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-top: 14px; }
  .card h2 { margin: 0 0 8px; font-size: 13px; font-weight: 600; }
  .card .hint { margin: 0 0 10px; font-size: 11px; color: var(--muted); }

  .presets { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
  .preset { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
            background: transparent; text-align: left; cursor: pointer; }
  .preset:hover { background: var(--fill); }
  .preset.recommended { border-color: var(--accent); }
  .preset .t { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .preset .name { font-weight: 600; }
  .preset .d { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .badge { font-size: 10px; padding: 1px 7px; border-radius: 999px; flex-shrink: 0;
           border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .badge.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
  .badge.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  .badge.accent { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }

  .key { border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; margin-bottom: 8px; background: var(--fill); }
  .key-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .key-head .kname { font-weight: 600; }
  .key-head .kid { font-size: 11px; color: var(--muted); }
  .key-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .key-actions input { flex: 1 1 200px; min-width: 150px; padding: 5px 9px; border-radius: 6px;
                       border: 1px solid var(--line); background: transparent; color: inherit; font: inherit; }
  .key-actions input::placeholder { color: var(--muted); }

  .kv { display: grid; grid-template-columns: 92px 1fr; gap: 4px 12px; font-size: 12px; }
  .kv .k { color: var(--muted); }
  .kv .v { overflow-wrap: anywhere; }

  pre { margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--fill);
        border: 1px solid var(--line); overflow-x: auto; font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre-wrap; overflow-wrap: anywhere; }

  .toast { position: sticky; top: 8px; z-index: 5; margin: 0 0 10px; padding: 7px 12px; border-radius: 8px;
           background: color-mix(in srgb, var(--ok) 16%, transparent);
           border: 1px solid color-mix(in srgb, var(--ok) 40%, transparent); font-size: 12px; }
  .toast.err { background: color-mix(in srgb, var(--danger) 14%, transparent);
               border-color: color-mix(in srgb, var(--danger) 40%, transparent); color: var(--danger); }

  .empty { padding: 20px 0; color: var(--muted); font-size: 12px; }
  #loading { padding: 40px 0; color: var(--muted); }
</style>
</head>
<body>
<div id="loading">正在连接 Argo…</div>
<div id="app" hidden>
  <header class="top">
    <div class="brand">
      <span class="logo">A</span>
      <div style="min-width:0">
        <h1>Argo 面板</h1>
        <div class="sub" id="meta"></div>
      </div>
    </div>
    <button class="btn" id="refresh" type="button">刷新</button>
  </header>

  <nav class="tabs" role="tablist" aria-label="面板分区">
    <button class="tab active" id="tabbtn-dashboard" role="tab" aria-controls="tab-dashboard" aria-selected="true" type="button">看板</button>
    <button class="tab" id="tabbtn-keys" role="tab" aria-controls="tab-keys" aria-selected="false" type="button">密钥</button>
    <button class="tab" id="tabbtn-diagnostics" role="tab" aria-controls="tab-diagnostics" aria-selected="false" type="button">诊断</button>
  </nav>

  <div id="toast" class="toast" role="status" hidden></div>

  <main>
    <section id="tab-dashboard" role="tabpanel" aria-labelledby="tabbtn-dashboard"></section>
    <section id="tab-keys" role="tabpanel" aria-labelledby="tabbtn-keys" hidden></section>
    <section id="tab-diagnostics" role="tabpanel" aria-labelledby="tabbtn-diagnostics" hidden></section>
  </main>
</div>

<script type="module">
import { App } from "./vendor/ext-apps.mjs";

(async () => {
const app = new App({ name: "argo-panel", version: "2.13.0" });
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined && text !== null) node.textContent = String(text);
  return node;
};

const PRESETS = [
  {
    id: "fast",
    name: "极速日常",
    badge: "低延迟",
    desc: "免费源优先，关闭 TF-IDF 重排与数值交叉核验。",
    recommended: false
  },
  {
    id: "standard",
    name: "平衡生产",
    badge: "推荐",
    desc: "开启 TF-IDF 重排、数值交叉核验与去重，主流付费源参与。",
    recommended: true
  },
  {
    id: "deep",
    name: "深度调研",
    badge: "完整核验",
    desc: "在平衡档之上开启语义证据层，适合长报告与事实核验。",
    recommended: false
  }
];

const S = { data: null, diag: null, tab: "dashboard", error: "", busy: false };

async function callTool(name, args = {}) {
  const result = await app.callServerTool({ name, arguments: args });
  if (result.isError) throw new Error(result.content?.[0]?.text ?? "工具调用失败");
  return JSON.parse(result.content?.[0]?.text ?? "{}");
}

let toastTimer = null;
function toast(text, isError = false) {
  const node = $("toast");
  node.textContent = text;
  node.className = isError ? "toast err" : "toast";
  node.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { node.hidden = true; }, 4000);
}

function setTab(tab) {
  S.tab = tab;
  for (const id of ["dashboard", "keys", "diagnostics"]) {
    const panel = $("tab-" + id);
    const button = $("tabbtn-" + id);
    const active = id === tab;
    if (panel) panel.hidden = !active;
    if (button) {
      button.classList.toggle("active", active);
      button.setAttribute("aria-selected", active ? "true" : "false");
    }
  }
  if (tab === "diagnostics") {
    renderDiagnostics();
    return;
  }
  if (!S.data) {
    if (S.error) renderError(S.error);
    return;
  }
  if (tab === "dashboard") renderDashboard();
  if (tab === "keys") renderKeys();
}

function renderError(message) {
  const root = $("tab-" + S.tab);
  root.replaceChildren();
  const box = el("div", "card");
  box.appendChild(el("h2", null, "连接有问题"));
  box.appendChild(el("p", "hint", message));
  const retry = el("button", "btn", "重试");
  retry.type = "button";
  retry.addEventListener("click", () => { void refresh(); });
  box.appendChild(retry);
  root.appendChild(box);
}

async function refresh(keepScroll = true) {
  const y = window.scrollY;
  try {
    S.data = await callTool("get_panel");
    S.diag = null;
    S.error = "";
    $("meta").textContent = S.data.version ? "v" + S.data.version : "";
    setTab(S.tab);
    if (keepScroll) window.scrollTo(0, y);
  } catch (error) {
    S.error = error.message;
    $("meta").textContent = "未连接";
    renderError(error.message);
    toast("读取失败：" + error.message, true);
  }
}

// ── 看板 ─────────────────────────────────────────────────────────────────────

function renderDashboard() {
  const root = $("tab-dashboard");
  root.replaceChildren();
  if (!S.data) return;

  const keys = S.data.keys || [];
  const configured = keys.filter((item) => item.configured).length;

  const metrics = el("div", "metrics");
  const card = el("div", "metric");
  card.appendChild(el("div", "k", "API 密钥"));
  card.appendChild(el("div", "v", String(configured)));
  card.appendChild(el("div", "s", "已配置"));
  metrics.appendChild(card);
  root.appendChild(metrics);

  const presets = el("div", "card");
  presets.appendChild(el("h2", null, "工作流快速预设"));
  presets.appendChild(el("p", "hint", "一键对齐常用场景的检索策略，改的是 argo 运行时开关，随时可切回。"));
  const grid = el("div", "presets");
  for (const preset of PRESETS) {
    const button = el("button", "preset" + (preset.recommended ? " recommended" : ""));
    button.type = "button";
    const head = el("div", "t");
    head.appendChild(el("span", "name", preset.name));
    head.appendChild(el("span", "badge " + (preset.recommended ? "ok" : "accent"), preset.badge));
    button.appendChild(head);
    button.appendChild(el("div", "d", preset.desc));
    button.addEventListener("click", () => { void applyPreset(preset); });
    grid.appendChild(button);
  }
  presets.appendChild(grid);
  root.appendChild(presets);

  const route = el("div", "card");
  route.appendChild(el("h2", null, "路由观测"));
  route.appendChild(el("p", "hint", "在终端运行 argo stats 查看最近的路由决策、引擎成功率与配额消耗。"));
  root.appendChild(route);
}

async function applyPreset(preset) {
  if (S.busy) return;
  S.busy = true;
  try {
    await callTool("apply_preset", { preset: preset.id });
    toast(`${preset.name}已应用`);
  } catch (error) {
    toast("应用失败：" + error.message, true);
  } finally {
    S.busy = false;
  }
}

// ── 密钥 ─────────────────────────────────────────────────────────────────────

function renderKeys() {
  const root = $("tab-keys");
  root.replaceChildren();
  if (!S.data) return;

  const labelOf = (name) => {
    const engine = (S.data.engines || []).find((entry) => entry.name === name);
    return engine ? engine.label : name;
  };
  const disabled = (name) => {
    const engine = (S.data.engines || []).find((entry) => entry.name === name);
    return Boolean(engine && (engine.status === "disabled" || engine.status === "not_routable"));
  };
  const items = S.data.keys || [];
  const allOff = (item) => item.engines.length > 0 && item.engines.every(disabled);
  const configured = items.filter((item) => item.configured && !allOff(item));
  const pending = items.filter((item) => !item.configured && !allOff(item));
  const off = items.filter(allOff);

  root.appendChild(el("p", "hint", `写入 ${S.data.env_file || "argo env 文件"}，值不回显。`));

  const group = (title, rows) => {
    if (!rows.length) return;
    const card = el("div", "card");
    card.appendChild(el("h2", null, title));
    for (const item of rows) card.appendChild(keyRow(item, labelOf));
    root.appendChild(card);
  };
  group("已配置", configured);
  group("待配置", pending);
  group("已停用", off);
}

function keyRow(item, labelOf) {
  const wrap = el("div", "key");
  const head = el("div", "key-head");
  head.appendChild(el("span", "kname", labelOf(item.engines[0]) || item.key));
  head.appendChild(el("code", "kid", item.key));
  if (item.engines.length > 1) {
    const others = item.engines.slice(1).map(labelOf);
    head.appendChild(el("span", "kid", "也用于 " + others.slice(0, 3).join(" / ") + (others.length > 3 ? " 等" : "")));
  }
  if (item.configured) head.appendChild(el("span", "badge ok", "已配置"));
  else head.appendChild(el("span", "badge warn", "未配置"));
  wrap.appendChild(head);

  const actions = el("div", "key-actions");
  const field = document.createElement("input");
  field.type = "password";
  field.autocomplete = "off";
  field.spellcheck = false;
  field.placeholder = item.configured ? "输入新值覆盖（留空不改）" : "粘贴密钥";
  field.setAttribute("aria-label", item.key + " 的值");
  actions.appendChild(field);

  const save = el("button", "btn small primary", "保存");
  save.type = "button";
  save.addEventListener("click", async () => {
    const value = field.value;
    if (!value.trim()) {
      toast("值不能为空", true);
      return;
    }
    save.disabled = true;
    try {
      await callTool("set_env", { key: item.key, value });
      field.value = "";
      toast(`${item.key} 已保存`);
      await refresh();
    } catch (error) {
      toast("保存失败：" + error.message, true);
    } finally {
      save.disabled = false;
    }
  });
  actions.appendChild(save);

  if (item.configured) {
    const clear = el("button", "btn small danger", "清除");
    clear.type = "button";
    clear.addEventListener("click", async () => {
      clear.disabled = true;
      try {
        await callTool("unset_env", { key: item.key });
        toast(`${item.key} 已清除`);
        await refresh();
      } catch (error) {
        toast("清除失败：" + error.message, true);
      } finally {
        clear.disabled = false;
      }
    });
    actions.appendChild(clear);
  }
  wrap.appendChild(actions);
  return wrap;
}

// ── 诊断 ─────────────────────────────────────────────────────────────────────

async function loadDiagnostics() {
  const root = $("tab-diagnostics");
  try {
    S.diag = await callTool("get_diagnostics");
  } catch (error) {
    root.replaceChildren(el("p", "empty", "检测失败：" + error.message));
    return;
  }
  if (S.tab === "diagnostics") renderDiagnostics();
}

function renderDiagnostics() {
  const root = $("tab-diagnostics");
  root.replaceChildren();
  if (!S.diag) {
    root.appendChild(el("p", "empty", "正在检测…"));
    void loadDiagnostics();
    return;
  }
  const d = S.diag;

  const head = el("div", "toolbar");
  const again = el("button", "btn", "重新检测");
  again.type = "button";
  again.addEventListener("click", () => {
    S.diag = null;
    renderDiagnostics();
  });
  head.appendChild(again);
  root.appendChild(head);

  const runtime = el("div", "card");
  runtime.appendChild(el("h2", null, "基础信息"));
  const kv = el("div", "kv");
  const row = (key, value) => {
    kv.appendChild(el("div", "k", key));
    kv.appendChild(el("div", "v", value ?? "—"));
  };
  row("argo 版本", d.version ? "v" + d.version : "未知");
  row("argo 解释器", d.argo_python || "未知");
  row("argo 入口", d.argo_bin);
  row("配置基线", d.config_base);
  row("本机覆盖层", (d.config_local || "—") + (d.config_local_exists ? "（存在）" : "（未创建）"));
  row("env 文件", `${d.env_file || "—"}（权限 ${d.env_mode || (d.platform === "win32" ? "不适用" : "未知")}）`);
  runtime.appendChild(kv);
  root.appendChild(runtime);

  const daemon = el("div", "card");
  daemon.appendChild(el("h2", null, "daemon"));
  daemon.appendChild(el("pre", null, d.daemon || "未启动"));
  root.appendChild(daemon);

  const budget = el("div", "card");
  budget.appendChild(el("h2", null, "额度与预算"));
  budget.appendChild(el("pre", null, d.budget || "无预算记录"));
  root.appendChild(budget);

  const paths = el("div", "card");
  paths.appendChild(el("h2", null, "路径自检"));
  paths.appendChild(el("p", "hint", d.paths_code === 0 ? "全部通过" : `退出码 ${d.paths_code}`));
  paths.appendChild(el("pre", null, d.paths_check || "无输出"));
  root.appendChild(paths);
}

// ── 启动 ─────────────────────────────────────────────────────────────────────

$("refresh").addEventListener("click", () => { void refresh(); });
for (const id of ["dashboard", "keys", "diagnostics"]) {
  $("tabbtn-" + id).addEventListener("click", () => setTab(id));
}

try {
  await app.connect();
  $("loading").hidden = true;
  $("app").hidden = false;
  await refresh(false);
} catch (error) {
  $("loading").textContent = "连接宿主失败：" + error.message;
}
})();
</script>
</body>
</html>
