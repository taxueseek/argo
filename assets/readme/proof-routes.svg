<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Argo 问啥像啥</title>
  <desc id="desc">四类真实路由：A股行情、影视、多语言、地理实体各自命中垂直源</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>

  <text x="56" y="48" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#38BDF8" letter-spacing="2">PROOF · REAL ROUTES</text>
  <text x="56" y="82" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="26" font-weight="650" fill="#E8EEF7">问啥像啥 · 垂直源优先</text>
  <text x="56" y="110" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="14" fill="#64748B">同样是「搜索」，路由不同 · 答案形态不同 · 可信度字段跟输出一起回来</text>

  <!-- card 1 finance -->
  <g transform="translate(56 140)">
    <rect width="260" height="230" rx="16" fill="#0D1526" stroke="#1E2A3F"/>
    <rect x="16" y="16" width="64" height="22" rx="6" fill="#0B3B2E"/>
    <text x="48" y="31" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#34D399">FINANCE</text>
    <text x="16" y="64" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="15" font-weight="600" fill="#E8EEF7">贵州茅台股价</text>
    <text x="16" y="92" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#64748B">domain</text>
    <text x="16" y="112" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#38BDF8">stock_query</text>
    <text x="16" y="142" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#64748B">engines</text>
    <text x="16" y="162" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#CBD5E1">sina · tencent</text>
    <text x="16" y="192" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#64748B">result shape</text>
    <text x="16" y="212" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="13" fill="#94A3B8">报价快照 · early-stop</text>
  </g>

  <!-- card 2 film -->
  <g transform="translate(332 140)">
    <rect width="260" height="230" rx="16" fill="#0D1526" stroke="#1E2A3F"/>
    <rect x="16" y="16" width="52" height="22" rx="6" fill="#1A1430"/>
    <text x="42" y="31" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#A78BFA">FILM</text>
    <text x="16" y="64" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="15" font-weight="600" fill="#E8EEF7">Inception director</text>
    <text x="16" y="92" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#64748B">domain</text>
    <text x="16" y="112" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#A78BFA">film_search</text>
    <text x="16" y="142" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#64748B">engines</text>
    <text x="16" y="162" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#CBD5E1">imdb · itunes</text>
    <text x="16" y="192" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#64748B">result shape</text>
    <text x="16" y="212" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="13" fill="#94A3B8">作品页 · 实体字段</text>
  </g>

  <!-- card 3 multilingual -->
  <g transform="translate(608 140)">
    <rect width="260" height="230" rx="16" fill="#0D1526" stroke="#1E2A3F"/>
    <rect x="16" y="16" width="48" height="22" rx="6" fill="#0C2A3A"/>
    <text x="40" y="31" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#38BDF8">LANG</text>
    <text x="16" y="64" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="15" font-weight="600" fill="#E8EEF7">アニメ おすすめ</text>
    <text x="16" y="92" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#64748B">query_lang</text>
    <text x="16" y="112" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#38BDF8">ja · no zh-only</text>
    <text x="16" y="142" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#64748B">engines</text>
    <text x="16" y="162" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#CBD5E1">local_bing · ddg</text>
    <text x="16" y="192" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#64748B">gate</text>
    <text x="16" y="212" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="13" fill="#94A3B8">避开中文专用源</text>
  </g>

  <!-- card 4 geo -->
  <g transform="translate(884 140)">
    <rect width="260" height="230" rx="16" fill="#0D1526" stroke="#1E2A3F"/>
    <rect x="16" y="16" width="44" height="22" rx="6" fill="#2A2310"/>
    <text x="38" y="31" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#FBBF24">GEO</text>
    <text x="16" y="64" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="15" font-weight="600" fill="#E8EEF7">where is Eiffel Tower</text>
    <text x="16" y="92" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#64748B">domain</text>
    <text x="16" y="112" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#FBBF24">geo_places</text>
    <text x="16" y="142" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#64748B">engines</text>
    <text x="16" y="162" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#CBD5E1">openstreetmap · wiki</text>
    <text x="16" y="192" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#64748B">result shape</text>
    <text x="16" y="212" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="13" fill="#94A3B8">坐标 · 实体定位</text>
  </g>
</svg>
