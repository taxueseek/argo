# Art Institute of Chicago 馆藏（免认证，含 IIIF 高清图）
# 补 art_museum 域：现有 met_museum 单源，且欧洲博物馆免 key 端点基本全灭
# （Europeana/DPLA/Harvard 需 key，Rijksmuseum 已 410），AIC + Cleveland 是免 key 仅存。
# 验证:
#   python3 scripts/engine_validate.py --engine artic --stage all --admit --write-doc

engine_id: artic
type: http
enabled: true
cost_tier: free
timeout: 20
method: GET
url: "https://api.artic.edu/api/v1/artworks/search"
query_param: q
extra_params:
  fields: "id,title,artist_display,date_display,image_id"
format_is_query_param: false
response:
  # IIIF 图片直链依赖响应级 config.iiif_url 拼接，output_map 表达不了，
  # 故引用注册的 artic 解析器（见 engines_parsers.parse_artic）。
  parser: artic
canary_query: "monet"
desc: "芝加哥艺术博物馆馆藏（免认证，含 IIIF 图像）"
coverage: [art, museum, culture, image]
recommended: false
latency_ms: 2500

quality_queries:
  - query: "monet"
  - query: "woodblock print"
