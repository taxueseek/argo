engine_id: bocha
body:
  count: '{n}'
  freshness: oneYear
  query: '{query}'
  summary: true
enabled: true
label: 博查搜索
cost_tier: low
qps: 5
priority: 9
# 按量付费：不设次数上限（2026-10-22 用户更正）。额度由博查控制台后付，
# argo 侧只在成本预算层可另设上限（argo budget set bocha ...）。
cost_per_call: 0.0001
cost_unit: credit
coverage:
- chinese
- general
desc: 博查搜索 API（中文，freshness 按查询时效动态化）
headers:
  Authorization: Bearer {BOCHA_API_KEY}
  Content-Type: application/json
method: POST
timeout: 8
type: bocha
url: https://api.bochaai.com/v1/web-search
