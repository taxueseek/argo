# 泰国民族报 RSS — Matichon，泰国主流日报
#
# 补的盲区：**th 本地一手新闻**。接入前 argo 的新闻链路只有中英源
# （google_news/guardian_rss/dw_news/france24 都是英语视角），th 查询
# 拿不到本地一手报道。
#
# 实测（2026-09-21）：**50 条**，摘要中位 65 字、最长 65 字。
#
# 形态：feed_mode=hot（实时流语义，同 guardian_rss）。归 world_news 族——
# 与 hot_trending（热榜）分族，避免同族 max_per_family=2 把本地源互相挤掉。
# 语言由 langs 声明，路由按查询语言选源（见 route._lang_aware_combo_order）。
#
# 验证:
#   python3 scripts/engine_validate.py --engine matichon --stage all --admit
#   python3 scripts/search.py "ข่าววันนี้" --engine matichon --json

