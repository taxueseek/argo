# 火车余票查询（免 Key）
# 数据源: 12306 官方接口（init 取会话 Cookie → queryG 查余票），免 Key 两步会话
# 能力: 按自然语言查询词（"上海到北京" / "北京→上海 后天 G"）查询车次时刻与余票
# 实现: scripts/train.py（纯标准库，站点表 station_name.js 解析 + 7 天缓存，输出结构化 YAML）
# 验证:
#   python3 scripts/engine_validate.py --engine train --stage all --admit
#   python3 scripts/search.py "上海到北京高铁" --engine train --json

engine_id: train
type: cli
enabled: true
cost_tier: free
label: 火车余票
desc: 火车余票查询（免 Key：12306 官方接口，车次时刻+余票）
canary_query: "北京到上海"
cmd:
- python3
- scripts/train.py
search_args:
- '{query}'
- --n
- '{n}'
output_format: yaml
timeout: 20
family: misc_vertical
