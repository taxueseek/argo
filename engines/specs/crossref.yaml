engine_id: crossref
enabled: true
label: Crossref
cost_tier: free
qps: 2
priority: 40
period: second
cost_per_call: 0.0
cost_unit: free
coverage:
- academic
desc: Crossref DOI 元数据 API（免认证，礼貌池 mailto）
extra_params:
  # mailto 运行时由 engines_http.contact_email() 注入（ARGO_CONTACT_EMAIL）；
  # 未配置则参数不发送，礼貌池降级为普通池。此键只声明礼貌池意图。
  mailto: ''
  rows: '{n}'
method: GET
query_param: query
timeout: 12
type: http
url: https://api.crossref.org/works
output_map:
  items: message.items
  item_title: title
  item_url: URL
  item_summary: publisher
  # 被引次数（Crossref 原生字段）
  item_upstream_authority: is-referenced-by-count
headers:
  User-Agent: argo-search
