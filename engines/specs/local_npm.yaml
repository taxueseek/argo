engine_id: local_npm
type: http
enabled: true
# 与 npm 引擎同端点同参数（registry.npmjs.org/-/v1/search + text/size），
# output_map 字段也刻意保持一致——两条同时进自动池时，一次搜索可能对同一
# 上游打两次并占两个候选位，召回完全重复。保留本源是因为 local-search 子
# 技能的本地聚合通道按名字引用它，但自动路由只该留 npm（T1、coverage 更准）。
# 实测 1179 条生产查询里 local_npm 被调用 0 次。
explicit_only: true
label: NPM本地
cost_tier: free
qps: 5
priority: 38
period: second
cost_per_call: 0.0
cost_unit: free
format: json
method: GET
query_param: text
extra_params:
  size: '{n}'
output_map:
  items: objects
  item_title: package.name
  item_url: package.links.npm
  item_summary: package.description
  # 与 npm 引擎保持字段一致：同一 URL 走两条路径时结果形状不应有差别
  item_published_at: package.date
  item_upstream: package.links.homepage
timeout: 8
url: https://registry.npmjs.org/-/v1/search
