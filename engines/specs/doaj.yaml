engine_id: doaj
enabled: true
label: DOAJ 开放获取期刊
cost_tier: free
family: academic
qps: 2
priority: 50
period: second
cost_per_call: 0.0
cost_unit: free
coverage:
- academic
- open_access
- global
desc: 开放获取期刊全球总库（80+ 语种，元数据统一英文）
timeout: 12
type: http
method: GET
url: "https://doaj.org/api/search/articles/{query_quoted}"
query_param: ""
extra_params:
  pageSize: 10
format_is_query_param: false
output_map:
  items: results
  # bibjson 是嵌套对象：字段路径需带 bibjson 前缀，否则取不到值。
  item_title: bibjson.title
  item_url: bibjson.link.0.url
  # 拼接模板：原 builder 输出 `作者 · 年份 · 期刊 · 摘要`（作者取前 3 位）。
  item_summary_template: "{bibjson.author.0.name} · {bibjson.author.1.name} · {bibjson.author.2.name} · {bibjson.year} · {bibjson.journal.title} · {bibjson.abstract}"
