# 西班牙国家报 RSS — El País，西语世界发行量最大的日报
#
# 补的盲区：**es 本地一手新闻**。接入前 argo 的新闻链路只有中英源
# （google_news/guardian_rss/dw_news/france24 都是英语视角），es 查询
# 拿不到本地一手报道。
#
# 实测（2026-09-21）：**143 条**，摘要中位 158 字、最长 445 字。
#
# 形态：feed_mode=hot（实时流语义，同 guardian_rss）。归 world_news 族——
# 与 hot_trending（热榜）分族，避免同族 max_per_family=2 把本地源互相挤掉。
# 语言由 langs 声明，路由按查询语言选源（见 route._lang_aware_combo_order）。
#
# 验证:
#   python3 scripts/engine_validate.py --engine elpais --stage all --admit
#   python3 scripts/search.py "noticias de hoy" --engine elpais --json

engine_id: elpais
type: rss_feed
enabled: true
cost_tier: free
label: 西班牙国家报 RSS
family: world_news
feed_mode: hot
relevance_check: false
priority: 43
qps: 1
period: second
cost_per_call: 0.0
cost_unit: free
timeout: 12
feed_url: https://feeds.elpais.com/mrss-s/pages/ep/site/elpais.com/portada
langs:
- es
canary_query: "noticias de hoy"
coverage:
- news
- spain
desc: "西班牙国家报（El País，西语世界发行量最大的日报，免 key）"
recommended: false

quality_queries:
  - query: "noticias de hoy"
  - query: "economía España"
