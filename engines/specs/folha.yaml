# 巴西页报 RSS — Folha de S.Paulo，巴西最大日报
#
# 补的盲区：**pt 本地一手新闻**。接入前 argo 的新闻链路只有中英源
# （google_news/guardian_rss/dw_news/france24 都是英语视角），pt 查询
# 拿不到本地一手报道。
#
# 实测（2026-09-21）：**100 条**，摘要中位 279 字、最长 514 字。
#
# 形态：feed_mode=hot（实时流语义，同 guardian_rss）。归 world_news 族——
# 与 hot_trending（热榜）分族，避免同族 max_per_family=2 把本地源互相挤掉。
# 语言由 langs 声明，路由按查询语言选源（见 route._lang_aware_combo_order）。
#
# 验证:
#   python3 scripts/engine_validate.py --engine folha --stage all --admit
#   python3 scripts/search.py "notícias de hoje" --engine folha --json

engine_id: folha
type: rss_feed
enabled: true
cost_tier: free
label: 巴西页报 RSS
family: world_news
feed_mode: hot
relevance_check: false
priority: 44
qps: 1
period: second
cost_per_call: 0.0
cost_unit: free
timeout: 12
feed_url: https://feeds.folha.uol.com.br/poder/rss091.xml
langs:
- pt
canary_query: "notícias de hoje"
coverage:
- news
- brazil
desc: "巴西页报（Folha de S.Paulo，巴西最大日报，免 key）"
recommended: false

quality_queries:
  - query: "notícias de hoje"
  - query: "política Brasil"
