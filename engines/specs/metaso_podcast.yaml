# 秘塔 AI 搜索 · 播客档（官方 API）
#
# 上游与鉴权同 metaso.yaml：POST https://metaso.cn/api/v1/search，鉴权头
#   Authorization: Bearer {ARGO_METASO_API_KEY}。计价按次扣积分，与返回条数无关
#   （实测 size=3 与 size=20 同价），故 size 固定取满，条数裁剪交给调用方 n。
#
# 结果形态：podcasts[] —— title/link/score/snippet/position/authors/date/duration。
#   四处用前须知：
#   - 本档没有封面字段（与视频档不同），故不声明 item_image。
#   - date 是 ISO（YYYY-MM-DD），但 metaso 家族未列入 scripts/time_utils.py 的
#     TIME_CAPABLE_ENGINES，published_at 只作展示透传，--since/--until 不生效。
#   - duration 是秒数字符串，output_map 无对应槽位，不透传。
#   - authors 是数组，output_map 无数组槽位，不透传；snippet 实测可能为空串。
#   score 是 low/medium/high 这类字符串（非数值），透传到 upstream_score。
#
# 路由形态：explicit_only —— 只经 `argo search --engine metaso_podcast` 显式调用，
#   不参与任何域的自动选择。
#
# 验证:
#   python3 scripts/engine_validate.py --engine metaso_podcast --stage all --admit --write-doc

engine_id: metaso_podcast
type: http
enabled: true
explicit_only: true
cost_tier: low
method: POST
url: https://metaso.cn/api/v1/search
timeout: 15
canary_query: "人工智能"
label: 秘塔搜索（播客）
family: misc_vertical
priority: 32
cost_per_call: 0.03
cost_unit: cny
required_env:
  - ARGO_METASO_API_KEY

headers:
  Authorization: Bearer {ARGO_METASO_API_KEY}
  Content-Type: application/json

body:
  q: "{query}"
  scope: podcast
  size: 20

output_map:
  items: podcasts
  item_title: title
  item_url: link
  item_summary: snippet
  item_published_at: date
  item_upstream_score: score

coverage: [media, culture]

quality_queries:
  - query: "人工智能"
  - query: "经济史"
