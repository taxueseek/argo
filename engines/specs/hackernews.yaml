engine_id: hackernews
enabled: true
label: HackerNews
cost_tier: free
qps: 5
priority: 16
period: second
cost_per_call: 0.0
cost_unit: free
coverage:
- tech
- news
- discussion
- english
desc: Hacker News（Algolia API，科技新闻+讨论）
timeout: 8
type: http
method: GET
url: "https://hn.algolia.com/api/v1/search"
query_param: query
extra_params:
  tags: story
  hitsPerPage: 10
url_template: "https://news.ycombinator.com/item?id={objectID}"
format_is_query_param: false
output_map:
  items: hits
  item_title: title
  # url 为空的讨论帖交给 url_template 用 objectID 拼（原 builder 同款兜底）
  item_url: url
  url_template: "https://news.ycombinator.com/item?id={objectID}"
  # 拼接模板：原 builder 的 `score: N | comments: N | by: author`
  item_summary_template: "score: {points} | comments: {num_comments} | by: {author}"
