engine_id: openalex
enabled: true
label: OpenAlex
cost_tier: free
qps: 2
priority: 39
period: second
cost_per_call: 0.0
cost_unit: free
coverage:
- academic
desc: OpenAlex 2.5亿+论文索引（免认证，礼貌池 mailto）
extra_params:
  # mailto 运行时由 engines_http.contact_email() 注入（ARGO_CONTACT_EMAIL）；
  # 未配置则参数不发送，礼貌池降级为普通池。此键只声明礼貌池意图。
  mailto: ''
  per_page: '{n}'
method: GET
query_param: search
timeout: 12
type: http
url: https://api.openalex.org/works
output_map:
  items: results
  item_title: title
  # doi 是真实可点击链接(https://doi.org/...)——此前映射 id 是 OpenAlex 内部
  # URL(https://openalex.org/W...),证据链断在自家 ID 上(2026-11-20 审计)
  item_url: doi
  # 摘要位此前只有 publication_year 一个数字,证据密度为零;摘要倒排
  # (abstract_inverted_index)是 dict 需代码重组,声明式给不出,退而拼
  # 「年份 · 期刊名」;缺期刊名的条目由模板折叠分隔符,退化为年份
  item_summary_template: "{publication_year} · {primary_location.source.display_name}"
headers:
  User-Agent: argo-search
