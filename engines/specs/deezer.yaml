# Deezer 音乐艺人/专辑（免认证）
# 补 media_search 域：现有 qq_music（华语）、itunes（Apple 生态）、musicbrainz（元数据），
# Deezer 补欧洲/西语圈曲库与粉丝量维度。
# 验证:
#   python3 scripts/engine_validate.py --engine deezer --stage all --admit --write-doc

engine_id: deezer
type: http
enabled: true
cost_tier: free
timeout: 15
method: GET
url: "https://api.deezer.com/search/artist"
query_param: q
format_is_query_param: false
output_map:
  items: data
  item_title: name
  item_url: link
  item_summary: type
  item_image: picture_medium
canary_query: "radiohead"
desc: "音乐艺人/专辑（Deezer，免认证）"
coverage: [media, music, entertainment]
recommended: false
latency_ms: 2000

quality_queries:
  - query: "radiohead"
  - query: "coldplay"
