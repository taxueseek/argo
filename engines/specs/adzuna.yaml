# Adzuna 职位搜索 API（免费注册：developer.adzuna.com → app_id + app_key）
# 覆盖 16 国：GB/US/CA/AU/DE/FR/NL/BE/IE/AT/CH/ZA/BR/IN/RU/PL
# 能力：按关键词+国家搜索在招岗位，返回标题/公司/薪资/地点/描述/URL
# 实现：scripts/adzuna.py（纯标准库，输出结构化 YAML）
# 验证：
#   export ARGO_ADZUNA_APP_ID=xxx ARGO_ADZUNA_APP_KEY=yyy
#   python3 scripts/engine_validate.py --engine adzuna --stage all --admit
#   python3 scripts/search.py "software engineer" --engine adzuna --json

engine_id: adzuna
type: cli
enabled: true
cost_tier: free
label: Adzuna 职位搜索
desc: Adzuna 聚合职位搜索（16 国，免 Key 注册：developer.adzuna.com，标题/公司/薪资/地点/URL）
canary_query: "software engineer"
cmd:
- python3
- scripts/adzuna.py
search_args:
- '{query}'
- --n
- '{n}'
output_format: yaml
timeout: 15
family: job_career
required_env:
  - ARGO_ADZUNA_APP_ID
  - ARGO_ADZUNA_APP_KEY
