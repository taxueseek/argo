# ClawHub — OpenClaw 技能生态聚合搜索（skill 域，GET JSON，keyless）
# 聚合器：索引含 OpenClaw 原生技能 + skills.sh（Vercel 生态）条目，
# 与 redskill（小红书生态）/ skillsmp（独立索引）互补不重复（不同上游）。
# downloads 是其生态下载量口径，与 skills.sh 安装遥测、SkillsMP 仓库星数互不可比。
# canonicalUrl 为站内相对路径，经 url_template 拼接为完整 URL。
# 验证:
#   python3 scripts/engine_validate.py --engine clawhub --stage all --admit --write-doc

engine_id: clawhub
type: http
enabled: true
cost_tier: free
label: ClawHub 技能目录
family: misc_vertical
priority: 50
qps: 2
period: second
limit: null
cost_per_call: 0.0
cost_unit: free
method: GET
url: https://clawhub.ai/api/search
timeout: 15
canary_query: "git commit"
coverage:
- skill
- developer
- tech
desc: "ClawHub 技能生态聚合搜索（OpenClaw 原生 + skills.sh 条目，免认证，下载量口径）"
format: json
query_param: q
extra_params:
  limit: "{n}"
output_map:
  items: results
  item_title: displayName
  item_url: canonicalUrl
  item_summary: summary
  # 可验证出处：install.reference 是 `owner/slug` 形式的安装引用，比
  # canonicalUrl 市场页更接近「装什么」（sourceUrl 多为 null 故不取）。
  item_upstream: install.reference
  # updatedAt 是 epoch **毫秒**（SkillsMP 同名字段是秒，差 1000 倍，由
  # engines_base._normalize_epoch 按量级归一成日期）。
  item_published_at: updatedAt
  url_template: "https://clawhub.ai{canonicalUrl}"
quality_queries:
  - query: "git commit"
  - query: "code review"
  - query: "pdf"
