name: ci

# 四个作业对应四类风险，不是四份重复跑：
#   gates  —— 门禁本身（体积/静态/口径/路由漂移），改配置或文档最先红
#   unit   —— 全量用例分 4 片，PR 反馈目标 3 分钟内
#   extras —— 九件可选依赖装全之后再跑一遍（unit 只装测试所需的三件）
#   smoke  —— 干净环境下的入口冒烟：CLI 包装、MCP 入口、引擎清单
#
# 不在 PR 上跑的东西：live 引擎（配额/反爬/fork 无 secret）、nightly 录制
# （见 nightly.yml）。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    paths-ignore:
      - "docs/**"
      - "docs-local/**"
      - "assets/**"
      - "README*.md"
      - "LICENSE"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 门禁里有一批中文口径检查（引擎目录、五语文案对账），locale 必须固定；
  # 时区同理：「7d」这类时间窗按本地时区算会跨日漂移。
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  TZ: Asia/Shanghai
  PYTHONDONTWRITEBYTECODE: "1"
  ARGO_USAGE_LOG: "0"

jobs:
  gates:
    name: gates（七道快门禁）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          # 与仓内 .python-version 一致：门禁的判定标准必须可复现，解释器版本
          # 漂移会让同一份代码在不同作业里跑出不同结果。
          python-version: "3.14"
          # uv.lock 是依赖真源；缓存命中判定看 lock 内容，不看 requirements
          # 清单（后者由 test_dependency_source_gate 与 lock 机械对账）。
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --group dev
      - name: 与本地完全相同的七道门（scripts/pre-commit 可直接独立运行）
        run: bash scripts/pre-commit

  unit:
    name: unit（分片 ${{ matrix.group }}/4）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --group dev
      - name: 系统依赖（local-seek 用 rg；缺了会退回 grep 并红 5 条）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - name: pytest（按历史耗时切片）
        run: >
          .venv/bin/python -m pytest
          --splits 4 --group ${{ matrix.group }}
          --durations-path tests/.test_durations
          --timeout=120
          --junitxml=junit-${{ matrix.group }}.xml
      - name: 保留 JUnit（失败也要留，flaky 历史靠它）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.group }}
          path: junit-${{ matrix.group }}.xml
          if-no-files-found: warn

  extras:
    name: extras（可选依赖装全 · 分片 ${{ matrix.group }}/4）
    # 实测：装九件约 5 分钟（已用 venv 缓存压掉），全量用例在 2 核 runner 上约 8 分钟。
    # 8 分钟进 PR 会把「2 分钟反馈」变成「8 分钟」，所以只在 push main 与手动触发时跑；
    # 与 unit 同样切 4 片，四片并行后关键路径回到 3 分钟内（Actions 计费按实际秒数，不额外翻倍）。
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          cache-dependency-glob: uv.lock

      # 缓存整个 venv，而不是 uv 的下载缓存：九件里 pymupdf/rapidocr 体积大，
      # 命中下载缓存仍要解包安装约 3 分钟；直接复用装好的 .venv 只花解压时间。
      # key 里带 uv.lock 的 hash：lock 变了就重建，不会装上旧版本（lock 是依赖
      # 真源，requirements 清单由 test_dependency_source_gate 与它对账）。
      # 四个分片共用同一个 key，各自并行解压（实测命中后安装步骤整体跳过）。
      - name: 恢复 venv（命中则跳过安装）
        id: venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: extras-venv-${{ runner.os }}-py314-${{ hashFiles('uv.lock') }}

      # 不信缓存声明，直接试导入：runner 镜像换 Python 补丁版后，旧 venv 的
      # 解释器路径会失效，而 cache-hit 仍然是 true——只信 key 会让整轮红在一个
      # 与代码无关的地方。探针失败就重建，自愈。
      - name: 依赖探针
        id: deps
        run: |
          if .venv/bin/python -c "import bs4, curl_cffi, fitz, openpyxl, pdfplumber, pypdfium2, rapidocr" 2>/dev/null; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "venv 可用，跳过安装"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装依赖（缓存未命中或旧 venv 失效时）
        if: steps.deps.outputs.ready != 'true'
        run: |
          rm -rf .venv
          time uv venv .venv --python 3.14
          time uv pip install --python .venv/bin/python -r requirements-dev.txt -r requirements-optional.txt

      - name: 系统依赖（local-seek 用 rg；缺了会退回 grep 并红 5 条）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: 装全之后仍要全绿（unit 只装测试所需的三件）
        run: >
          .venv/bin/python -m pytest
          --splits 4 --group ${{ matrix.group }}
          --durations-path tests/.test_durations
          --timeout=120 -m "not live and not slow"
          --junitxml=junit-extras-${{ matrix.group }}.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-extras-${{ matrix.group }}
          path: junit-extras-${{ matrix.group }}.xml
          if-no-files-found: warn

  smoke:
    name: smoke（干净环境入口）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: uv sync --frozen --group dev
      - name: 入口冒烟（全部不联网）
        run: |
          node --check bin/argo.js
          npm pack --dry-run > /dev/null
          python bin/argo --version
          python bin/argo paths
          python scripts/search.py --list-engines > /dev/null
          python -c "import sys; sys.path.insert(0, 'scripts'); import mcp_tools; assert mcp_tools.TOOLS"
      - name: 陌生环境的第一个坑：状态目录可建可写
        run: |
          export ARGO_STATE_DIR="$RUNNER_TEMP/argo-state"
          python bin/argo search --list-engines > /dev/null
          test -d "$ARGO_STATE_DIR" || mkdir -p "$ARGO_STATE_DIR"
          touch "$ARGO_STATE_DIR/.probe" && rm "$ARGO_STATE_DIR/.probe"
