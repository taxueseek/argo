name: nightly

# 夜间三件事，对应 PR 上不该跑的三类成本：
#   replay —— 用库里已有的录制数据离线重跑整条管线（确定性，1 秒级）
#   drift  —— 联网重录固定查询集，与固定基线比「结构回归」（条数地板 /
#            零结果 / 整条消失）。体积漂移只记录不判：活网换血是常态，
#            2026-10-28 夜四条查询三条整批换血（issue #35）即误报实证。
#            基线保持固定锚点，不夜夜自动滚动覆盖（防 5→4→3→2→1 温水煮青蛙与
#            bot 每日直推 main 污染分支）。
#   ledger —— argo stats 的时延与命中率落成曲线
#
# 为什么不在 PR 上跑：免费源会被 CI 出口 IP 限流或反爬，fork 也拿不到 secret。
# 为什么单独用 drift 而不是 --check：录制只保留「当时真正被调到」的引擎，
# 而重放是瞬时完成，早停时机与真跑不同，会去要一个当时没调过的引擎，报成
# 「没录到」。那是录制机制的正常边界，不是回归——数值抖动同理，门只判结构回归。

on:
  schedule:
    - cron: "30 18 * * *" # UTC 18:30 = 北京 02:30
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  TZ: Asia/Shanghai
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  replay:
    name: 离线重放（录制数据 + 下限）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: 整条管线重放（不联网）
        run: python scripts/replay_eval.py --data tests/golden/pipeline_golden.json --check

  drift:
    name: 联网漂移（固定查询集）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt

      - name: 重录固定查询集
        run: |
          python scripts/replay_eval.py --record \
            --queries-file tests/golden/drift_queries.txt \
            --out "$RUNNER_TEMP/drift-$(date -u +%F).json"

      - name: 生成报告并与基线对比
        run: |
          python scripts/replay_eval.py --data "$RUNNER_TEMP"/drift-*.json --json > drift_report.json
          python scripts/replay_eval.py --data "$RUNNER_TEMP"/drift-*.json --json \
            --compare tests/golden/drift_baseline_report.json > drift_diff.json

      - name: 结构回归门（条数地板 / 零结果 / 整条消失；体积只记不判）
        run: |
          python scripts/ci_drift_gate.py \
            --baseline tests/golden/drift_baseline_report.json \
            --current drift_report.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-reports
          path: |
            drift_report.json
            drift_diff.json
          if-no-files-found: warn

  source-canary:
    name: 源交付验收（零结果即失败）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      # 为什么单开一栏：路由测试只能证明「选中了这个源」，证明不了「它交得出
      # 解析结果」。这里守的是 API 形态/解析层零交付（空结果、字段缺失、源改名）。
      # 英文 canary 证明不了中文覆盖——语言覆盖由 spec 的 langs 与路由契约测试
      # 负责，不要指望这一栏替它背书。
      # --strict：skipped（缺 key/被禁用/源改名）也算失败；否则门禁会在关键源
      # 消失时静默全绿。
      - name: 关键源必须交出解析结果（不只 HTTP 200）
        run: |
          python3 scripts/engine_validate.py \
            --engines anysearch,tavily_free,parallel_free,firecrawl,dshopen,deepseek1024,dsh_hub,explainx,skills_sh,skillsmp,clawhub \
            --stage health --json --strict

  ledger:
    name: 账本（时延 / 结果率）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: 导出指标
        id: metrics
        run: |
          python bin/argo stats > stats.json
          python - <<'PY'
          import json
          import os

          d = json.load(open("stats.json"))["query"]
          samples = int(d.get("samples") or 0)
          rows = []
          # 全新 runner 没有使用日志：samples=0 时指标为 None（不是 0）。
          # 空数据不喂给 benchmark-action——0ms 会被画成一条比真实值好得多
          # 的假曲线，也会让下游以为「今天变快了」。没有样本就不记点。
          if samples and d.get("avg_elapsed_ms") is not None:
              rows = [
                  {"name": "avg_elapsed_ms", "unit": "ms", "value": d["avg_elapsed_ms"]},
                  {"name": "result_rate", "unit": "ratio",
                   "value": round((d.get("result_rate") or 0) * 100, 2)},
              ]
          open("bench.json", "w").write(json.dumps(rows))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"samples={samples}\n")
          PY
      # 首次启用曲线：仓库里要有 gh-pages 分支（或把 auto-push 打开）。
      # 现在只产出报告，不让夜间任务因为缺分支而红。
      - uses: benchmark-action/github-action-benchmark@v1
        if: steps.metrics.outputs.samples != '0'
        with:
          tool: customSmallerIsBetter
          output-file-path: bench.json
          auto-push: false
          comment-on-alert: false
          fail-on-alert: false
      - uses: actions/upload-artifact@v4
        with:
          name: ledger
          path: |
            stats.json
            bench.json

  notify:
    name: 夜间失败开 issue
    needs: [replay, drift, ledger]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `nightly 失败 ${new Date().toISOString().slice(0, 10)}`,
              body: `夜间任务失败：${run}\n\n先看 drift 作业的 artifact（drift_report.json / drift_diff.json），再看 replay 的下限报错。`,
            });
