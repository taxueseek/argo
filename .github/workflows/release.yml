name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  TZ: Asia/Shanghai
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  publish-release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          cache-dependency-glob: uv.lock

      - name: Install build dependencies
        run: |
          uv sync --frozen --group dev
          uv pip install --python .venv/bin/python build

      # 发布内容门禁前移（2026-11-06）：v2.11.2 实证 tag 推送后 main CI 才红
      # （五语 README 段落缺失 + bump 测试硬编码版本号），发布 7 分钟后出补丁。
      # 全量套件里的发布内容检查在这里先跑，红则中止发布，不再「发了再补」。
      - name: Release content preflight (release.py check + bump tests)
        run: |
          .venv/bin/python scripts/release.py check
          .venv/bin/python -m pytest -q tests/test_release_script.py tests/test_release_consistency.py

      - name: Run pre-commit gates verification
        run: |
          bash scripts/pre-commit

      - name: Build release assets
        run: |
          bash scripts/build_release_assets.sh

      - name: Resolve release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="docs/RELEASE_NOTES_${tag}.md"
          if [ -f "$notes" ]; then
            echo "path=$notes" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # 有版本化发布说明时以它为准：正文里的致谢（issue 报告者）不会出现在
      # GitHub 自动生成的 notes 里——后者只按 PR/commit 作者生成。
      - name: Create GitHub Release (versioned notes)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') && steps.notes.outputs.found == 'true'
        with:
          files: |
            dist/*
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: false

      # 没有同名发布说明时保持旧行为。
      - name: Create GitHub Release (generated notes)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') && steps.notes.outputs.found != 'true'
        with:
          files: |
            dist/*
          generate_release_notes: true

  publish-npm:
    name: Publish npm packages
    needs: publish-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      # 仓库密钥里配好 NPM_TOKEN（npm automation token）后自动发布；
      # 没配时跳过而不是让 release job 变红，历史 tag 重跑也不至于卡死。
      - name: Check NPM_TOKEN
        id: token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::warning::NPM_TOKEN 未配置，跳过 npm 发布"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify package versions match tag
        if: steps.token.outputs.skip != 'true'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          root=$(node -p "require('./package.json').version")
          dsh=$(node -p "require('./packages/dsh-plugin/package.json').version")
          echo "tag=$tag root=$root dsh=$dsh"
          if [ "$root" != "$tag" ] || [ "$dsh" != "$tag" ]; then
            echo "::error::版本号与 tag 不一致，先统一版本再打 tag"
            exit 1
          fi

      # npm 对已存在的版本会 403，重跑同一 tag 时按「已发布」跳过。
      - name: Publish argo-search
        if: steps.token.outputs.skip != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "argo-search@$v" version >/dev/null 2>&1; then
            echo "argo-search@$v 已发布，跳过"
          else
            npm publish
          fi

      - name: Publish @taxueseek/argo-dsh
        if: steps.token.outputs.skip != 'true'
        working-directory: packages/dsh-plugin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "@taxueseek/argo-dsh@$v" version >/dev/null 2>&1; then
            echo "@taxueseek/argo-dsh@$v 已发布，跳过"
          else
            npm publish
          fi

