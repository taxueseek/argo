  - '(?i)(WHO|世界卫生组织).{0,12}(通报|疫情|卫生|指标|统计)'
  - '(?i)(公共卫生|卫生指标|疾病负担|发病率|死亡率|卫生统计)'
- desc: 医学/临床试验/药品标签
  engines_combo:
  - clinicaltrials
  - anysearch
  - openfda
  - local_pubmed
  - wikipedia
  - who_don
  - who_gho
  fallback: clinicaltrials
  name: medical
  parallel: true
  patterns:
  - (?i)(临床试验|clinical trial|nct\d+|clinicaltrials\.gov|openfda|fda 药品|药品说明书|药物标签|drug label|适应症|不良反应)
  - match: '(?i)(medicine|pharmaceutical|dosage|contraindication|药物|药品|处方药|\botc\b)'
    unless: '@commercial_market'
  - match: '(?i)(症状|用药|适应症|临床|临床指南|诊疗指南|医学指南|用药指南|治疗指南|副作用|禁忌|诊断|治疗|病因)'
    unless: '@commercial_market'
  # 2026-10-25 补：药品说明书/用法用量类——实测「某药 说明书 用法用量」被
  # code_search 的「用法」子串抢走（GitHub/MDN 答不了药）。unless 锁软件/
  # 硬件语境的说明书。code_search 同日加了对应药品语境 unless，两处成对。
  - match: '(?i)(说明书|用法用量|服用剂量|一次吃多少|一天几次)'
    unless: '(?i)(软件|硬件|固件|安装|接口|\bAPI\b|\bAPP\b|app|产品说明)'
  - '(?i)(WHO|世界卫生组织).{0,12}(通报|疫情|卫生|指标|统计)'
  - '(?i)(公共卫生|卫生指标|疾病负担|死亡率|发病率|卫生统计)'
  primary: clinicaltrials
