  # 源保底分：书目结果是「答案型」，书名对查询词的 token 覆盖率天然低
  # （「三体全集」vs「科幻小说推荐」），不保底会被列表页碾压
  score_floors:
    weread: {relevance: 0.6}
    douban_book: {relevance: 0.6}
    open_library: {relevance: 0.6}
- desc: 影视/电影/剧集（IMDb 主 + 豆瓣中文视角，先于音乐媒体域，避免电影误走 iTunes 音乐）
