- desc: 书籍/图书搜索（微信读书 + 豆瓣读书 + Open Library + Gutenberg）
  engines_combo:
  - weread
  - douban_book
  - open_library
  - gutenberg
  - anysearch
  - k10plus
  fallback: anysearch
  name: book_search
  parallel: true
  no_early_stop: true
  patterns:
  - (?i)(小说|书籍|图书|书单|好书|荐书|书荒|名著|畅销书|电子书|看书|出版社|ISBN|小说推荐|科幻小说|推理小说)
  - (?i)\b(book|isbn|ebook|bestseller)\b
