- desc: 图片/素材搜索（Openverse 开放版权图库）
  engines_combo:
  - openverse
  - anysearch
  fallback: anysearch
  name: image_search
  parallel: false
  patterns:
  - (?i)(图片|壁纸|照片|图库|素材|插画|无版权|免费图片|头像|背景图|表情图|png|jpg 图片|壁纸下载)
  - (?i)\b(wallpaper|photo|image|picture|illustration|stock photo|free image)\b
  primary: openverse
- desc: 知识实体/维基数据查询
  engines_combo:
  - baidu_baike
  - wikidata
  - wikipedia
  - zh_wikipedia
  fallback: baidu_baike
  name: entity_search
  parallel: true
  patterns:
  - (?i)(维基数据|wikidata|知识实体|实体查询|词条实体|QID|SPARQL|知识图谱|百度百科)
  - (?i)(是哪家公司|哪家机构|什么组织|属于哪个|隶属于|总部在哪)
  primary: wikidata
- desc: 知乎个人数据（本人创作/收藏/关注——个人创作运营与素材回溯；结构化路径不混 web 源）
  engines_combo:
  - zhihu_user
  fallback: zhihu_user
  name: zhihu_user_data
  parallel: false
  patterns:
  - (?i)(我的知乎|知乎我的|我的创作|个人主页数据)
  - (?i)我(的)?(文章|回答|想法|视频|提问|收藏|收藏夹|关注的人|关注列表)
  primary: zhihu_user
- desc: 知乎/观点/经验/评测
  engines_combo:
  - zhihu
  - zhihu_global
  - anysearch
  fallback: anysearch
  name: zhihu_content
  parallel: true
  patterns:
  - (?i)(知乎|怎么看待|如何评价|体验|评测|对比|推荐|哪个好|值得买|好不好|要不要|推荐吗|求推荐|有什么)
  primary: zhihu
- desc: 学术论文搜索
  # openreview/biorxiv 曾长期是「已实现但无域引用」的孤儿源：只能靠
  # `--engine` 显式调用，自动路由永远选不中。AI/ML 顶会评审（OpenReview）
  # 与生物医学预印本（bioRxiv/medRxiv）是通用学术检索补不上的盲区——
  # 普通网页搜索在这个问题上给的是博客和二手解读。
  #
  # 排序由 fast 档的真实约束决定，不是审美问题：budget=2 且 must_keep=[primary]
  # 会「腾位」（挤掉末位非保底成员），最终只有 2 个源能跑。实测三种排法：
  #   primary=arxiv      + [arxiv, openreview, biorxiv, ...] → arxiv + openreview
  #   primary=openreview + [openreview, biorxiv, arxiv, ...] → openreview + biorxiv
  #   primary=arxiv      + [arxiv, openalex, ..., openreview] → arxiv + openalex（丢新源）
  # 取第一种：保住 arxiv（覆盖最广），同时把 openreview 顶进可见位；biorxiv 留第 3
  # 位，deep/research 不截断时参与（实测 deep 跑 openreview+arxiv+biorxiv）。
  # primary 必须落在前 2 位内，否则 must_keep 腾位反会把新源挤出去。
  engines_combo:
  - arxiv
  - openreview
  - biorxiv
  - openalex
  # 2026-09-19 追加，插在**第 5/6 位**——这个位次是算出来的，不是审美：
  # route._new_source_extra 的加槽额度 = min(最深新源位次 - base, cap)，
  # cap 在 auto/balanced 档为 4、base 为 3，故「两个新源都能进 kept」要求
  #   最深位次 <= base + cap = 7。
  #   · 放队尾（位次 9/10）→ 额度被封顶到 4、预算 7 < 9，两源全被截断
  #     （表现为「装了但路由不带它」，test_new_source_reachability 会红）
  #   · 放第 3/4 位 → 预算够，但会把 biorxiv 挤出 fast 档（实测 deep 档
  #     combo 缩到 [arxiv, openreview, local_pubmed, core]，是真回归）
  #   · 放第 5/6 位 → deepest=6、extra=min(3,4)=3、预算 6，恰好覆盖且
  #     arxiv/openreview/biorxiv/openalex 前四位次一律不动
  #     local_pubmed — 生物医学全文；此前是坏源（实测 0 条 / HTTP 400），本次修复
  #     core         — 开放获取全文 + PDF 直链，补「元数据之外的全文层」
  - local_pubmed
  - core
  - cinii
  - crossref
  - europepmc
  - dblp
  - semantic_scholar
  fallback: openalex
  name: academic
  parallel: true
  patterns:
  # 中文论文语境词此前是缺口：规则里有英文 preprint，却没有「预印本」。
