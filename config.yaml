    unless: '@commercial_market'
  - match: '(?i)(chemical\s+formula|molecular\s+weight|iupac|cas\s+number|compound|\bdrug\b|molecule|smiles)'
    unless: '@commercial_market'
  primary: pubchem
  early_stop_min_results: 1
- desc: 生物物种检索
  engines_combo:
  - gbif
  - iplant
  - wikipedia
  - obis
  - worms
  fallback: wikipedia
  name: species_search
  parallel: false
  patterns:
  - (物种|学名|生物分类|拉丁名|界门纲|科属种|动物志|植物志|濒危)
  - (?i)(species|scientific\s+name|taxonomy|taxon|binomial|endangered\s+species)
