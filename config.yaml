  name: scholar_search
  parallel: false
  patterns:
  - (?i)(google.?scholar|学术论文|论文搜索|research.*paper|journal.*article)
  # 触发词只描述**检索意图**，不引用任何具体站点——尤其是盗版/影子图书馆
  # 类站点名。配置是公开产物，出现站名既无功能价值（意图词已足够触发本域），
  # 又会把本仓牵进它并不提供的服务：本域只把查询送往 google_scholar/arxiv。
  # 门禁见 tests/test_public_config_compliance.py（双向锁定：既禁站名，
  # 也要求下载意图词仍在，防「禁站名」被偷换成「删能力」）。
  - (?i)(学术文献|学位论文|会议论文|论文下载|下载论文|文献下载|文献获取|全文获取)
