# 本机状态（临时停用某引擎、本机路径、本机调优）不要写在这里——config.yaml 随
# argo 发版，写了会推给所有用户。改用同目录的 config.local.yaml（已 gitignore，
# 见 config.local.yaml.example）：只写要改的键，深度合并，优先级最高。
cache:
  # db_path 刻意不写默认值：路径由 argo_paths 按平台惯例派生（Windows
  # %LOCALAPPDATA%/unified-search；POSIX 遵循 $XDG_CACHE_HOME，已存在的历史目录
  # ~/.cache/unified-search 继续沿用）。写死一个值会盖掉这套惯例——此前这一行就是
  # literal ~/.cache/unified-search/cache.db，等于让 XDG / LOCALAPPDATA 永远轮不到
  # 生效。要固定位置（多机共享、只读挂载、显式换目录）再取消注释改成自己的路径：
  # db_path: ~/.cache/unified-search/cache.db
  enabled: true
  max_size_mb: 200
  ttl: 3600
# 通用兜底候选池（无匹配域时使用）。只声明「谁有资格进池」，顺序不是优先级：
# 优先级由 scripts/source_selection.py 按 2026-10-26 实测先验 × 自适应分排序。
# 池子不含 local_baidu（实测 4/4 零结果）与 wikipedia（查词条不是通用搜索）：
# 它们留在池里只会在研究档占一次调用。keenable_free 暂不进池（2026-10-26
# 实测一条城市查询返回地名错配，待复测）。octen 保留在末尾——它是通用源，
# 额度耗尽时由配额层自动跳过，不该因为某台机器余额为空就从公共配置里删掉。
# deepseek_search 是付费候选：预算内才进池，fast/budget 永不进，日常预算
# 截断到 2 时通常轮不到，研究档参与；预算耗尽自动跳过（5 元/月≈1000 次）。
# recovery L3 仍用 engine_policy.GENERAL_FREE_FALLBACK，不受这里影响。
general_fallback:
  engines:
  - yuanbao
  - tavily_free
  - parallel_free
  - firecrawl
  - anysearch
  - uapi
  - local_bing
  - octen
  - deepseek_search
domains:






- desc: 小红书 REDSkill 技能检索/排行
  engines_combo:
  - redskill
  - anysearch
  fallback: anysearch
  name: redskill_search
  parallel: false
  patterns:
  - '(?i)(REDSkill|红[书薯]技能|小红书.*(skill|技能))'
  # 小红书技能的**实际用途**远不止「技能」二字：封面、文案、模板、笔记、
  # 带货、种草都是它覆盖的任务（实测 allSkills 里最大宗就是这些）。收窄到
  # 只认「小红书 + 这些词」，既让「找小红书技能」的查询更准，也不抢通用
  # 技能域的预算——redskill 已同时从 skill_search 的 combo 里移除。
  - '(?i)(小红书|xhs)\s*[的]?\s*(封面|文案|模板|笔记|带货|种草|口播|脚本)'
  - '(?i)(技能(排行|榜单|排行榜)|skill.*(rank|排行|榜))'
  primary: redskill
- desc: 跨生态 Agent 技能搜索（SkillsMP/ClawHub/explainx/skills.sh）
  engines_combo:
  - skillsmp
  - clawhub
  - explainx
  - skills_sh
  - anysearch
  fallback: anysearch
  name: skill_search
  parallel: true
  patterns:
  - '(?i)(agent\s*skills?|技能(搜索|检索|市场|目录|库)|找(个|一?个)?技能|装(个|一?个)?技能|claude\s*skill|codex\s*skill|dsh\s*skill|skills?\.sh|skillsmp|clawhub)'
  primary: skillsmp
  # 域级源保底分。为什么需要：skills.sh 的 installs 与 explainx 的安装量是
  # 「这个技能有多少人在用」的硬指标，而摘要里带着它；但五维精排的相关性
  # 维度比对文本，通用源的文章标题更容易命中查询词，会把带安装量的技能
  # 条目挤下去（与 dsh_plugin_search 同一现象）。保底让「有安装量数据」的
  # 两个源不被纯文本匹配埋没。authority/freshness 仅在 evidence 可用时生效。
  score_floors:
    explainx: {relevance: 0.85, authority: 0.85, freshness: 0.8}
    skills_sh: {relevance: 0.85, authority: 0.85, freshness: 0.8}
- desc: DSH 插件搜索（DeepSeek Harness 插件目录）
  engines_combo:
  - dshopen
  - deepseek1024
  - dsh_hub
  - anysearch
  fallback: anysearch
  name: dsh_plugin_search
  parallel: true
  patterns:
  - '(?i)(dsh\s*(插件|plugin)|deepseek\s*harness\s*(插件|plugin)|dshopen)'
  - '(?i)(dsh\s*插件(市场|目录|大全|推荐|排行|有哪些))'
  primary: dshopen
  # 域级源保底分。为什么需要：插件目录是「答案型」结果——用户找的是**可装的
  # 东西**，不是关于插件的文章。而五维精排的「相关性」维度比对文本，通用源的
  # 文章标题恰好含「DSH 记忆插件」全词，插件条目的摘要只写功能（「为 DSH 接入
  # 记忆服务」），实测同批条目会被文章挤到 top-6 之外（RRF 阶段插件全赢，
  # 五维重排后全输）。relevance 保底让插件不被文本匹配埋没；authority/
  # freshness 保底抵消「插件发布时间早于文章」带来的时效劣势（后两维仅在
  # evidence 可用时生效，与既有各域同口径）。
  score_floors:
    dshopen: {relevance: 0.9, authority: 0.9, freshness: 0.85}
    deepseek1024: {relevance: 0.9, authority: 0.9, freshness: 0.85}
    dsh_hub: {relevance: 0.85, authority: 0.85, freshness: 0.8}
