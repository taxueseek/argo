- desc: 中文百科（百度百科 + 中文维基）
  engines_combo:
  - baidu_baike
  - zh_wikipedia
  - wikidata
  - europeana
  fallback: baidu_baike
  name: cn_encyclopedia
  parallel: true
  patterns:
  - (?i)(百度百科|baike\.baidu|百科词条|查百科|词条解释)
  # 「…是什么？」尾巴会把两类非百科查询整类吃进来（2026-10-31 评测实测）：
  # 比较决策（「A 和 B 的区别/优劣/怎么选是什么」）与获奖/得主类新闻
  # （「2026年XX奖得主…获奖理由是什么」）。触发词本身留着的理由：真百科
  # 点查（「蝴蝶效应是什么」）仍需它；因此用同宽度的 unless 逐例否决，
  # 显式点名百科的查询仍由上一条触发词接住。
  - match: '(?i)(是什么(?!梗)|什么是|简介|定义一下).{0,8}$'
    unless: '@compare_or_award'
  primary: baidu_baike
- desc: 词典查询（英文 dictionaryapi + 中文汉典 + wikipedia）
  engines_combo:
  - free_dictionary
  - wikipedia
  - zdic
  - tatoeba
  fallback: wikipedia
  name: dictionary_search
  parallel: false
  patterns:
  - (?i)(词典|字典|英英|英汉词典|英文单词|单词.*意思|英文.*意思|怎么读|咋读|读音|查词|define|definition|dictionary|meaning of|the word)
  - (?i)\b[a-z]{3,}\b\s*什么意思|什么意思\s*\b[a-z]{3,}\b|[a-zA-Z]{3,}.*(意思是什么|的意思)
  primary: free_dictionary
- desc: 动漫/二次元（Bangumi 条目元数据 + 萌娘百科）
  engines_combo:
  - moegirl
  - bangumi
  - zh_wikipedia
  - jikan
  fallback: moegirl
  name: anime_encyclopedia
  parallel: false
  patterns:
  - (?i)(萌娘百科|二次元|ACG|动漫|番剧|新番|番组|声优|手办|同人|轻小说|漫画|日本动画|新番动画|动画番剧|动画推荐|看动画|galgame|vtuber|虚拟主播|东方project|(?-i:\bFate\b))
  # 「型月」是 Type-Moon 专名，但在无空格中文里是「大模型月报」的子串：
  # 实测「AI大模型月报 2026年8月」被锁进 anime_encyclopedia，萌娘百科返回
  # 一款 2009 年的太空战略游戏。单独的型月查询仍保留。
  - match: '(?i)型月'
    unless: '(?i)(大模型|模型月报)'
