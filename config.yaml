- desc: AI 模型信息搜索（价格/上下文/能力/多模态，models.dev）
  # 通用兜底源 anysearch 必须留在前 2 位（combo_budget=2，见 security_search 注）。
  # models_dev/huggingface 均为目录型窄源，中文问法（「开源 大模型 排行」）
  # 两源皆 0；anysearch 10 条。
  engines_combo:
  - models_dev
  - anysearch
  - huggingface
  fallback: anysearch
  name: ai_model
  parallel: false
  patterns:
  - (?i)\b(LLM|GPT|Claude|Gemini|GLM|Llama|Mistral|DeepSeek|Qwen|Grok)\b
  # 2026-10-25 补 unless：综述/论文语境让位给 tech_deep（openalex/arxiv）——
  # 实测「大模型 长上下文 综述」被本域 models_dev 抢走，模型目录答不了综述。
  # 2026-11-06 补 unless：比较决策题（「A 和 B 对比/区别/哪个好」）整类让位通用域，
  # 与 cn_encyclopedia「是什么」尾巴、fact_check「是多少」尾巴共用 @compare_or_award
  # 宏的既有口径一致（2026-10-31 评测基线）。此前「模型定价对比」这类查询被
  # 本域 intent_required 的「对比」豁免词留住，models_dev 目录答不了横向对比。
  - match: '(?i)(模型|model).{0,24}(价格|定价|成本|pricing|多少钱|上下文|context|token|支持视觉|vision|能力|免费|开源)'
    unless: '(?i)(综述|survey|论文|文献|研究进展|预印本|state\s+of\s+the\s+art|SOTA)|@compare_or_award'
  - (?i)(API price|pricing|context window|token limit|vision model|tool call)
  # 点查域意图豁免词（语义见 route_domains.intent_required）
  # 扩展（2026-10-06）：意图门 token 门槛降到 4 后，4 token 的真点查
  # （「claude opus 4.5 模型」「claude api 定价」）需要意图词兜底不被误伤；
  # 学用类查询由 _DIFFUSE_SIGNAL_RE 的教程/文档/指南等词拦回，不受影响。
  intent_required: '(?i)(价格|定价|报价|pricing|多少钱|上下文|context window|token limit|vision|多模态|免费|开源|模型|model|参数|规格|版本|订阅|\bapi\b)'
  primary: models_dev
