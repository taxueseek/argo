- desc: 书籍/图书搜索（微信读书 + 豆瓣读书 + Open Library + Gutenberg）
  engines_combo:
  - weread
  - douban_book
  - open_library
  - gutenberg
  - anysearch
  - k10plus
  - dnb
  - ndl
  - local_goodreads
  fallback: anysearch
  name: book_search
  parallel: true
  no_early_stop: true
  patterns:
  - (?i)(小说|书籍|图书|书单|好书|荐书|书荒|名著|畅销书|电子书|看书|出版社|ISBN|小说推荐|科幻小说|推理小说)
  - (?i)\b(book|isbn|ebook|bestseller)\b
  primary: weread
  # 源保底分：书目结果是「答案型」，书名对查询词的 token 覆盖率天然低
  # （「三体全集」vs「科幻小说推荐」），不保底会被列表页碾压
  score_floors:
    weread: {relevance: 0.6}
    douban_book: {relevance: 0.6}
    open_library: {relevance: 0.6}
- desc: 影视/电影/剧集（IMDb 主 + 豆瓣中文视角，先于音乐媒体域，避免电影误走 iTunes 音乐）
  engines_combo:
  - imdb
  - douban_movie
  - itunes
  - wikipedia
  - wikidata
  - tvmaze
  - local_imdb
  fallback: imdb
  name: film_search
  parallel: true
  patterns:
  # 中文影视强信号；「主演/导演/编剧」覆盖 LoHo 类事实问
  - (?i)(电影|电视剧|纪录片|影视|大片|影评|影片|院线|票房|奥斯卡|金像奖|金马奖|戛纳|威尼斯电影节|剧集|连续剧|网剧|美剧|韩剧|日剧|英剧)
  - (?i)(导演|主演|演员|编剧|制片|出品|上映|首映|IMDb|imdb|豆瓣电影|影帝|影后|最佳影片)
  - (?i)\b(movie|film|tv\s*show|tv\s*series|cinema|oscar|emmy|director|screenwriter|box\s*office|netflix|hbo)\b
  - (?i)\b(starring|directed\s+by|written\s+by|released\s+in\s+\d{4})\b
  # 日韩影视触发词（修复日韩电影查询漏召；纯题材词「アニメ/애니메이션」
  # 不在此列——动漫推荐类查询 imdb 无召回，交由 general 多语回退）
  - (?i)(映画|ドラマ|主演|監督|脚本|上映|配給|アカデミー|スタジオジブリ)
  - (?i)(영화|감독|주연|출연|개봉|드라마|수상|칸|아카데미|시사회)
  primary: imdb
- desc: 体育赛事/球员/球队（先于媒体域；修复 MVP 误匹配 MV）
  # combo_budget(fast)=2 只取前 2 位。thesportsdb 偏球队/球员元数据，
  # 对「F1 积分榜」「德甲赛程比分」这类赛程/积分查询是窄源（实测
  # 2026-09-13「F1 积分榜」走 [thesportsdb] 得 0 条）。赛车（jolpica/
  # openf1）与赛程比分（openligadb）须能与主源同场竞技，且补通用兜底。
  engines_combo:
  - thesportsdb
  - jolpica
  - anysearch
  - openf1
  - openligadb
  - wikipedia
  - wikidata
  - zh_wikipedia
  fallback: thesportsdb
  name: sports_search
  parallel: true
  patterns:
  # 拉丁缩写必须带字母数字边界（lookaround 而非 \b——CJK 与拉丁之间
  # 无词边界，\b 会误伤「看NBA视频」）：yuanbao 含子串 nba、nbalive
  # 含 nba，裸 alternation 会把通用中文查询抢进体育域（实测 2026-10-02
  # 「腾讯元宝 yuanbao.com …」→ sports_search，4 个慢体育源 6.4s 且
  # 结果无关）。CJK 触发词不受影响，另补「亚运会」词条（此前漏配，
  # 「杭州亚运会场馆」落不进体育域）。
  - (?i:(?<![a-z0-9])(NBA|CBA|WNBA|NFL|NHL|MLB|MLS)(?![a-z0-9]))|(?i:(英超|西甲|德甲|意甲|法甲|中超|欧冠|亚冠|世界杯|欧洲杯|美洲杯|奥运会|残奥会|世锦赛|大奖赛|亚运会))
  - (?i)(足球|篮球|网球|排球|乒乓球|羽毛球|棒球|橄榄球|高尔夫|(?<![a-z0-9])F1(?![a-z0-9])|一级方程式|马拉松|田径|游泳|拳击|(?<![a-z0-9])UFC(?![a-z0-9])|电竞战队)
  - (?i)(决赛|半决赛|季后赛|总冠军|MVP|得分王|金靴|金球奖|转会|俱乐部|联赛|进球|助攻|夺冠|卫冕|球员|守门员|前锋|后卫)
  # 中英球队/效力语境（修复「库里 球队」「LeBron James team」「Ronaldo club」漏召）
  # 主教练/球队泛词触发（评测 n09 实测「中国男足国家队主教练现在是谁」仅靠
  # 「主教练」命中本域，fast 档 combo_budget=2 只取前两位：thesportsdb 空 +
  # jolpica 只有 F1，返回 F1 车手积分榜）。国家队语境交给通用池——中文体育
  # 新闻不在本域源里，本域也接不住。
  - match: '(?i)(球队|球星|球会|球衣|队名|队史|效力于|效力|主教练|得分手)'
    unless: '(?i)(国足|男足|女足|男篮|女排|国乒|国羽|国家队)'
  - (?i)\b(team|club|coach|roster|squad|jersey|striker|goalkeeper|midfielder|defender)\b
  - (?i)\b(world\s*cup|olympics?|championship|finals?|playoffs?|league|fixture|matchday|transfer|hat-?trick)\b
  - (?i)\b(soccer|football|basketball|tennis|baseball|cricket|rugby|golf|formula\s*1|formula\s*one)\b
  # 日韩体育触发词（修复「メッシ クラブ」「손흥민 팀」漏召）
  - (?i)(サッカー|野球|バスケ|テニス|サッカー選手|リーグ|ワールドカップ|オリンピック|クラブ|チーム|監督|選手)
  - (?i)(축구|야구|농구|테니스|월드컵|올림픽|리그|클럽|팀|감독|선수)
  primary: thesportsdb
- desc: 地理/地点/地标（OSM + 百科，先于中文 catch-all）
  engines_combo:
  - local_openstreetmap
  - wikipedia
  - wikidata
  - zh_wikipedia
  fallback: local_openstreetmap
  name: geo_places
  parallel: true
  patterns:
  # 「在哪里」在软件语境里是最常见的疑问句开头（在哪里改配置/在哪里看日志），
  # 裸命中会把排障句锁死进地理源（实测「在哪里 查看 报错 日志」拿到
  # OpenStreetMap + 维基）。「除非」（unless）只挂在这条方位词触发词上，软件
  # 语境词让方位词失效，地理查询不受影响（让位表方案会连「埃菲尔铁塔 在哪里」
  # 一起让位，见 route_domains 注释）。
  # 「位置」同理（2026-09-21 实测「日志 文件 位置」「图片 位置 居中 CSS」
  # 「元素 位置 偏移」全被锁进地理源）：中日共用的高频词，软件语境下指的不是
  # 地理方位，因此与方位词表共用同一条否决规则。
  #
  # 为什么否决必须挂在触发词上、不能挂在整个域上：本域还有「行政区划/流经/
  # 注入」这类触发词，而「行政区划代码」是货真价实的地理查询——域级否决会
  # 因为它含「代码」而把整域毙掉（2026-09-21 快照实测，3709 条查询里 3 条
  # 因此漂移）。否决的作用域必须与被否决的触发词一样窄。
  # 「总部/母公司/子公司/注册地/办公地」等企业语境词让方位词失效（2026-10-22）：
  # 「华为 总部在哪」此前命中本域，用 OSM+维基只拿到广汽/新凯来/五粮液等无关结果
  # （企业总部不是地理问题，实体库无中国民企数据，与 org_entity 2026-10-14 的
  # 尽调词排除同因）。让位后落到 entity_search（其 patterns 含「总部在哪」）。
  - match: '(?i)(在哪里|在哪儿|在哪|位于|坐落|位置|坐标|经纬度|海拔|发源地|入海口|交汇|毗邻|接壤|边境|首都|省会|直辖市|地标|名胜|景点)'
    unless: '(?i)(报错|错误|日志|失败|异常|配置|设置|安装|修改|代码|接口|参数|文档|教程|图片|元素|居中|对齐|偏移|样式|布局|按钮|窗口|表格|控件|调整|总部|母公司|子公司|注册地|办公地)'
  - match: '(?i)(山脉|河流|湖泊|海洋|岛屿|半岛|沙漠|高原|盆地|峡谷|海峡|运河|瀑布|火山|冰川|赤道|经线|纬线|时区)'
    # 「火山引擎」是云产品，不是火山地貌。2026-10-23 回放实测：
    # 「某云产品 官方 指南 火山引擎」被锁进 geo_places，主源
    # local_openstreetmap 对产品名答非所问。
    unless: '(?i)(火山(引擎|云|翻译|方舟)|volcengine|volcano\s+engine)'
  # 水系/行政区划事实（修复「黄河 流经省份」漏召）
  - (?i)(流经|途经|贯穿|横跨|流域|水系|汇入|注入|源头|入海|几省|省份|省区|行政区划|发源于)
  - (?i)(地理|地图|方位|东南西北|几公里|多远|距离.*多远|openstreetmap|nominatim|geonames)
  - (?i)\b(where\s+is|located\s+in|latitude|longitude|elevation|coordinates?|border(s|ing)?|tributary)\b
  - (?i)\b(flows?\s+through|drainage|basin|source\s+of|passes\s+through)\b
  # 自然地貌词（mountain/river/lake…）加**图片让位表**：这些词在中英文里
  # 同时是图片检索的高频词（`snow mountain wallpaper`、`lake photo`），
  # 而本域排在 image_search 之前，会把图片需求截走——实测
  # `snow mountain wallpaper` 落在 geo_places，6 条结果全无图（返回的是
  # OSM/百科的地名条目）。与上面「位置/坐标」那条同法处理：出现图片语境
  # 就让位。不含图片词时照旧按地理处理（`mountains in nepal` 不受影响）。
  - match: '(?i)\b(mountain|river|lake|ocean|island|peninsula|desert|plateau|canyon|strait|volcano|glacier|timezone)\b'
    unless: '(?i)(wallpaper|photo|image|picture|illustration|poster|壁纸|照片|图片|图库|素材|插画|头像|背景图|摄影|剧照|雨景|雪景|夜景|风景照)'
  # 日韩地理触发词（修复「エッフェル塔 どこ」「에펠탑 어디」漏召）。
  # **刻意不收单字触发词**（山|川|湖|島|塔、산|강|섬）：CJK 单字是最常见的
  # 构词成分，裸子串匹配实测把「川菜 做法」「塔罗牌 入门教程」「한국 반도체
  # 산업」「강아지 사료 추천」「중국 산업 정책」「부산 맛집」全锁进地理源
  # （2026-09-21 实测 18 例里 8 例误判，而这些查询的 engines_combo 主源是
  # Nominatim，qps=1）。与 2026-09-19 处理 ASCII 子串事故（hn/monet/TLE/VIN）
  # 同一条纪律：宁可漏召裸山名（한라산/富士山 单说时走通用源），也不让常见词
  # 劫持整条路由。补上无歧义的「地図/지도」（单字触发词最常见的替代表达）。
  - (?i)(どこ|どこにある|標高|首都|半島|砂漠|高原|国境|観光地|緯度|経度|地図)
  # 반도(半岛)/국경(国境) 也要挡构词成分：반도 ⊂ 반도체（半导体）、
  # 국경 ⊂ 국경일（国庆日）。与单字触发词同一类事故，只是短了两拍。
  - (?i)(어디|위치|수도|호수|반도(?!체)|사막|고원|국경(?!일)|타워|관광지|위도|경도|지도)
  primary: local_openstreetmap
- desc: 政府/组织/公司实体（百科+维基数据，覆盖 LoHo Politics/Business）
  engines_combo:
  - wikidata
  - wikipedia
  - baidu_baike
  - zh_wikipedia
  - ror
  - gleif
  fallback: wikidata
  name: org_entity
  parallel: true
  patterns:
  # 政府/国际组织
  - (?i)(国务院|中共中央|全国人大|政协|外交部|财政部|发改委|央行|人民银行|最高法院|最高检|省政府|市政府|区政府|县委|市委)
  # 机构名 + 政策语境（评测 n08 实测「欧盟 AI Act 执行到哪一步」被「欧盟」
  # 锁进实体查询域，wikidata/百科给的是机构条目而非政策进展）：问法案/条例/
  # 执行进展时让位，问机构本身（是什么组织/总部在哪）不受影响
  - match: '(?i)(联合国|安理会|世贸组织|WTO|UNESCO|IMF|世界银行|欧盟|北约|NATO|东盟|上合组织|G20|G7|非盟|阿盟)'
    unless: '(?i)(政策|法案|条例|执行|实施|生效|进展|签署|谈判)'
  # WHO 必须区分大小写：`(?i)` 下 `who` 会命中英语里最常见的疑问句开头
  # （「who is the CEO of OpenAI」「who wrote the linux kernel」），把整个
  # 疑问句锁死进机构域。机构缩写本就是大写专名，没有需要忽略大小写的理由。
  - '\bWHO\b'
  - (?i)(白宫|五角大楼|国会山|克里姆林宫|唐宁街|青瓦台|首相府|总统府|议会|参议院|众议院|内阁|部委|政府机关)
  - (?i)\b(ministry|department\s+of|state\s+council|white\s+house|parliament|congress|senate|cabinet|government\s+of)\b
  - (?i)\b(united\s+nations|world\s+bank|european\s+union|nato|unesco|imf)\b
  # 知名机构缩写（与 founding/HQ 等事实问搭配；单独缩写也可进 org）
  - (?i)\b(NASA|ESA|CERN|FBI|CIA|FDA|CDC|NSA|EPA|OECD|OPEC|ASEAN)\b
  # 公司/组织实体 + 创办/成立年份（修复「创办年份」「founding year」漏召）
  # 2026-10-14 +股东尽调词：求职查询（岗位/招聘/薪资）与尽调查询（股东/持股/
  # 实控人/融资/股权）都不应命中本域——前者是招聘文案，后者 wikidata 无中国
  # 民企股东数据（实测 1.8s 只拿到两字「公司」）。
  # 2026-10-25 再补让位词：注销/吊销/经营异常/行政处罚/开票/税号（尽调风险与
  # 开票类）与 担任法定代表人/名下公司（人查公司反向）——这些形态此前落本域
  # wikidata 组合，对中文企业同样全废（合成名实测四类全误投，wikidata 7 天
  # 空结果率 82%），company_search 的元宝才是中文交付源。
  - match: '(?i)(股份有限公司|有限公司|集团|控股|总部|成立于|创立于|创办于|创始人|CEO|董事长|市值|子公司|母公司)'
    unless: '(?i)(岗位|职位|招聘|薪资|待遇|面试|简历|JD|工作内容|任职要求|岗位要求|股东|持股|实控人|融资|股权|注册资本|工商登记|统一社会信用代码|社会信用代码|信用代码|法定代表人|经营范围|注册号|企业信息|工商信息|注销|吊销|经营异常|行政处罚|开票|税号|担任法定代表人|名下公司)'
  - (?i)(创办年份|成立年份|创立年份|建校年份|成立时间|创办时间|创立时间|建校时间|何时成立|何时创办|何时创立)
  - (?i)(大学|学院|研究所|科学院|研究院).{0,12}(创办|成立|创立|建校)
  - (?i)\b([A-Z][A-Za-z0-9&.\- ]{1,40}\s+(Inc\.?|LLC|Ltd\.?|Corp\.?|Co\.|GmbH|S\.A\.|PLC))\b
  - (?i)\b(headquarters|founded\s+in|founded\s+by|founding\s+year|year\s+founded|established\s+in|subsidiary|parent\s+company|NGO|nonprofit|foundation)\b
  - (?i)\b(when\s+was\b.{0,40}\bfounded|when\s+founded)\b
  - match: '(?i)(非政府组织|非营利|基金会|商会|协会|联合会|红十字|慈善组织|职能|职责|组织机构)'
    unless: '(?i)(岗位|职位|招聘|薪资|待遇|面试|简历|JD|工作内容|任职要求|岗位要求|股东|持股|实控人|融资|股权|注册资本|工商登记)'
  # 科研机构标识（ROR）：combo 里的 ror 是研究机构权威标识源，但原 pattern
  # 全在讲政府/公司实体，没有任何一条能把「研究机构 标识」这类查询送进本域
  # ——ror 因此只有 --engine 显式可达（实测 2026-09-13）。补的这条**必须带
  # 标识语境**（标识/编号/机构号/域名/ROR），否则裸的「大学/研究所」会把
  # 通用高校查询整片吸进来（同 japan_law 的汉字词教训）。
  - (?i)(研究机构|科研机构|研究院|研究所|科学院|实验室|高校|大专院校).{0,10}(标识|编号|机构号|域名|ROR)
  - (?i)\bROR\b|\bROR\s*(ID|identifier)\b|机构标识|机构编号
  primary: wikidata
- desc: 音乐/播客媒体搜索（影视已拆 film_search；MV 用词界避免误伤 MVP）
  engines_combo:
  - itunes
  - musicbrainz
  - netease_music
  - deezer
  - listenbrainz
  - qq_music
  fallback: itunes
  name: media_search
  parallel: true
  patterns:
  - (?i)(歌曲|音乐|专辑|新歌|单曲|\bMV\b|mp3|歌词|歌手|乐队|音乐人|主唱|好听的歌|好歌推荐|听歌|歌单|的歌|主题曲|片尾曲|插曲|播客|有声书|演唱会|巡演)
  - (?i)\b(music|song|album|podcast|soundtrack|lyrics|singer|discography|concert|tour)\b
  primary: itunes
- desc: 图片/素材搜索（Openverse + Wikimedia Commons + 全网图片）
  engines_combo:
  - openverse
  - wikimedia_commons
  - ddgs_images
  - wallhaven
  - anysearch
  fallback: anysearch
  name: image_search
  parallel: true
  patterns:
  # 「雨景/雪景/夜景」这类**景观词本身就是图片意图**：中文用户说「雨景 摄影」
  # 想要的是照片，不是天气。此前它们不在词表里，而域匹配是先到先得——被
  # 后面的 chinese_general 兜底域截走（实测 route_reason 显示命中
  # chinese_general 后 TF-IDF 落到 local_imdb）。
  # 单字「摄影」不收：它太宽（「摄影技巧教程」是要文章不是要图），
  # 收「摄影作品/摄影图」这类带结果的写法。
  # 同理收「海报/封面图/图标/字体图」——实测 `vintage poster` 落
  # general_search、`海报` 落 chinese_general，都是明确的图片需求被截走。
  - (?i)(图片|壁纸|照片|图库|素材|插画|无版权|免费图片|头像|背景图|表情图|png|jpg 图片|壁纸下载|摄影作品|摄影图|写真|剧照|雨景|雪景|夜景|风景照|风光照|海报|封面图|logo 图|贴图|素材图|配图)
  # 「图标」在 UI 排障句里指的是菜单栏/状态栏控件（图标不显示、图标消失），
  # 不是找图需求。2026-10-23 回放实测：「菜单栏 第三方 图标 不显示 消失」
  # 被锁进 image_search，主源 Openverse 返回图库结果。
  - match: '(?i)图标'
    unless: '(?i)(菜单栏|状态栏|工具栏|任务栏|dock|favicon|应用图标|app\s+icon|不显示|消失|丢失|missing|disappear|not\s+show|图标满|图标太多)'
  # 单独的 image/picture 在技术任务句里是「处理图片」而非「找图」：
  # 实测「PDF extract text image」被 image_search 接走。收窄到
  # image/picture 这一条，wallpaper/photo/poster 等明确的找图词不受影响。
  - match: '(?i)\b(image|picture)\b'
    unless: '(?i)(extract|ocr|pdf|text|代码|python|api|库|命令|脚本|转换|识别|提取)'
  - (?i)\b(wallpaper|photo|illustration|stock photo|free image|poster|icon set|clip ?art|thumbnail|artwork)\b
  primary: openverse
  # 版权优先：要「能合法用」的图时 openverse 带许可标注，ddgs 全网图多数
  # 无授权信息。两条并行取回后由合并层按需取舍，而不是先跑一条再补另一条
  # ——排序口径见 engines_combo 顺序（openverse 结果在同等分数下更靠前）。
  # 中文查询由 ddgs_images 兜底：Openverse 对中文关键词命中率低（实测
  # 「雪山 星空 壁纸」0 条），而 ddgs 走 Bing 图片索引有中文覆盖。
- desc: 知识实体/维基数据查询
  engines_combo:
  - baidu_baike
  - wikidata
  - wikipedia
  - zh_wikipedia
  - dbpedia
  fallback: baidu_baike
  name: entity_search
  parallel: true
  patterns:
  - (?i)(维基数据|wikidata|知识实体|实体查询|词条实体|QID|SPARQL|知识图谱|百度百科)
  - (?i)(是哪家公司|哪家机构|什么组织|属于哪个|隶属于|总部在哪)
  primary: wikidata
- desc: 知乎个人数据（本人创作/收藏/关注——个人创作运营与素材回溯；结构化路径不混 web 源）
  engines_combo:
  - zhihu_user
  fallback: zhihu_user
  name: zhihu_user_data
  parallel: false
  patterns:
  - (?i)(我的知乎|知乎我的|我的创作|个人主页数据)
  - (?i)我(的)?(文章|回答|想法|视频|提问|收藏|收藏夹|关注的人|关注列表)
  primary: zhihu_user
- desc: 知乎/观点/经验/评测
  engines_combo:
  - zhihu
  - zhihu_global
  - anysearch
  fallback: anysearch
  name: zhihu_content
  parallel: true
  patterns:
  # 2026-10-21：只认「明确指向知乎/站内观点」的词。此前的 体验|评测|对比|
  # 推荐|哪个好|值得买|好不好|要不要|求推荐|有什么 是中文查询的通用词，
  # 实测把「蓝牙耳机推荐」「新能源汽车对比」这类通用消费查询锁到知乎单源
  # （21 条样本里至少 9 条）。泛意图交给通用保底，覆盖更宽。
  - (?i)(知乎|怎么看待|如何评价|知友)
  primary: zhihu
- desc: 学术论文搜索
  # openreview/biorxiv 曾长期是「已实现但无域引用」的孤儿源：只能靠
  # `--engine` 显式调用，自动路由永远选不中。AI/ML 顶会评审（OpenReview）
  # 与生物医学预印本（bioRxiv/medRxiv）是通用学术检索补不上的盲区——
  # 普通网页搜索在这个问题上给的是博客和二手解读。
  #
  # 排序由 fast 档的真实约束决定，不是审美问题：budget=2 且 must_keep=[primary]
  # 会「腾位」（挤掉末位非保底成员），最终只有 2 个源能跑。实测三种排法：
  #   primary=arxiv      + [arxiv, openreview, biorxiv, ...] → arxiv + openreview
  #   primary=openreview + [openreview, biorxiv, arxiv, ...] → openreview + biorxiv
  #   primary=arxiv      + [arxiv, openalex, ..., openreview] → arxiv + openalex（丢新源）
  # 取第一种：保住 arxiv（覆盖最广），同时把 openreview 顶进可见位；biorxiv 留第 3
  # 位，deep/research 不截断时参与（实测 deep 跑 openreview+arxiv+biorxiv）。
  # primary 必须落在前 2 位内，否则 must_keep 腾位反会把新源挤出去。
  engines_combo:
  - arxiv
  - openreview
  - biorxiv
  - openalex
  - hf_papers
  # 2026-09-19 追加，插在**第 5/6 位**——这个位次是算出来的，不是审美：
  # route._new_source_extra 的加槽额度 = min(最深新源位次 - base, cap)，
  # cap 在 auto/balanced 档为 4、base 为 3，故「两个新源都能进 kept」要求
  #   最深位次 <= base + cap = 7。
  #   · 放队尾（位次 9/10）→ 额度被封顶到 4、预算 7 < 9，两源全被截断
  #     （表现为「装了但路由不带它」，test_new_source_reachability 会红）
  #   · 放第 3/4 位 → 预算够，但会把 biorxiv 挤出 fast 档（实测 deep 档
  #     combo 缩到 [arxiv, openreview, local_pubmed, core]，是真回归）
  #   · 放第 5/6 位 → deepest=6、extra=min(3,4)=3、预算 6，恰好覆盖且
  #     arxiv/openreview/biorxiv/openalex 前四位次一律不动
  #     local_pubmed — 生物医学全文；此前是坏源（实测 0 条 / HTTP 400），本次修复
  #     core         — 开放获取全文 + PDF 直链，补「元数据之外的全文层」
  - local_pubmed
  # 2026-11-10：cnii 从第 8 位前移到第 7 位（紧随 local_pubmed、core 之前）。
  # 它是日本学术总库，补的是本域唯一的**亚洲学术**盲区（其余源全是欧美），
  # 能力独特性高于它现在排在前面的 crossref/europepmc/dblp（都与 openalex
  # 高度重叠）。位次 8 超出 auto/balanced 的加槽射程（base 3 + cap 4 = 7），
  # 实测「装了但路由不带它」——test_new_source_reachability 红。前移一位即
  # 落进射程，core/crossref/europepmc/dblp 顺延一位，它们本就靠 deep 触达。
  #
  # 注：本行曾写 `cinii`——那是同一源（cir.nii.ac.jp/opensearch/all）的重复
  # 注册，但**没有专属 builder**（type 是通用 http，engines._BUILDERS 查无
  # 此名），实际生效的一直是 `cnii`（type: cnii，自定义 builder）。重复的
  # 副作用：cinii 在 spec 里声明了 langs: [ja]，而生效的 cnii 没声明，语言
  # 路由层查 ENGINE_LANGS["cnii"] 得默认 ["*"]（语言中立），于是英文查询
  # 照常把日文源选进预算窗口。已删 cinii spec 并给 cnii 补 langs。
  - cnii
  - core
  - crossref
  - europepmc
  - dblp
  - semantic_scholar
  - doaj
  - figshare
  - hal
  - cnii
  fallback: openalex
  name: academic
  parallel: true
  patterns:
  # 中文论文语境词此前是缺口：规则里有英文 preprint，却没有「预印本」。
  # 实测「生物医学预印本」因此一个域都不命中，掉进通用兜底（combo 变成
  # bocha+anysearch），biorxiv/openreview 这些已实现的源永远轮不上。
  # 2026-10-25 补 unless：论文写作/评审的 howto 形态（怎么写/查重/盲审/开题）
  # 不是找论文——实测两类都落本域，arxiv 答不了写作技巧。只否决这一条，
  # 「综述 论文」等真检索语境不受影响。
  - match: '(?i)(论文|\bpaper\b|预印本|preprint|arXiv|bioRxiv|medRxiv|DOI|引用|citation|学术|文献|期刊|学报|综述|同行评议|影响因子|openalex|crossref|europe pmc|dblp|PubMed|知网|万方|维普)'
    # 2026-11-04 补 @local_channel：「arxiv api」「semantic scholar」「crossref」
    # 「pubmed」这类**显式选择本地免 key 通道**的写法要让位 local_academic
    # （idx 95），否则该域永远拿不到主位（实测 6/6 local_* 域被抢占）。
    # 用列表挂两类否决——拼接成字符串会让 (?i) 作用域只覆盖前半段。
    unless:
    - '(?i)(怎么写|查重|降重|盲审|开题|致谢|选题|范文|抄袭|写作技巧|参考文献格式)'
    - '@local_channel'
  - \b\d{4}\.\d{4,5}\b
  # 2026-09-30：模型名词表拆成独立条目并挂 unless。此前裸 (?i)...|BERT|GPT)
  # 是子串匹配，「chatgpt 使用技巧」「如何用 GPT 写周报」「gpt-5 发布」这类
  # 高频日常查询全被抢进学术论文域（实测返回 GPT-4 论文而非使用技巧）。
  # unless 与 weather 域同构：日常使用/对比/产品语境只否决**这一条**触发词，
  # 「GPT 训练方法 综述」等真论文语境不受影响（其它条目照常命中）。
  # 注意 unless 是子串语义，写「对比|vs」会误伤「BERT vs GPT 对比实验」——
  # 学术对比通常带论文词（综述/实验/论文），由第 1 条兜住，这里只拦产品语境。
  - match: '(?i)(transformer|attention|neural\s+network|deep\s+learning|machine\s+learning|BERT|GPT)'
    # 「工程实践/博客/案例」是产品与经验文章语境，不是论文。实测「GPT
    # 工程实践 清理死代码」被 academic 接走，arXiv 返回 AI 教育论文。
    # 2026-11-02 补「原理/是什么/解释」复合守卫：求解释不是查论文，实测
    # 「Transformer 模型 原理」返回 NLP 综述与医学 EEG 论文。守卫只拦
    # 「解释词命中且不含论文词」的查询，「Transformer 原理 论文」仍归本域。
    unless: '(?i)(技巧|教程|怎么用|如何|使用|入口|官网|注册|充值|账号|订阅|价格|发布|下载|安装|对比|哪个好|好用|推荐|周报|写作|助手|插件|镜像|平替|魔法|翻墙|工程实践|实践|博客|文章|官方博客|公司|团队|案例|(?!.*(论文|paper|综述|文献|期刊|arXiv|DOI)).*(原理|是什么|解释|入门|科普|详解))'
  - (?i)(論文|ジャーナル|学会誌|査読|研究論文|プレプリント)
  primary: arxiv
- desc: 技术深度研究
  engines_combo:
  - openalex
  - arxiv
  - semantic_scholar
  - github
  - europepmc
  fallback: openalex
  name: tech_deep
  parallel: true
  patterns:
  - (?i)(research|deep dive|综述|survey|state of the art|SOTA)
  primary: openalex
- desc: 购物评测/选购推荐
  engines_combo:
  - zhihu
  - anysearch
  fallback: anysearch
  name: shopping
  parallel: true
  patterns:
  # 注意：不要用裸 \bbest\b / review / comparison，会误伤 "best practices" 等技术查询
  # 2026-10-21：泛购物意图（评测/推荐/哪个好/值得买/选购/入手）不再由本域
  # 独占——它们占中文查询的很大一块，锁到知乎单源等于用问答站替代全网。
  # 这里只留「购物动作」本身；泛意图落通用保底（octen/anysearch），覆盖更宽。
  - (?i)(踩坑|避雷|种草|拔草|海淘|好物|开箱|平替)
  - (?i)\b(product\s+review|buyer's?\s+guide|worth\s+buying|best\s+buy|shopping)\b
  primary: zhihu
- desc: 语义发现/开放式调研（Exa 语义引擎）
  # 2026-11-10：mwmbl/mojeek 从队尾（位次 9/8）前移到 exa 之后（位次 2/3）。
  # 二者是独立索引（非大厂代理），能力与 exa 同类但来源独立，本就该紧挨
  # 语义引擎；此前追加到队尾导致位次 8/9 远超 auto/balanced 预算窗
  # （budget=3 + 加槽 4 = 7），「装了但路由不带它」，test_new_source_
  # reachability 红。前移后两源落进基础预算（3），尾部 tavily/firecrawl/
  # brave/felo/searxng 等付费与重型源顺延，它们本就靠 deep/research 触达。
  engines_combo:
  - exa
  - mwmbl
  - mojeek
  - anysearch
  - lieu
  - marginalia
  - searchmysite
  - wiby
  - uapi
  - parallel_free
  - tavily
  - firecrawl
  - brave
  - felo
  - searxng
  fallback: anysearch
  name: semantic_discovery
  parallel: false
  patterns:
  - (?i)(find me|discover|explore|landscape|ecosystem|what are the best|top.*tools|emerging|trending.*202[56])
  - (?i)(有哪些值得关注|行业格局|赛道分析|盘点一下|梳理一下)
  primary: exa
- desc: 代码搜索/开源项目
  engines_combo:
  - github
  - grep_app
  - mdn
  - huggingface
  - anysearch
  fallback: github
  name: code_search
  parallel: true
  patterns:
  # 裸「开源」太宽：品牌/产品句（「雪原 开源 投研 搜索工具」）也会
  # 命中，GitHub 慢源要 7s 且只回一条。只收「开源项目/代码/仓库/库/软件/
  # 框架」这类明确指向代码仓库的说法；有 github/源码 的查询仍走本域。
  # 2026-10-25 补 unless：药品语境让位 medical——「用法」子串会命中
  # 「用法用量」（实测药品说明书查询被 GitHub/MDN 接走）。
  - match: '(?i)(github|source code|源码|开源\s*(项目|代码|仓库|库|软件|框架)|函数|实现|用法|snippet)'
    unless:
    - '(?i)(用法用量|说明书|不良反应|禁忌|症状|服用|剂量|药品|药物)'
    - '@local_channel'
  # 「统一社会信用代码」是工商登记字段，不是代码搜索。拆出「代码」单条，
  # 让 company_search（更靠后）能接到这类查询。
  - match: '(?i)(代码)'
    # 「代码」在文章/工程实践句里是主题词，不是找仓库。实测「示例公司 官方
    # 博客 … 维护代码库 … 死代码」被 code_search 接走，GitHub 返回 OpenGL
    # 和 MDN 的 sidebarAction。让位给 chinese_tech_deep 的中文技术组合。
    unless: '(?i)(统一社会信用代码|社会信用代码|信用代码|区划代码|行政代码|邮政编码|股票代码|证券代码|基金代码|基金份额代码|商品代码|HS\s*代码|海关编码|商品编码|验证码|信用卡|安全码|CVV|官方博客|博客|文章|工程实践|实践|维护|重构|死代码|屎山|清理|经验|案例|周报|月报)'
  # 2026-11-04 补 @local_channel：「gitlab repo」「github repo」里的 repo 会命中
  # 本条，而上面 github 条目已否决本地通道——两条要一致，否则 repo 单独
  # 绕过否决（实测「github repo 本地搜索 代码」仍被本域接走）。
  - match: '(?i)\b(repo|repository|library|package|npm|pip|cargo)\b'
    unless: '@local_channel'
  # API 在「A vs B / 对比 / 区别」句里要的是概念解释，不是代码仓库：
  # 实测「kubernetes ingress vs gateway api」被 code_search 接走，GitHub 回
  # 两个示例仓、MDN 回 502/504 错误页。让位给 english_tech 的通用组合。
  - match: '(?i)\b(API|api)\b'
    unless:
    - '(?i)(\bvs\b|\bversus\b|\bcompare\b|\bcomparison\b|\bdifference\b|对比|区别|差异)'
    - '@local_channel'
  - (?i)\b(example|examples|example\s+code)\b
  primary: github
- desc: 网络梗/流行语/俚语/黑话
  engines_combo:
  - itotii
  - urban_dictionary
  - know_your_meme
  - anysearch
  fallback: itotii
  name: meme_slang
  parallel: true
  patterns:
  - (?i)(梗(?!概)|meme|俚语|slang|黑话|流行语|网络用语|网络热词|玩梗|出圈|抽象话|缩写|圈层用语|语录|表情包|梗百科|热梗)
  - (?i)(这是什么梗|啥意思|什么意思.*梗|梗.*意思|internet culture)
  primary: itotii
- desc: 事实查询/快速问答
  engines_combo:
  - wikipedia
  - byted
  - wolframalpha
  fallback: wikipedia
  name: fact_check
  parallel: true
  patterns:
  - (?i)(what is|who is|when did|where is|how many|how much)
  # zh 尾问词与 cn_encyclopedia 的「是什么」尾巴同病：比较题/得主题被锁进
  # 点查域后只能吃到 wikipedia/byted（2026-10-31 评测实测），共用同一否决宏。
  - match: '(?i)(是什么|是谁|什么时候|在哪里|多少|多少钱)'
    unless: '@compare_or_award'
  primary: wikipedia
- desc: 全球事件/舆情（Google News RSS + 中文财经快讯）
  engines_combo:
  - google_news
  - em_global_news
  - cls_telegraph
  fallback: em_global_news
  name: global_event
  parallel: false
  patterns:
  - (?i)(全球事件|国际事件|地缘政治|地缘|局势|冲突|抗议|政变|选举|公投|恐怖袭击|军事行动|制裁|外交|停火|谈判|全球舆情|全球动态|worldwide|global\s*event)
  # 2026-10-26：英文新闻查询此前只认 election result，`US election latest`
  # 落进通用兜底（yuanbao），DeepSeek 没有机会。放宽到 election/elections +
  # foreign policy；产品/购物语境由 unless 挡住。
  - match: '(?i)\b(geopolitical|conflict|protest|coup|elections?|referendum|terror\s*attack|military\s*action|sanctions?|ceasefire|diplomatic|foreign\s*policy|global\s*unrest)\b'
    unless: '(?i)(product|shopping|deal|coupon|review|best\s+buy|laptop|phone|headphone)'
  primary: google_news

- desc: 国际新闻实时流（一手外媒种子：卫报 / France 24 / 德国之声）
  engines_combo:
  - guardian_rss
  - france24
  - dw_news
  fallback: guardian_rss
  name: intl_news_flash
  parallel: true
  patterns:
  - (?i)(国际新闻|国际要闻|今日国际|国外新闻|国际动态|国际头条|外媒|海外新闻)
  - (?i)\b(world\s+news|international\s+news|global\s+headlines|foreign\s+news|overseas\s+news)\b
  primary: guardian_rss

- desc: 各国本地语言一手新闻流（按查询语言选源：韩/俄/阿/西/葡/法/德/日/泰/越/印尼/土/希/捷）
  engines_combo:
  - anysearch
  - yna
  - tass
  - aljazeera
  - elpais
  - folha
  - lefigaro
  - faz
  - nhk
  - matichon
  - vnpress
  - antara
  - hurriyet
  - ynet
  - ct24
  - seltz
  fallback: anysearch
  name: world_news
  parallel: true
  patterns:
  - (?i)(뉴스|новости|أخبار|noticias|notícias|nouvelles|actualités|Nachrichten|ニュース|ข่าว|tin tức|berita|haberler|חדשות|zprávy)
  primary: anysearch

- desc: 声明核验/辟谣（事实核查机构的声明级真伪判定）
  engines_combo:
  - factcheck_org
  - full_fact
  - anysearch
  fallback: anysearch
  name: claim_check
  parallel: true
  patterns:
  - (?i)(辟谣|谣言|传言|不实信息|假消息|误导性|事实核查|是真的吗|是否属实)
  - (?i)\b(fact[-\s]?check\w*|debunk\w*|misinformation|disinformation|hoax|fake\s+news)\b
  primary: factcheck_org

- desc: 实时新闻/事件（zhihu_global #2：中文 web 时事实测最强场景，836-1343ms）
  engines_combo:
  - byted
  - zhihu_global
  - people_daily
  - google_news
  - octen
  - you
  - realtime_index
  fallback: byted
  name: news_realtime
  parallel: true
  patterns:
  - (?i)(最新新闻|最新进展|今天发生|突发|breaking)
  # `latest` 单独出现不足以判实时新闻：软件/技术查询（latest version、
  # AI agent framework 2026 latest）会被误路由到这里，combo 只有新闻源。
  # 只保留明确的新闻搭配（latest on/about/in、latest news/headlines/
  # developments/events）；版本语义的 latest 让位给技术/通用域（issue #18）。
  - match: '(?i)\bnews\b'
    # 2026-11-04 补 @local_channel：「bing news」「google news」「本地新闻」
    # 这类显式选择本地通道的写法要让位 local_news（idx 93），否则该域
    # 永远拿不到主位（实测 6/6 local_* 域被抢占）。
    unless: '@local_channel'
  - (?i)\blatest\s+(?:on|about|in|news|headlines?|developments?|events?)\b
  primary: byted
- desc: 中文技术深挖（先于英文技术域/中文通用域；要求含中文）
  engines_combo:
  - byted
  - octen
  - juejin
  - cn_ai_news
  - parallel
  fallback: byted
  name: chinese_tech_deep
  parallel: true
  patterns:
  - match: '(?i)[一-鿿].*(编程|代码|算法|架构|框架|框架对比|性能优化|源码分析|实现原理|教程|指南|原理|底层|综述|深入|深挖|架构设计|实现|用法)'
    unless:
    - '(?i)(统一社会信用代码|社会信用代码|信用代码|区划代码|行政代码|邮政编码)'
    # 2026-11-04 补 @local_channel：「github repo 本地搜索 代码」这类显式
    # 选择本地通道的写法要让位 local_code（idx 94）。
    - '@local_channel'
  # 拉丁语言名必须有字母数字边界：裸 alternation 会让 Go 命中 argo、让
  # Java 命中 JavaScript（顺序靠前会截断）。实测「重启后 django 自检」被
  # 「Go ⊂ argo」锁进本域。
  - (?i)[一-鿿].*(?<![a-zA-Z0-9])(Rust|Python|Golang|Go|Java|JavaScript|TypeScript|React|Vue|Docker|K8s|Cursor|Copilot|Windsurf|LLMs?)(?![a-zA-Z0-9])
  - (?i)[一-鿿].*(AI编程|大模型|量子|神经网络|机器学习|深度学习)
  primary: byted
- desc: 英文技术通用（octen 主搜，低延迟；anysearch #2 作 hedged 救援；先于 catch-all）
  engines_combo:
  - octen
  - anysearch
  - exa
  - keenable
  fallback: exa
  name: english_tech
  parallel: true
  patterns:
  - (?i)(async|performance|best practices|tutorial|guide|how to|internals|SDK|framework)
  # 2026-11-04 补 @local_channel：「wikipedia api」「arxiv api」这类显式选择
  # 本地免 key 通道的写法要让位 local_reference / local_academic。
  - match: '(?i)\b(API|api)\b'
    unless: '@local_channel'
  - (?i)\b(Rust|Python|JavaScript|TypeScript|React|Vue|Node|Docker|Kubernetes|asyncio)\b
  primary: octen
- desc: 公司注册/尽调（GLEIF 法人主数据 + OpenCorporates 注册库；元宝补中文企业信息）
  # 元宝放第 1 位（2026-10-22）：本域 patterns 含「股东/法人/注册资本/工商信息」，
  # 但 combo 原本只有国际法人库（gleif/opencorporates）+ 百科（baidu_baike），
  # 对中国**非上市**企业全废——实测「长亭科技 股东 持股比例」被路由到本域后，
  # opencorporates 熔断 + baidu_baike 只返回同名「XX科技有限公司」干扰，5 条无一命中
  # （2026-10-22 实测复现 2026-10-14 的老问题）。元宝实测能返回天眼查/企查查/
  # 爱企查的结构化股东表（长亭未来 100% 控股、阿里巴巴 17.7685%），是本域唯一能
  # 交付中文企业信息的源，放第 1 位确保进 budget=2 窗口（combo_budget 只按声明
  # 顺序取前 2，见 engine_policy.combo_budget）。
  engines_combo:
  - yuanbao
  - gleif
  - opencorporates
  - cninfo
  - baidu_baike
  fallback: opencorporates
  name: company_search
  parallel: false
  patterns:
  - (?i)(公司注册|注册号|统一社会信用代码|工商信息|股东|法人|注册资本|经营范围|尽调|工商登记|企业信息)
  # 2026-10-25 补：尽调风险（注销/吊销/经营异常/行政处罚）、开票（开票信息/税号）、
  # 人查公司（担任法定代表人/名下公司）三类。unless 锁住办事指南形态（流程/
  # 怎么办/条件/材料…）——「公司注销流程 怎么办」是 howto 不是主体查询，合成名
  # 双向锁用例见 matrix_search_eval ROUTE_MATRIX。org_entity 侧同日补了对应
  # 让位词（见其 unless 注释），两类改动必须成对出现。
  - match: '(?i)(注销|吊销|经营异常|行政处罚|开票信息|开票|税号|担任法定代表人|名下公司|实际控制人是谁)'
    unless: '(?i)(流程|怎么办|如何|怎么办理|怎样|条件|材料|手续|多久|费用|办理|指南)'
  - (?i)(\bLEI\b|法人识别码|法人标识|法人主数据|legal\s+entity\s+identifier)
  - (?i)\b(company\s*registration|incorporation|registered\s+number|business\s+registry|company\s+search|corporate\s+records)\b
  - (?i)(会社|法人|登記|기업|법인|등록)
  primary: opencorporates
- desc: 视频内容搜索（B站为主，anysearch 兜底；显式视频意图才触发）
  # 2026-10-27 新增。只收「明确要看视频」的查询：视频教程/B站/YouTube/
  # 结尾的「视频」，以及短视频/长视频。泛词「教程」「运营」不进来，否则
  # 大量文本教程会被锁进只有两个视频源的 combo，结果面反而变窄。
  # 位置必须排在 chinese_general 之前：后者 patterns 是任意汉字，先命中就
  # 把视频查询吃掉了（实测「红烧肉 做法 视频」此前路由到元宝+anysearch）。
  engines_combo:
  - bilibili
  - parallel_free
  - anysearch
  fallback: anysearch
  name: video
  parallel: true
  no_early_stop: true
  patterns:
  - '(?i)(视频教程|视频讲解|视频版|视频攻略|视频测评|视频评测|开箱视频|测评视频|横评视频|视频合集|看视频|找视频|求视频)'
  - '(?i)(b站|bilibili|youtube|油管|抖音视频|快手视频|西瓜视频)'
  - '(?i)(视频\s*$)'
  - match: '(?i)(短视频|中视频|长视频)'
    unless: '(?i)(运营|营销|变现|涨粉|算法|推荐机制|商业|投放|广告|行业|报告|数据|趋势|平台|生态)'
  primary: bilibili
- desc: 中文通用搜索（octen #3 作 bocha/byted 弱结果时的多语言救援；yuanbao #2 为权威源对冲）
  # yuanbao 放第 2 位（2026-10-21）：它不是「备选」而是**对冲位**。当月实测
  # bocha/octen 报 403（账户余额不足）、byted 报 10406（免费额度耗尽），三个
  # 主力同时被 is_hard_down 排除，combo 实际只剩 anysearch+zhihu_global；
  # 而同 6 个中文查询对拍 anysearch 中位 2664ms、日期覆盖 0%，yuanbao 中位
  # 699ms、日期覆盖 96%——放第 2 位意味着主力全挂时它直接顶上。
  #
  # 额度可耗尽（默认 2000 次/月；更高套餐改 engines/specs/yuanbao.yaml 的 limit），
  # 但耗尽后 is_hard_down 会自动把它从 combo 摘掉，组合回落到 anysearch/zhihu_global
  # 形态，不报错、不留半截状态。改档位后跑 scripts/sync_backends.py。
  engines_combo:
  - bocha
  - yuanbao
  - byted
  - octen
  - anysearch
  - zhihu_global
  - wechat_sogou
  - local_search
  - so
  - shenma
  - metaso
  fallback: byted
  name: chinese_general
  parallel: true
  patterns:
  # catch-all 中文兜底：任意汉字即命中。但「本地/免 key 镜像通道」是用户
  # **显式选择**的意图，不该被兜底截走——local_* 六个域排在本域之后
  # （idx 92-97），而域匹配是先到先得，于是「本地搜索」「arxiv api」
  # 「wikipedia api」「github repo」「bing news」「百度」全部被本域抢走，
  # 那六个域永远拿不到主位（2026-11-04 实测，见
  # tests/test_route_capability_coverage.py 的 _KNOWN_GAPS）。
  #
  # 修法：给 catch-all 加 unless，把明确选择本地通道的意图词否决掉。
  # 否决是**逐触发词**的（挂在这一条上），不影响其他中文查询走兜底。
  # 词表与 local_* 六个域的 patterns 对齐，新增 local 域时同步补这里。
  - match: '[一-鿿]'
    unless: '(?i)(本地搜索|local search|零成本|free search|本地新闻|bing news|google news|news rss|arxiv api|semantic scholar|crossref|pubmed|site:arxiv.org|wikipedia api|wiktionary|wikiquote|nominatim|openstreetmap|stackoverflow|npm package|gitlab repo|github repo|site:stackoverflow.com|百度|搜狗|site:baidu|site:sogou)'
  primary: bocha
- desc: 本地中文搜索
  engines_combo:
  - local_search
  - bocha
  fallback: local_search
  name: local_chinese
  parallel: true
  patterns:
  - (?i)(百度|搜狗|site:baidu.com|site:sogou.com)
  primary: local_search
- desc: 本地新闻搜索
  engines_combo:
  - local_search
  - byted
  fallback: byted
  name: local_news
  parallel: true
  patterns:
  - (?i)(本地新闻|bing news|google news|news rss)
  primary: local_search
- desc: 本地代码搜索
  engines_combo:
  - local_search
  - github
  - anysearch
  fallback: anysearch
  name: local_code
  parallel: true
  patterns:
  - (?i)(stackoverflow|npm package|gitlab repo|github repo|site:stackoverflow.com)
  primary: local_search
- desc: 本地学术搜索
  engines_combo:
  - local_search
  - arxiv
  - semantic_scholar
  fallback: arxiv
  name: local_academic
  parallel: true
  patterns:
  - (?i)(arxiv api|semantic scholar|crossref|pubmed|site:arxiv.org)
  primary: local_search
- desc: 本地参考百科（+维基文库古文公版文献）
  engines_combo:
  - local_search
  - wikipedia
  - wikisource
  fallback: wikipedia
  name: local_reference
  parallel: true
  patterns:
  - (?i)(wikipedia api|wiktionary|wikiquote|nominatim|openstreetmap)
  - (古文|文言文|古诗文|古文原文|维基文库|wikisource|公版书)
  primary: local_search
- desc: 本地通用搜索（兜底）
  engines_combo:
  - local_search
  - anysearch
  fallback: anysearch
  name: local_general
  parallel: true
  patterns:
  - (?i)(本地搜索|local search|零成本|free search)
  primary: local_search
- desc: 社交平台/UGC/舆论
  engines_combo:
  - zhihu
  - hackernews
  - bilibili
  - v2ex
  - twitter
  - fxtwitter
  - reddit
  - xiaohongshu
  - weibo
  - hatena_bookmark
  - qiita
  # fallback 原为 zhihu（与 primary 相同，形同虚设）；anysearch 作通用 web 兜底，
  # 平台源全军覆没时（如 zhihu 缺密钥被踢）仍有相关结果
  fallback: anysearch
  # 平台引擎按关键词召回，噪声结果也会满足条数阈值；禁早停让通用源参与 RRF 融合，
  # 防止「提到平台词 ≠ 搜平台」的查询被 bilibili 噪声短路
  no_early_stop: true
  name: social
  parallel: true
  patterns:
  # `v2ex` 让位给 v2ex_search（2026-10-22）：本域 patterns 含 v2ex，且
  # route_domains._social_domain_first 会把 social 提到命中列表首位——实测
  # 「v2ex 技术社区」落本域用 hackernews 搜（HackerNews 里确有一批 V2EX 讨论帖，
  # 但那是转载不是社区本身），而 v2ex_search 才是垂直域。从 patterns 移除 v2ex。
  # 2026-11-02 补 unless：平台名 + 内容意图（攻略/推荐/做法…）是找内容，
  # 不是舆情监听。实测「小红书 露营 攻略」返回「露营季广告」「露营经济
  # 红利」这类营销稿；平台名在内容语境里只是来源限定。反例「小红书 露营
  # 舆情/评论」仍归本域（unless 不命中）。
  - match: '(?i)(小红书|抖音|推特|twitter|reddit|b站|bilibili|微博|评论|帖子|热门|trending|viral|public opinion|public sentiment|market sentiment|舆论|舆情|种草|拔草|用户体验|口碑)'
    unless: '(?i)(攻略|推荐|路线|景点|美食|做法|教程|测评|怎么玩|清单)'
  - (?i)(xhs|douyin|tweet|retweet|up主|博主|粉丝|点赞|转发|收藏)
  - (?i)(from\s*:|to\s*:|subreddit\s*:|lang\s*:|filter\s*:images|min_faves\s*:|min_retweets\s*:|since\s*:|until\s*:|nitter\b|via\s*:)
  primary: zhihu
  quote: false

# 引擎声明已迁移到 engines/specs/*.yaml（每引擎一文件，唯一声明源）。
# engines: {} 保留空键是为了兼容读 config.yaml 顶层键的调用方；运行时引擎集
# 由 config.py 从 engines/specs/*.yaml 加载，不再合并本段。
engines: {}
execution:
  default_timeout: 8
  # 一轮编排内同时跑几个引擎（B-4：3 → 6）。判据是 p90/max 而不是中位——
  # 提高并发只可能动尾部（上游限流/竞争），中位本就由最快那个引擎决定。
  # A/B 实测见 docs-local/调度对拍_尾宽分层与并发_2026-10-16.md：日常档
  # combo=2，并发上限本就不咬合（3↔6 无行为差异），此改动实质只影响
  # deep/多引擎垂直域；对拍未显示收益也未显示代价，属中性变更。
  max_parallel_engines: 6
  retry_count: 1
  # 已移除 parallel_timeout / retry_on_empty：全仓无读取点，是「配了不生效」的
  # 假承诺（2026-09-29 实测，与 max_parallel_engines 同属一类）。DEFAULT_CONFIG
  # 里重述同名键**不算**读取点——正是它掩盖了这两处的死配置。要让空结果重试或
  # 并行阶段独立超时真生效，先接线再登记；门禁见 tests/test_execution_config_liveness.py。
  # 单引擎墙钟硬预算（秒）：含该引擎全部重试尝试，超预算即停、由编排层切备选源。
  # 背景：重试会叠乘（引擎级 × HTTP 级 × 超时），anysearch 曾因此跑出 31s
  # （retry_count=1 → 2 次 × max_retries=1 → 2 次 × 8s = 32s 最坏）。
  # 用户体感阈值 10s；且应 ≥ default_timeout(8s)，否则单次正常尝试会被截断。
  # 调小 → 更快切备选但可能误杀慢网下的正常源；调大 → 更容忍慢源但体感变差。
  per_engine_budget_s: 10
  budget:
    fast:
      max_cost_per_query: 0.0
      allow_paid: false
    auto:
      max_cost_per_query: 0.01
      allow_paid: true
    deep:
      max_cost_per_query: 1.0
      allow_paid: true
    budget:
      max_cost_per_query: 0.005
      allow_paid: false
      quota_threshold: 0.2
output:
  format: auto
  include_routing_decision: true
  include_scores: true

# ── 语义证据层（可选，默认关闭）─────────────────────────────────────────
# 用 classifier.dev 的零样本分类，为显式核验链路（search --verify /
# research --verify）补一层「正文是否支持该查询主张」的语义判定。密度分测
# 「像不像证据块」，它测「是否支持」——实测两者近乎反向，假前提主张只有语义
# 层能表达（详见 scripts/semantic_evidence.py 头部说明与
# reports/classifier-dev-argo/A、B、F）。
# 开启：此处 enabled: true，或设环境变量 ARGO_SEMANTIC_EVIDENCE=1（env 优先）。
# 关闭时零影响：无网络调用、无新增字段、输出与未接入时逐位一致。
#
# 注意：本文件随仓库一起发布。**个人/本机开启请用环境变量**（写进
# ~/.config/argo/env 或单次命令前缀），不要改这里的 enabled 后提交——否则
# 发布出去的默认值就从「关闭」变成「开启」了。
semantic_evidence:
  enabled: false
  # 通道：jev（TypeSafe System One）| classify（classifier.dev）。
  # **纯配置驱动，不做「按键就绪自动选」**——那会让同一份代码在开发机与 CI
  # 上走不同分支（本机 env 文件里有没有 key 决定路径），既有测试会静默改道。
  # 未声明时默认 jev：classifier.dev 的匿名路径 2026-10-22 起回
  # 403 proxy_requires_payment（「Anonymous proxy traffic requires a funded
  # API key」），要 workspace key 才能用；JEV 是当前可用的那条。
  transport: jev
  # JEV 端点与模型。**独立于下方 endpoint 字段**——两个通道的请求体形状不同
  # （JEV 是 state+questions，classify 是 inputs+labels），共用一个 endpoint 会
  # 把 System One 的体发到 classifier.dev，拿回指向错误方向的 401。
  jev_endpoint: "https://api.typesafe.ai/v1/systemone"
  jev_model: "jev-latest"
  # classify 通道（classifier.dev）的端点；JEV 通道不读它。
  endpoint: "https://classifier.dev"
  # 单次请求的超时（秒）。服务不可达时核验链路最多多等这么久，然后静默降级。
  # JEV 通道下这是**每条正文**的超时（每条一个请求，并发 4）。
  timeout_s: 5
  # fast：决策模型一次往返；smart：低置信度条目转推理模型复核（慢，配额小 10 倍）。
  # 仅 classify 通道认这个字段。
  tier: fast

# ── 网络出口调度（issue #13，2026-09-14）────────────────────────────────
# 解析优先级：rules 域名命中 > ARGO_PROXY 环境变量 > 本段 url > 标准环境变量
# （HTTPS_PROXY/HTTP_PROXY/ALL_PROXY，NO_PROXY 一直被尊重）> 直连。
# 三档典型环境：
#   A. TUN/全局代理（Clash TUN 等）：什么都不用配，直连即可达。
#   B. 本地混合端口：设 ARGO_PROXY=http://127.0.0.1:7890，或下方 url 填同值。
#   C. 按源分流：rules 给必须代理的域配 URL、给直连更优的域配 "direct"。
network:
  proxy:
    # 全局代理 URL；空 = 不设 argo 级全局（回落到环境变量）。
    # 例: url: "http://127.0.0.1:7890"
    url: ""
    # 按域名后缀匹配的覆盖规则；值 = 代理 URL 或 "direct"（强制直连）。
    # 例:
    #   "github.com": "http://127.0.0.1:7890"
    #   "bochaai.com": "direct"
    # gdeltproject.org 显式走本地 Clash：GDELT 按出口 IP 限流（1 调用/5 秒，
    # 触发后冷却以分钟计），argo 的真直连路径对它 TLS 握手超时（_ssl.c 实测
    # 10s 打穿），curl 经 Clash TUN 分流可达但慢（14s）——显式指定本机代理
    # 端口最稳（2026-09-17 的「死源」下线判定=429 连发+握手超时两根因叠加）。
    # 其他环境设置 ARGO_GDELT_PROXY 指向本机代理；未设置时自动直连，
    # 避免硬编码端口在无代理环境下每次白烧 TLS 握手超时。
    rules:
      "gdeltproject.org": "${ARGO_GDELT_PROXY}"
      # animetrace.com 按出口 IP 限频：共享机场节点的出口常被别的客户端打到
      # 429（实测 code 17737 连发数小时），而该 API 直连可达（实测 code 0 秒回）。
      # 与上一条同语义：默认直连，需要走代理的环境用 ARGO_ANIMETRACE_PROXY 覆盖。
      "animetrace.com": "${ARGO_ANIMETRACE_PROXY}"
      # api.trace.moe 按出口 IP 限频（免费档 100 次/小时）：共享机场节点的出口
      # 常被别的客户端打到 429，而该 API 直连可达（实测 GET 秒回）。
      # 与上一条同语义：默认直连，需要走代理的环境用 ARGO_TRACEMOE_PROXY 覆盖。
      "api.trace.moe": "${ARGO_TRACEMOE_PROXY}"
