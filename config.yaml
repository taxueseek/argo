    image|docker 镜像)
  - (?i)\b(pip|pypi|npm|npx|yarn|pnpm|docker\s+pull|dockerfile)\b
  # 点查域意图豁免词：长主题句（去重 token ≥5）下必须命中其一，否则让位。
  # 语义见 route_domains 模块 docstring（intent_required）。
  # 英文备选吃 \b；中文备选必须在 \b 外——CJK 字符全是 \w，「npm安装报错」
  # 这类无空格连写永远撞不上词边界（2026-09-06 审查实锤）。
  intent_required: '(?i)\b(install|add|uninstall|download)\b|安装|下载|替代包|包名'
