cache:
  db_path: ~/.cache/unified-search/cache.db
  enabled: true
  max_size_mb: 200
  ttl: 3600
domains:
- desc: 微信公众号文章搜索
  engines_combo:
  - wechat_sogou
  fallback: wechat_sogou
  name: wechat_search
  parallel: false
  patterns:
  - (?i)(公众号|微信文章|微信公众号|wechat.*article|mp\.weixin)
  - (?i)(搜狗微信|微信搜索|搜公众号)
  primary: wechat_sogou
- desc: Hacker News 搜索
  engines_combo:
  - hackernews
  fallback: hackernews
  name: hackernews_search
  parallel: false
  patterns:
  - (?i)(hacker.?news|hn|news\.ycombinator)
  - (?i)(hackernews|hn\s+search)
  primary: hackernews
- desc: Stack Overflow 搜索
  engines_combo:
  - stackoverflow
  fallback: stackoverflow
  name: stackoverflow_search
  parallel: false
  patterns:
  - (?i)(stack.?overflow|stackoverflow|编程问题|代码问题|技术问答)
  - (?i)(python.*error|javascript.*error|java.*error|debug.*code|fix.*bug)
  primary: stackoverflow
- desc: 学术搜索（Google Scholar）
  engines_combo:
  - google_scholar
  - arxiv
  fallback: google_scholar
  name: scholar_search
  parallel: false
  patterns:
  - (?i)(google.?scholar|学术论文|论文搜索|research.*paper|journal.*article)
  - (?i)(sci-hub|学术文献|学位论文|会议论文)
  primary: google_scholar
- desc: V2EX 社区搜索
  engines_combo:
  - v2ex
  fallback: v2ex
  name: v2ex_search
  parallel: false
  patterns:
  - (?i)(v2ex|v2ex\.com)
  - (?i)(技术社区|程序员社区|开发者论坛)
  primary: v2ex
- desc: 同花顺热点/强势股
  engines_combo:
  - ths_hot
  fallback: ths_hot
  name: ths_hot_search
  parallel: false
  patterns:
  - (?i)(同花顺热点|强势股|涨停原因|题材归因|热点板块|今日强势)
  - (?i)(hot stocks|trending stocks|market theme|momentum)
  primary: ths_hot
- desc: 财联社电报
  engines_combo:
  - cls_telegraph
  fallback: cls_telegraph
  name: cls_telegraph_search
  parallel: false
  patterns:
  - (?i)(财联社|cls\.cn|电报|快讯|财经快讯)
  primary: cls_telegraph
- desc: 东财全球资讯
  engines_combo:
  - em_global_news
  fallback: em_global_news
  name: em_news_search
  parallel: false
  patterns:
  - (?i)(东财资讯|全球资讯|7x24|财经快讯|市场快讯)
  - (?i)(eastmoney news|global news|financial news)
  primary: em_global_news
- desc: 基金筛选/基金数据
  engines_combo:
  - eastmoney
  - anysearch
  fallback: anysearch
  name: fund_query
  parallel: false
  patterns:
  - (?i)(基金|公募|私募|基金经理|基金净值|基金排行|选基)
  - (?i)\b(ETF|LOF|FOF)\b
  primary: eastmoney
  quote: true
- desc: 股票/行情查询
  engines_combo:
  - eastmoney
  - anysearch
  fallback: anysearch
  name: stock_query
  parallel: false
  patterns:
  - (?i)(股价|行情|涨跌|K线|大盘|指数|涨停|跌停|板块|概念股)
  - (?i)(stock|quote|price|market\s+cap)
  - A股|港股|美股|股票|ETF|板块
  primary: eastmoney
  quote: true
- desc: 财经资讯/研报/公告
  engines_combo:
  - byted
  - eastmoney
  - anysearch
  fallback: eastmoney
  name: financial_news
  parallel: true
  patterns:
  - (?i)(研报|财报|公告|财经|宏观|央行政策|降息|加息|CPI|GDP|PMI)
  - (?i)(financial|earnings|report|announcement)
  primary: byted
- desc: 天气查询（和风天气）
  engines_combo:
  - qweather
  - duckduckgo
  fallback: duckduckgo
  name: weather_query
  parallel: false
  patterns:
  - (?i)(天气|气温|温度|预报|下雨|降水|多少度|weather|forecast)
  primary: qweather
- desc: 美股筛选/分析（Finviz + Seeking Alpha + 通用）
  engines_combo:
  - finviz
  - seeking_alpha
  - exa
  - anysearch
  - eastmoney
  fallback: anysearch
  name: us_stock
  parallel: true
  patterns:
  - (?i)(NASDAQ|NYSE|美股|盘前|盘后|premarket|afterhours)
  - (?i)\b(AAPL|TSLA|NVDA|MSFT|GOOG|GOOGL|AMZN|META|AMD|NFLX)\b
  primary: finviz
- desc: 财经快讯（金十数据）
  engines_combo:
  - jin10
  - cls_telegraph
  fallback: cls_telegraph
  name: jin10_flash
  parallel: false
  patterns:
  - (?i)(金十|jin10|财经快讯|市场快讯|7x24快讯)
  primary: jin10
- desc: 全网热搜/热榜
  engines_combo:
  - baidu_hot
  - toutiao_hot
  - bilibili_hot
  - ths_hot
  fallback: baidu_hot
  name: hot_trending
  parallel: true
  patterns:
  - (?i)(热搜|热榜|热搜榜|实时热搜|今日热搜|今天热搜|微博热搜|百度热搜|B站热搜|bilibili热搜|头条热榜|抖音热榜|热门话题|trending now|hot search|top trends)
  primary: baidu_hot
- desc: 加密货币/币种查询
  engines_combo:
  - coingecko
  fallback: coingecko
  name: crypto_search
  parallel: false
  patterns:
  - (?i)(比特币|以太坊|莱特币|狗狗币|加密货币|虚拟货币|数字货币|币价|币种|山寨币|空气币|代币|区块链|挖矿|钱包地址|token 经济|稳定币)
  - (?i)\b(bitcoin|ethereum|btc|eth|crypto|altcoin|defi|nft|blockchain|coin)\b
  primary: coingecko
- desc: 包管理器/语言包查询（PyPI/npm/crates/Docker）
  engines_combo:
  - pypi
  - npm
  - crates
  - docker_hub
  - github
  fallback: pypi
  name: package_search
  parallel: true
  patterns:
  - (?i)(crates\.io|cargo 包|rust 包|rust 库|crate 库|rust crate|rust 依赖|rust 生态|rust.*\bcrate|好用的 crate)
  - (?i)\b(crates\.io|crates|crate|cargo\s+package|serde)\b
  - (?i)(pypi|pip install|python 包|python package|python 库|python lib|npm 包|npm package|node 包|yarn add|pnpm add|docker.?hub|docker
    image|docker 镜像)
  - (?i)\b(pip|pypi|npm|npx|yarn|pnpm|docker\s+pull|dockerfile)\b
  primary: pypi
- desc: Web 开发文档（MDN）
  engines_combo:
  - mdn
  - stackoverflow
  fallback: mdn
  name: web_docs
  parallel: false
  patterns:
  - (?i)(mdn|mozilla developer|web api|dom api|css 属性|html 元素|javascript api|js api|fetch api|web docs)
  - (?i)(developer\.mozilla|site:developer\.mozilla)
  primary: mdn
- desc: ML 模型/数据集（Hugging Face）
  engines_combo:
  - huggingface
  - github
  fallback: huggingface
  name: ml_models
  parallel: false
  patterns:
  - (?i)(hugging\s*face|huggingface|hf\.co|hf model|预训练模型|开源模型|llm 模型|embedding 模型|数据集 dataset)
  - (?i)\b(bert|llama|mistral|whisper|stable.?diffusion|safetensors)\b.*\b(model|checkpoint|权重)\b
  - (?i)(模型下载|模型检索|模型库|diffusion model|text.to.image model)
  primary: huggingface
- desc: AI 模型信息搜索（价格/上下文/能力/多模态，models.dev）
  engines_combo:
  - models_dev
  - huggingface
  - anysearch
  fallback: anysearch
  name: ai_model
  parallel: false
  patterns:
  - (?i)(模型|model|LLM|GPT|Claude|Gemini|GLM|Llama|Mistral|DeepSeek|Qwen)
  - (?i)(API price|pricing|context window|token limit|vision model|tool call)
  - (?i)(多少钱|价格|上下文|支持视觉|支持图片|开源模型|免费模型)
  primary: models_dev
- desc: 中文技术社区文章（掘金 + V2EX + dev.to）
  engines_combo:
  - juejin
  - v2ex
  - devto
  fallback: juejin
  name: cn_tech_community
  parallel: true
  patterns:
  - (?i)(掘金|juejin|稀土掘金|技术博客|前端文章|后端文章|dev\.to|devto)
  - (?i)(写得不错的技术文|技术分享文章)
  primary: juejin
- desc: 法律法规（刑法/民法/判例/法规）
  engines_combo:
  - anysearch
  - byted
  - duckduckgo
  - wenshu
  fallback: anysearch
  name: legal
  parallel: true
  patterns:
  - (?i)(刑法|民法|司法解释|判例|法规|裁判文书|案由|案号|法院判决)
  primary: anysearch
- desc: 裁判文书检索
  engines_combo:
  - wenshu
  - anysearch
  fallback: anysearch
  name: wenshu_query
  parallel: false
  patterns:
  - (?i)(裁判文书|判决书|裁定书|wenshu|court\.gov)
  primary: wenshu
- desc: 医学/临床试验/药品标签
  engines_combo:
  - clinicaltrials
  - openfda
  - local_pubmed
  - wikipedia
  - anysearch
  fallback: clinicaltrials
  name: medical
  parallel: true
  patterns:
  - (?i)(临床试验|clinical trial|nct\d+|clinicaltrials\.gov|openfda|fda 药品|药品说明书|药物标签|drug label|适应症|不良反应)
  - (?i)(medicine|pharmaceutical|dosage|contraindication|药物|药品|处方药|otc)
  - (?i)(症状|用药|适应症|临床|指南|副作用|禁忌|诊断|治疗|病因)
  primary: clinicaltrials
- desc: 游戏商店（Steam）
  engines_combo:
  - steam
  fallback: steam
  name: game_search
  parallel: false
  patterns:
  - (?i)(steam|steam 游戏|steam 商店|3a 游戏| indies? 游戏|好玩的游戏|游戏推荐|metacritic)
  - (?i)\b(steam\s+game|pc\s+game|steamdb)\b
  primary: steam
- desc: 预测市场（Polymarket，叙事源非事实真值）
  engines_combo:
  - polymarket
  fallback: polymarket
  name: prediction_market
  parallel: false
  patterns:
  - (?i)(polymarket|预测市场|prediction market|博彩盘口|事件合约|谁会当选|会不会发生)
  primary: polymarket
- desc: 互联网档案馆 / 历史网页
  engines_combo:
  - archive_org
  - wikipedia
  fallback: archive_org
  name: web_archive
  parallel: false
  patterns:
  - (?i)(internet archive|archive\.org|wayback|网页快照|历史网页|数字图书馆 archive)
  primary: archive_org
- desc: 中文百科（百度百科 + 中文维基）
  engines_combo:
  - baidu_baike
  - zh_wikipedia
  - wikidata
  fallback: baidu_baike
  name: cn_encyclopedia
  parallel: true
  patterns:
  - (?i)(百度百科|baike\.baidu|百科词条|查百科|词条解释)
  - (?i)(是什么(?!梗)|什么是|简介|定义一下).{0,8}$
  primary: baidu_baike
- desc: 英文单词/词典查询
  engines_combo:
  - free_dictionary
  fallback: free_dictionary
  name: dictionary_search
  parallel: false
  patterns:
  - (?i)(词典|字典|英英|英汉词典|英文单词|单词.*意思|英文.*意思|怎么读|咋读|读音|查词|define|definition|dictionary|meaning of|the word)
  - (?i)\b[a-z]{3,}\b\s*什么意思|什么意思\s*\b[a-z]{3,}\b|[a-zA-Z]{3,}.*(意思是什么|的意思)
  primary: free_dictionary
- desc: 动漫/二次元百科（萌娘百科）
  engines_combo:
  - moegirl
  - zh_wikipedia
  fallback: moegirl
  name: anime_encyclopedia
  parallel: false
  patterns:
  - (?i)(萌娘百科|二次元|ACG|动漫|番剧|新番|番组|声优|手办|同人|轻小说|漫画|动画|galgame|vtuber|虚拟主播|东方project|型月|fate)
  primary: moegirl
- desc: 书籍/图书搜索（Open Library）
  engines_combo:
  - open_library
  - anysearch
  fallback: anysearch
  name: book_search
  parallel: true
  patterns:
  - (?i)(小说|书籍|图书|书单|好书|荐书|书荒|名著|畅销书|电子书|看书|出版社|ISBN|小说推荐|科幻小说|推理小说)
  - (?i)\b(book|novel|isbn|ebook|bestseller)\b
  primary: open_library
- desc: 音乐/影视/播客媒体搜索
  engines_combo:
  - itunes
  - musicbrainz
  fallback: itunes
  name: media_search
  parallel: true
  patterns:
  - (?i)(歌曲|音乐|专辑|新歌|单曲|MV|mp3|歌词|歌手|乐队|音乐人|主唱|好听的歌|好歌推荐|听歌|歌单|的歌|电影(?!梗概)|电视剧|纪录片|影视|大片|主题曲|片尾曲|插曲|播客|有声书)
  - (?i)\b(music|song|album|movie|film|tv show|podcast|soundtrack|soundtrack|lyrics|singer|band)\b
  primary: itunes
- desc: 图片/素材搜索（Openverse 开放版权图库）
  engines_combo:
  - openverse
  fallback: openverse
  name: image_search
  parallel: false
  patterns:
  - (?i)(图片|壁纸|照片|图库|素材|插画|无版权|免费图片|头像|背景图|表情图|png|jpg 图片|壁纸下载)
  - (?i)\b(wallpaper|photo|image|picture|illustration|stock photo|free image)\b
  primary: openverse
- desc: 知识实体/维基数据查询
  engines_combo:
  - baidu_baike
  - wikidata
  - wikipedia
  - zh_wikipedia
  fallback: baidu_baike
  name: entity_search
  parallel: true
  patterns:
  - (?i)(维基数据|wikidata|知识实体|实体查询|词条实体|QID|SPARQL|知识图谱|百度百科)
  primary: wikidata
- desc: 知乎/观点/经验/评测
  engines_combo:
  - zhihu
  - zhihu_global
  - anysearch
  fallback: anysearch
  name: zhihu_content
  parallel: true
  patterns:
  - (?i)(知乎|怎么看待|如何评价|体验|评测|对比|推荐|哪个好|值得买|好不好|要不要|推荐吗|求推荐|有什么)
  primary: zhihu
- desc: 学术论文搜索
  engines_combo:
  - arxiv
  - openalex
  - crossref
  - europepmc
  - dblp
  - semantic_scholar
  fallback: openalex
  name: academic
  parallel: true
  patterns:
  - (?i)(论文|paper|arXiv|preprint|DOI|引用|citation|学术|openalex|crossref|europe pmc|dblp)
  - \b\d{4}\.\d{4,5}\b
  - (?i)(transformer|attention\s+mechanism|neural\s+network|deep\s+learning|machine\s+learning|BERT|GPT)
  primary: arxiv
- desc: 技术深度研究
  engines_combo:
  - openalex
  - arxiv
  - semantic_scholar
  - github
  - europepmc
  fallback: openalex
  name: tech_deep
  parallel: true
  patterns:
  - (?i)(research|deep dive|综述|survey|state of the art|SOTA)
  - (?i)(原理|底层|实现|源码分析|架构设计|论文)
  primary: openalex
- desc: 购物评测/选购推荐
  engines_combo:
  - zhihu
  - anysearch
  fallback: anysearch
  name: shopping
  parallel: true
  patterns:
  # 注意：不要用裸 \bbest\b / review / comparison，会误伤 "best practices" 等技术查询
  - (?i)(评测|推荐|哪个好|值得买|选购|入手|踩坑|避雷|种草|拔草|海淘)
  - (?i)\b(product\s+review|buyer's?\s+guide|worth\s+buying|best\s+buy|shopping)\b
  primary: zhihu
- desc: 语义发现/开放式调研（Exa 语义引擎）
  engines_combo:
  - exa
  - anysearch
  fallback: anysearch
  name: semantic_discovery
  parallel: false
  patterns:
  - (?i)(find me|discover|explore|landscape|ecosystem|what are the best|top.*tools|emerging|trending.*202[56])
  - (?i)(有哪些值得关注|最新进展|行业格局|赛道分析|盘点一下|梳理一下)
  primary: exa
  cost_tier: api
- desc: 代码搜索/开源项目
  engines_combo:
  - github
  - mdn
  - huggingface
  - anysearch
  fallback: github
  name: code_search
  parallel: true
  patterns:
  - (?i)(github|source code|代码|源码|开源|函数|API|实现|用法|example|snippet)
  - (?i)\b(repo|repository|library|package|npm|pip|cargo)\b
  primary: github
- desc: 网络梗/流行语/俚语/黑话
  engines_combo:
  - itotii
  - urban_dictionary
  - know_your_meme
  - anysearch
  fallback: itotii
  name: meme_slang
  parallel: true
  patterns:
  - (?i)(梗(?!概)|meme|俚语|slang|黑话|流行语|网络用语|网络热词|玩梗|出圈|抽象话|缩写|圈层用语|语录|表情包|梗百科|热梗)
  - (?i)(这是什么梗|啥意思|什么意思.*梗|梗.*意思|internet culture)
  primary: itotii
- desc: 事实查询/快速问答
  engines_combo:
  - duckduckgo
  - wikipedia
  - wolframalpha
  fallback: duckduckgo
  name: fact_check
  parallel: true
  patterns:
  - (?i)(what is|who is|when did|where is|how many|how much)
  - (?i)(是什么|是谁|什么时候|在哪里|多少|多少钱)
  primary: duckduckgo
- desc: 实时新闻/事件
  engines_combo:
  - byted
  - duckduckgo
  - octen
  fallback: duckduckgo
  name: news_realtime
  parallel: true
  patterns:
  - (?i)(最新新闻|最新进展|今天发生|突发|breaking)
  - (?i)\b(news|latest)\b
  primary: byted
- desc: 中文技术深挖（先于 chinese_general；要求含中文）
  engines_combo:
  - byted
  - octen
  - juejin
  fallback: byted
  name: chinese_tech_deep
  parallel: true
  patterns:
  - (?i)[一-鿿].*(编程|代码|算法|架构|框架|框架对比|性能优化|源码分析|实现原理|教程|指南)
  - (?i)[一-鿿].*(Rust|Python|Go|Java|JavaScript|TypeScript|React|Vue|Docker|K8s|Cursor|Copilot|Windsurf|AI编程|LLM|大模型)
  primary: byted
- desc: 英文技术通用（octen 主搜，低延迟；先于 catch-all）
  engines_combo:
  - octen
  - exa
  - anysearch
  fallback: anysearch
  name: english_tech
  parallel: true
  patterns:
  - (?i)(async|performance|best practices|tutorial|guide|how to|internals|API|SDK|framework)
  - (?i)\b(Rust|Python|JavaScript|TypeScript|React|Vue|Node|Docker|Kubernetes|asyncio)\b
  primary: octen
- desc: 中文通用搜索
  engines_combo:
  - bocha
  - byted
  - wechat_sogou
  - octen
  fallback: bocha
  name: chinese_general
  parallel: true
  patterns:
  - '[一-鿿]'
  primary: bocha
- desc: 本地中文搜索
  engines_combo:
  - local_search
  - bocha
  fallback: local_search
  name: local_chinese
  parallel: true
