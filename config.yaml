- desc: 公共卫生事件/疫情暴发（WHO 官方通报与全球卫生指标）
  engines_combo:
  - who_don
  - who_gho
  - anysearch
  fallback: anysearch
  name: outbreak_health
  primary: who_don
  parallel: false
  patterns:
  - '(?i)(疫情|暴发|流行病|传染病|outbreak|epidemic|pandemic)'
