  - imdb
  - douban_movie
  - itunes
  - wikipedia
  - wikidata
  - tvmaze
  fallback: imdb
  name: film_search
  parallel: true
  patterns:
  # 中文影视强信号；「主演/导演/编剧」覆盖 LoHo 类事实问
  - (?i)(电影|电视剧|纪录片|影视|大片|影评|影片|院线|票房|奥斯卡|金像奖|金马奖|戛纳|威尼斯电影节|剧集|连续剧|网剧|美剧|韩剧|日剧|英剧)
  - (?i)(导演|主演|演员|编剧|制片|出品|上映|首映|IMDb|imdb|豆瓣电影|影帝|影后|最佳影片)
  - (?i)\b(movie|film|tv\s*show|tv\s*series|cinema|oscar|emmy|director|screenwriter|box\s*office|netflix|hbo)\b
  - (?i)\b(starring|directed\s+by|written\s+by|released\s+in\s+\d{4})\b
  # 日韩影视触发词（修复日韩电影查询漏召；纯题材词「アニメ/애니메이션」
  # 不在此列——动漫推荐类查询 imdb 无召回，交由 general 多语回退）
  - (?i)(映画|ドラマ|主演|監督|脚本|上映|配給|アカデミー|スタジオジブリ)
  - (?i)(영화|감독|주연|출연|개봉|드라마|수상|칸|아카데미|시사회)
  primary: imdb
- desc: 体育赛事/球员/球队（先于媒体域；修复 MVP 误匹配 MV）
  # combo_budget(fast)=2 只取前 2 位。thesportsdb 偏球队/球员元数据，
  # 对「F1 积分榜」「德甲赛程比分」这类赛程/积分查询是窄源（实测
  # 2026-09-13「F1 积分榜」走 [thesportsdb] 得 0 条）。赛车（jolpica/
  # openf1）与赛程比分（openligadb）须能与主源同场竞技，且补通用兜底。
  engines_combo:
  - thesportsdb
  - jolpica
  - anysearch
  - openf1
  - openligadb
  - wikipedia
  - wikidata
  - zh_wikipedia
  fallback: thesportsdb
  name: sports_search
  parallel: true
  patterns:
  - (?i)(NBA|CBA|WNBA|NFL|NHL|MLB|MLS|英超|西甲|德甲|意甲|法甲|中超|欧冠|亚冠|世界杯|欧洲杯|美洲杯|奥运会|残奥会|世锦赛|大奖赛)
  - (?i)(足球|篮球|网球|排球|乒乓球|羽毛球|棒球|橄榄球|高尔夫|F1|一级方程式|马拉松|田径|游泳|拳击|UFC|电竞战队)
  - (?i)(决赛|半决赛|季后赛|总冠军|MVP|得分王|金靴|金球奖|转会|俱乐部|联赛|进球|助攻|夺冠|卫冕|球员|守门员|前锋|后卫)
  # 中英球队/效力语境（修复「库里 球队」「LeBron James team」「Ronaldo club」漏召）
  - (?i)(球队|球星|球会|球衣|队名|队史|效力于|效力|主教练|得分手)
  - (?i)\b(team|club|coach|roster|squad|jersey|striker|goalkeeper|midfielder|defender)\b
  - (?i)\b(world\s*cup|olympics?|championship|finals?|playoffs?|league|fixture|matchday|transfer|hat-?trick)\b
  - (?i)\b(soccer|football|basketball|tennis|baseball|cricket|rugby|golf|formula\s*1|formula\s*one)\b
  # 日韩体育触发词（修复「メッシ クラブ」「손흥민 팀」漏召）
  - (?i)(サッカー|野球|バスケ|テニス|サッカー選手|リーグ|ワールドカップ|オリンピック|クラブ|チーム|監督|選手)
  - (?i)(축구|야구|농구|테니스|월드컵|올림픽|리그|클럽|팀|감독|선수)
  primary: thesportsdb
- desc: 地理/地点/地标（OSM + 百科，先于中文 catch-all）
  engines_combo:
  - local_openstreetmap
  - wikipedia
  - wikidata
  - zh_wikipedia
  fallback: local_openstreetmap
  name: geo_places
  parallel: true
  patterns:
  # 「在哪里」在软件语境里是最常见的疑问句开头（在哪里改配置/在哪里看日志），
  # 裸命中会把排障句锁死进地理源（实测「在哪里 查看 报错 日志」拿到
  # OpenStreetMap + 维基）。「除非」（unless）只挂在这条方位词触发词上，软件
  # 语境词让方位词失效，地理查询不受影响（让位表方案会连「埃菲尔铁塔 在哪里」
  # 一起让位，见 route_domains 注释）。
  # 「位置」同理（2026-09-21 实测「日志 文件 位置」「图片 位置 居中 CSS」
  # 「元素 位置 偏移」全被锁进地理源）：中日共用的高频词，软件语境下指的不是
  # 地理方位，因此与方位词表共用同一条否决规则。
  #
  # 为什么否决必须挂在触发词上、不能挂在整个域上：本域还有「行政区划/流经/
  # 注入」这类触发词，而「行政区划代码」是货真价实的地理查询——域级否决会
  # 因为它含「代码」而把整域毙掉（2026-09-21 快照实测，3709 条查询里 3 条
  # 因此漂移）。否决的作用域必须与被否决的触发词一样窄。
  - match: '(?i)(在哪里|在哪儿|在哪|位于|坐落|位置|坐标|经纬度|海拔|发源地|入海口|交汇|毗邻|接壤|边境|首都|省会|直辖市|地标|名胜|景点)'
    unless: '(?i)(报错|错误|日志|失败|异常|配置|设置|安装|修改|代码|接口|参数|文档|教程|图片|元素|居中|对齐|偏移|样式|布局|按钮|窗口|表格|控件|调整)'
  - (?i)(山脉|河流|湖泊|海洋|岛屿|半岛|沙漠|高原|盆地|峡谷|海峡|运河|瀑布|火山|冰川|赤道|经线|纬线|时区)
  # 水系/行政区划事实（修复「黄河 流经省份」漏召）
  - (?i)(流经|途经|贯穿|横跨|流域|水系|汇入|注入|源头|入海|几省|省份|省区|行政区划|发源于)
  - (?i)(地理|地图|方位|东南西北|几公里|多远|距离.*多远|openstreetmap|nominatim|geonames)
  - (?i)\b(where\s+is|located\s+in|latitude|longitude|elevation|coordinates?|border(s|ing)?|tributary)\b
  - (?i)\b(flows?\s+through|drainage|basin|source\s+of|passes\s+through)\b
  - (?i)\b(mountain|river|lake|ocean|island|peninsula|desert|plateau|canyon|strait|volcano|glacier|timezone)\b
  # 日韩地理触发词（修复「エッフェル塔 どこ」「에펠탑 어디」漏召）。
  # **刻意不收单字触发词**（山|川|湖|島|塔、산|강|섬）：CJK 单字是最常见的
  # 构词成分，裸子串匹配实测把「川菜 做法」「塔罗牌 入门教程」「한국 반도체
  # 산업」「강아지 사료 추천」「중국 산업 정책」「부산 맛집」全锁进地理源
  # （2026-09-21 实测 18 例里 8 例误判，而这些查询的 engines_combo 主源是
  # Nominatim，qps=1）。与 2026-09-19 处理 ASCII 子串事故（hn/monet/TLE/VIN）
  # 同一条纪律：宁可漏召裸山名（한라산/富士山 单说时走通用源），也不让常见词
  # 劫持整条路由。补上无歧义的「地図/지도」（单字触发词最常见的替代表达）。
  - (?i)(どこ|どこにある|標高|首都|半島|砂漠|高原|国境|観光地|緯度|経度|地図)
  # 반도(半岛)/국경(国境) 也要挡构词成分：반도 ⊂ 반도체（半导体）、
  # 국경 ⊂ 국경일（国庆日）。与单字触发词同一类事故，只是短了两拍。
  - (?i)(어디|위치|수도|호수|반도(?!체)|사막|고원|국경(?!일)|타워|관광지|위도|경도|지도)
  primary: local_openstreetmap
- desc: 政府/组织/公司实体（百科+维基数据，覆盖 LoHo Politics/Business）
  engines_combo:
  - wikidata
  - wikipedia
  - baidu_baike
  - zh_wikipedia
  - ror
  - gleif
  fallback: wikidata
  name: org_entity
  parallel: true
  patterns:
  # 政府/国际组织
  - (?i)(国务院|中共中央|全国人大|政协|外交部|财政部|发改委|央行|人民银行|最高法院|最高检|省政府|市政府|区政府|县委|市委)
  - (?i)(联合国|安理会|世贸组织|WTO|UNESCO|IMF|世界银行|欧盟|北约|NATO|东盟|上合组织|G20|G7|非盟|阿盟)
  # WHO 必须区分大小写：`(?i)` 下 `who` 会命中英语里最常见的疑问句开头
  # （「who is the CEO of OpenAI」「who wrote the linux kernel」），把整个
  # 疑问句锁死进机构域。机构缩写本就是大写专名，没有需要忽略大小写的理由。
  - '\bWHO\b'
  - (?i)(白宫|五角大楼|国会山|克里姆林宫|唐宁街|青瓦台|首相府|总统府|议会|参议院|众议院|内阁|部委|政府机关)
  - (?i)\b(ministry|department\s+of|state\s+council|white\s+house|parliament|congress|senate|cabinet|government\s+of)\b
  - (?i)\b(united\s+nations|world\s+bank|european\s+union|nato|unesco|imf)\b
  # 知名机构缩写（与 founding/HQ 等事实问搭配；单独缩写也可进 org）
  - (?i)\b(NASA|ESA|CERN|FBI|CIA|FDA|CDC|NSA|EPA|OECD|OPEC|ASEAN)\b
  # 公司/组织实体 + 创办/成立年份（修复「创办年份」「founding year」漏召）
  - (?i)(股份有限公司|有限公司|集团|控股|总部|成立于|创立于|创办于|创始人|CEO|董事长|市值|子公司|母公司)
  - (?i)(创办年份|成立年份|创立年份|建校年份|成立时间|创办时间|创立时间|建校时间|何时成立|何时创办|何时创立)
  - (?i)(大学|学院|研究所|科学院|研究院).{0,12}(创办|成立|创立|建校)
  - (?i)\b([A-Z][A-Za-z0-9&.\- ]{1,40}\s+(Inc\.?|LLC|Ltd\.?|Corp\.?|Co\.|GmbH|S\.A\.|PLC))\b
  - (?i)\b(headquarters|founded\s+in|founded\s+by|founding\s+year|year\s+founded|established\s+in|subsidiary|parent\s+company|NGO|nonprofit|foundation)\b
  - (?i)\b(when\s+was\b.{0,40}\bfounded|when\s+founded)\b
  - (?i)(非政府组织|非营利|基金会|商会|协会|联合会|红十字|慈善组织|职能|职责|组织机构)
  # 科研机构标识（ROR）：combo 里的 ror 是研究机构权威标识源，但原 pattern
  # 全在讲政府/公司实体，没有任何一条能把「研究机构 标识」这类查询送进本域
  # ——ror 因此只有 --engine 显式可达（实测 2026-09-13）。补的这条**必须带
  # 标识语境**（标识/编号/机构号/域名/ROR），否则裸的「大学/研究所」会把
  # 通用高校查询整片吸进来（同 japan_law 的汉字词教训）。
  - (?i)(研究机构|科研机构|研究院|研究所|科学院|实验室|高校|大专院校).{0,10}(标识|编号|机构号|域名|ROR)
  - (?i)\bROR\b|\bROR\s*(ID|identifier)\b|机构标识|机构编号
  primary: wikidata
- desc: 音乐/播客媒体搜索（影视已拆 film_search；MV 用词界避免误伤 MVP）
  engines_combo:
  - itunes
  - musicbrainz
  - netease_music
  - deezer
  - listenbrainz
  fallback: itunes
  name: media_search
  parallel: true
  patterns:
  - (?i)(歌曲|音乐|专辑|新歌|单曲|\bMV\b|mp3|歌词|歌手|乐队|音乐人|主唱|好听的歌|好歌推荐|听歌|歌单|的歌|主题曲|片尾曲|插曲|播客|有声书|演唱会|巡演)
  - (?i)\b(music|song|album|podcast|soundtrack|lyrics|singer|discography|concert|tour)\b
