  fallback: aviation_weather
  name: aviation_weather
  parallel: false
  patterns:
  - (?i)(metar|taf|aviation\s*weather|airport\s*weather|aviationweather\.gov|航空气象|机场天气|机场气象|飞行气象|通航气象)
- desc: 天气查询（和风天气 + 免 Key 天气引擎 + 中国天气网）
  # weather_cn 前置于 weather：国内城市实况实测 0.46s（两步直连）vs weather
  # 子进程双源 1.5-4.3s；串行阶梯下位次即墙钟，快而权威的源先交付，early-stop
  # 命中后不再起慢源。weather 仍在本域（海外城市 wttr 主用）+ fallback 链可达。
  engines_combo:
  - qweather
  - byted
  - weather_cn
  - weather
  - open_meteo
  fallback: qweather
  name: weather_query
  parallel: false
  patterns:
  # 「天气/温度」是气候议题的高频子串（气候变化、极端天气、全球变暖），
  # 裸词命中会把议题句锁死进天气实况源（实测返回「当前 30°C」）。这里用
  # 「除非」（unless）挂在**这一条触发词**上，而不是整个域：气候议题词只让
  # 「天气/温度」这类裸词失效，不影响本域其它触发词。也不用收窄词表——收窄
  # （只留「天气预报」）会丢掉最自然的「北京天气」，「未来一周」这类预报词
  # 永远列不全（2026-09-19 实测，让位表方案就是这样把「上海天气 未来一周」
  # 误让位的）。
  - match: '(?i)(天气|气温|温度|预报|下雨|降水|多少度|weather|forecast)'
    unless: '(?i)(气候变化|极端天气|全球变暖|天气趋势|天气研究|天气影响|天气对)'
  # 日韩天气触发词（修复「東京の天気」「서울 날씨」漏召）
  - (?i)(天気|気温|予報|何度)
  # 裸「雨/雪」在中文里大量作为构词成分出现（雪原、雪松、电动车…），
  # 不是天气意图。2026-10-23 回放实测：「雪原 开源 投研 搜索工具」被判进
  # weather_query，天气源返回「雪原…当前 14°C 晴」。改为只收明确的天气说法；
  # 「明天会下雪吗」仍命中「下雪」，「雪景 壁纸」仍由 image_search 接。
  - match: '(?i)(下雨|下雪|降雨|降雪|雨夹雪|暴雨|大雨|小雨|中雨|大雪|小雪|中雪|阵雨|雷阵雨|雨量|雪量|雨天|雪天|有雨|有雪)'
    unless: '(?i)(图片|壁纸|照片|图库|素材|插画|头像|背景图|桌面|png|jpg|海报|摄影|写真|剧照|表情|雪花|雪景|雨景|wallpaper|photo|image|picture|illustration|poster)'
  - (?i)(날씨|기온|온도|예보|몇\s*도)
  # 多语言天气触发词（2026-11-04）：combo 里的 open_meteo 是**全球天气**引擎
  # （免认证、按地名取坐标），但本域 patterns 此前只有中/日/韩三种语言，
  # 其余 13 种语言的天气查询全部落 general_search（实测 13/13 失配）。
  # 词表按各语言「天气/预报」的常用写法收，只收裸词（与中文第一条同口径）。
  # 单行书写：YAML 里反斜杠续行会破坏结构（实测整份 config 解析失败）。
  #
  # 泰语单独挂 unless（与中文第一条同构）：裸 อากาศ（天气）在通用句里也出现
  # （实测「วันนี้อากาศดีมาก เรามีประชุมที่กรุงเทพ」=「今天天气很好，我们在曼谷
  # 开会」被误判天气域）。否决词收「会议/出行/工作」等语境词——与中文用
  # 「气候变化/极端天气」否决气候议题是同一手法：裸词让位，明确意图词保留。
  - match: '(?i)(\bweather\b|\bforecast\b|\btemperature\b|\bdegrees?\b|météo|prévision|prévisions|tiempo|pronóstico|previsión|Wetter|Vorhersage|Temperatur|previsão\s+do\s+tempo|thời\s+tiết|dự\s+báo|prakiraan\s+cuaca|погод\w*|прогноз\s+погоды|температур\w*|الطقس|توقعات|درجات\s+الحرارة|מזג\s+אוויר|תחזית|טמפרטורה|อากาศ|พยากรณ์|อุณหภูมิ|počasí|předpověď|teplota|srázky|hava\s+durumu|hava\s+tahmini|tahmin|yağış|sıcaklık)'
    unless: '(?i)(ประชุม|ทำงาน|เดินทาง|งาน|会议|出行|工作)'
  early_stop_min_results: 1
  primary: qweather
