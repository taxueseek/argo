- desc: 蛋白质/基因组检索（UniProt + RCSB PDB）
  engines_combo:
  - uniprot
  - rcsb_pdb
  fallback: uniprot
  name: protein_search
  parallel: true
  patterns:
  # 2026-10-29（issue #34.1）：蛋白/基因/靶点词与「市场规模/集采/医保/销售额」同现时
  # 是医药商业与行业研报问题，不应锁进 UniProt/PDB 生信库；统一引用 `@commercial_market`
  # 声明式否决宏，生信点查（「PD-1 蛋白 结构域 序列」）不受影响。
  - match: '(基因|蛋白|蛋白质|氨基酸序列|结构域|基因组|转录因子|受体蛋白|uniprot)'
    unless: '@commercial_market'
  - match: '(?i)\b(protein|gene|genome|amino\s+acid|sequence|uniprot|rcsb|pdb)\b'
    unless: '@commercial_market'
  - match: '(?i)\b(p53|tp53|brca1|brca2|egfr|her2|pdl1|pd-1|hemoglobin|insulin|p21)\b'
    unless: '@commercial_market'
  primary: uniprot
- desc: 美国法律判例与联邦法规（CourtListener + Federal Register）
  # 2026-09-16 接入 federal_register：补「美国行政法规原文」这块盲区。
  # 原先 us_legal 只覆盖法院判例，而 rules / proposed rules / notices 属行政
  # 法规体系，是另一类一手证据（搜「AI 监管新规」时判例源给不出法规原文）。
  engines_combo:
  - courtlistener
  - federal_register
  - anysearch
  fallback: courtlistener
  name: us_legal
  parallel: false
  patterns:
  - (?i)(supreme\s+court|court\s+of\s+appeals|circuit\s+court|case\s+law|precedent|docket\s+number|courtlistener)
  - (?i)\b(roe\s+v\.?\s*wade|marbury\s+v\.?\s*madison|brown\s+v\.?\s*board|miranda\s+v\.?\s*arizona)\b
  - (美国判例|美国最高法院|判例法|联邦法院|美国法律)
  - (?i)(federal\s+register|proposed\s+rule|final\s+rule|federal\s+regulation|\bCFR\b|\bFR\s+\d+)
  - (美国联邦公报|联邦法规|行政法规|拟议规则|公开征求意见)
  primary: courtlistener
- desc: 地球科学/遥感数据（USGS 地震 + GDACS 多灾种 + NASA CMR/图像）
  # combo_budget(fast)=2 只取前 2 位。GDACS 是多灾种预警（洪水/台风/野火/
  # 地震）的答案源，usgs 只覆盖地震、nasa_cmr/images 只给数据集与图像，
  # 全是窄模态。anysearch 作通用兜底必须在前 2 位，否则中文自然语言查询
  # 被窄源吃满预算返回 0（实测 2026-09-13「地震 预警」走
  # [usgs, nasa_images] 得 0 条）。
  engines_combo:
  - usgs
  - gdacs
  - anysearch
  - nasa_cmr
  - nasa_images
  - soilgrids
  fallback: usgs
  name: earth_science
  parallel: true
  patterns:
  - (地震|震级|余震|地质|遥感|卫星数据|震中)
  - (?i)(earthquake|seismic|usgs|geology|remote\s+sensing|satellite\s+data)
  primary: usgs
- desc: 安全漏洞情报（NVD + OSV 开源漏洞 + CISA KEV 在野利用 + crt.sh 证书情报）
  # 通用兜底源 anysearch 必须留在前 2 位：combo_budget(depth=fast)=2，
  # 截断只按声明顺序取前 N 个。原先 [nvd, crt_sh, anysearch] 使两个
  # 窄模态源吃满预算，中文自然语言查询（如「log4j 漏洞 影响」）两源
  # 均返回 0（实测 2026-09-12），而 anysearch 有 10 条。
  #
  # 2026-09-16 接入 osv / cisa_kev，放在 anysearch 之后（位次 3、4）：
  #   nvd      —— CVE 编号 + CVSS 严重度（官方口径）
  #   osv      —— 按包查，聚合 GHSA/PyPA/Go/RustSec，给出**影响版本区间**
  #   cisa_kev —— 官方确认「已被真实攻击利用」，是修复优先级最高的一档
  # 三者互补构成完整判断链（严重度 → 影响范围 → 是否在野利用），彼此不重复。
  # 位置放在兜底源之后是刻意的：它们在小预算下不参与通用路由，只在 deep/
  # research 或用户显式点名时生效——避免用 1KB+ 的结构化事实挤掉中文召回。
  engines_combo:
  - nvd
  - anysearch
  - crt_sh
  fallback: anysearch
  name: security_search
  parallel: false
  patterns:
  # 裸 CVE 此前不认：第一条要求写成完整的 CVE-2024-1234，于是「CVE 漏洞」
  # 这种最自然的说法一个域都不命中，掉进通用兜底、nvd 选不上。
  - (?i)\bCVE(-|\b)
  # 裸「漏洞/vulnerability」是最自然的说法，此前只收「漏洞+公告/情报/扫描…」，
  # 实测「示例包 漏洞」掉进通用兜底、「示例 python package
  # vulnerability」被 code_search 的 package 抢走。
  - (?i)(漏洞|vulnerabilit(y|ies)|security\s+(issue|flaw|bug))
  - (?i)(安全漏洞|漏洞公告|漏洞情报|漏洞利用|漏洞评分|漏洞扫描|漏洞修复|CVSS|CVE|NVD|安全通告|zero.?day|零日漏洞|0day)
  - (?i)(security (advisory|vulnerability|bulletin)|cisa kev)
  - (?i)(在野利用|已被利用|\bkev\b|exploited in the wild)
  - (?i)(依赖漏洞|组件漏洞|包漏洞|\bOSV\b|供应链攻击|软件成分分析|SBOM)
  # 常见漏洞类型：用户往往直接说类型而不是「漏洞」二字
  - (?i)(SQL\s*注入|命令注入|代码注入|反序列化|远程代码执行|\bRCE\b|权限提升|提权|越权访问|跨站脚本|\bXSS\b|\bCSRF\b|目录穿越|路径穿越)
  primary: nvd
- desc: 产品生命周期（endoflife.date）
  engines_combo:
  - endoflife
  - anysearch
  fallback: anysearch
  name: lifecycle_search
  parallel: false
  patterns:
  - (?i)(生命周期|停止维护|停止支持|停止更新|停更|end.of.life|\beol\b|何时停止|支持到)
  - (?i)(lifecycle|still (supported|maintained)|security (fix|patch) until)
  primary: endoflife
- desc: 包依赖状态（deps.dev）
  engines_combo:
  - deps_dev
  - repology
  - anysearch
  fallback: anysearch
  name: package_intel
  parallel: false
  patterns:
  - (?i)((npm|pypi|cargo|maven)\s+\S+\s+(最新版本|弃用|版本历史|发布时间))
  - (?i)((最新版本|版本历史|弃用状态|是否弃用|deprecat).{0,16}(npm|pypi|cargo|maven|包))
  - (?i)\bdeps\.dev\b
  primary: deps_dev
- desc: 双边商品贸易（UN Comtrade）
  engines_combo:
  - un_comtrade
  - anysearch
  fallback: anysearch
  name: trade_stats
  parallel: false
  patterns:
  - (?i)(进出口|贸易额|双边贸易|贸易数据|进口额|出口额|comtrade)
  - (?i)(进口|出口|import|export).{0,12}\bHS?\s?\d{4}\b
  # 海关商品编码是贸易统计字段，不是代码搜索；但裸「商品编码」也常指零售
  # SKU，必须带海关/HS/关税语境才收，避免反向误伤。
  - (?i)(HS\s*代码|HS\s*code|海关(商品)?编码|海关商品代码|(?:海关|HS|进出口|关税|贸易).{0,10}(商品编码|商品代码))
  primary: un_comtrade

- desc: 天文/空间天气/卫星（Kp 指数、太阳活动区、卫星目录与 TLE 轨道根数）
  engines_combo:
  - noaa_swpc
  - satnogs
  - tle_mirror
  - nasa_images
  - wikipedia
  fallback: wikipedia
  name: astro_space
  primary: noaa_swpc
  parallel: false
  patterns:
  - '(?i)(天文|天文学|astronomy|天体|asteroid|小行星|彗星|comet)'
  - '(?i)(空间天气|space weather|太阳活动|solar flare|太阳黑子|sunspot|极光|aurora)'
  - '(?i)(卫星|satellite|\bTLE\b|轨道根数|NORAD)'
  - '(?i)(Kp\s*指数|地磁|geomagnetic|coronal mass ejection|日冕)'
- desc: 电网/发电结构/碳强度（发电类型占比、电网碳强度、可再生占比）
  engines_combo:
  - energy_charts
  - carbon_intensity
  - anysearch
  - electricity_maps
  fallback: anysearch
  name: energy_grid
  primary: energy_charts
  parallel: false
  patterns:
  - '(?i)(电网|发电结构|发电量|电力结构|power grid|electricity mix|generation mix)'
  - '(?i)(碳强度|carbon intensity|碳排放强度|可再生|renewable)'
  - '(?i)(现货电价|spot price|电价)'
- desc: 交通实时（共享单车 GBFS 标准，当前覆盖 NYC Citi Bike；与 train 引擎互补）
  engines_combo:
  - gbfs_nyc
  - train
  - anysearch
  - opensky
  fallback: anysearch
  name: transport_rt
  primary: gbfs_nyc
  parallel: false
  patterns:
  # 触发词必须**与主源的实际覆盖范围一致**。gbfs_nyc 是 NYC Citi Bike 的 GBFS
  # 端点（查询词不参与过滤，命中即回纽约站点清单），而 train 只覆盖中国 12306。
  # 此前这里还挂着一条全球通用的 `公交|地铁|metro…|班次|时刻表`，于是任一城市的
  # 地铁/公交查询都被本域捕获、锁死整条组合，再串行跑一遍拿不到结果的纽约源
  # ——2026-10-26 实测「上海 地铁 线路图」白等 gbfs_nyc 890ms，中位耗时是通用
  # 检索域的 2.6 倍。通用交通信息查询交给通用检索域。
  - '(?i)(纽约|NYC|new york|citi ?bike)[^，。;；]{0,16}(共享单车|单车|bike ?share|bikeshare|滑板车|scooter|GBFS|站点|station)'
  - '(?i)(共享单车|单车|bike ?share|bikeshare|滑板车|scooter|GBFS|站点|station)[^，。;；]{0,16}(纽约|NYC|new york|citi ?bike)'
- desc: 车辆厂商/车型本体（NHTSA vPIC 权威命名映射）
  engines_combo:
  - nhtsa_vpic
  - anysearch
  fallback: anysearch
  name: vehicle_data
  primary: nhtsa_vpic
  parallel: false
  patterns:
  - '(?i)(车型|厂商|vehicle make|make and model|汽车厂商|\bVIN\b)'
  - '(?i)(哪款车|什么车|车型库)'
- desc: 日本法令检索（e-Gov 官方全文；与 flk_law/kor_law 构成东亚法条三源）
  # 触发词必须带日本语境。此前第二条 pattern 写成
  # `(日本法|e-Gov|法令検索|憲法|民法|刑法)`，其中裸的「民法」「刑法」
  # 会把「刑法 判例 司法解释」这类**纯中文**查询吸进本域（实测
  # test_p0_v25::test_legal_domain 由 legal 漂移到 japan_law）。
  # 日文汉字词只在同现日本语境或日文假名时才成立，故加语境限定。
  engines_combo:
  - egov_law
  - anysearch
  fallback: anysearch
  name: japan_law
  primary: egov_law
  parallel: false
  patterns:
  # 简繁字形：日文法律词用「憲法」，简体输入用「宪法」，两者都要收
  # （实测漏收「憲法」会让「日本 憲法」掉进 chinese_general 用中文源打日文法令）。
  - '(?i)(日本|日语|日語|和文).{0,10}(法令|法律|法条|民法|刑法|商法|宪法|憲法|条例|判例)'
  - '(?i)(日本法|e-Gov|法令検索|法令データ|日本の法律)'
  # 日文假名是强信号：含假名的法条查询一律归本域
  - '(?i)[ぁ-んァ-ヶ].{0,10}(法令|法律|法条|民法|刑法|憲法|条例|判例)'
  - '(?i)(日本|日语).{0,6}第\s*\d+\s*条'
- desc: 韩国法令/判例检索（law.go.kr 官方全文；与 flk_law/egov_law 构成东亚法条三源）
  # 触发词纪律同 japan_law：韩文汉字词（宪法/民法/刑法）不得裸用，否则会把
  # 纯中文法条查询吸进本域。汉字词一律带韩国语境限定，谚文（한글）作独立强信号。
  # 有此域之前 kor_law 只是「能 --engine 显式调用」，自动路由从未带上它。
  engines_combo:
  - kor_law
  - anysearch
  fallback: anysearch
  name: kor_law
  primary: kor_law
  parallel: false
  patterns:
  # 国名/法名同时收简繁字形。注意「韩」与「韓」是两个不同字（不是异体映射），
  # 必须都写进字符类——实测「韓国 憲法」因繁体写法漏配，掉进 chinese_general
  # 用中文通用源去打韩国法令。同类：日本侧的「憲法/宪法」。
  - '(?i)([韩韓][国國]|南[韩韓]|大[韩韓]|[韩韓][语語]|[韩韓]文).{0,10}(法令|法律|法条|民法|刑法|商法|宪法|憲法|条例|判例)'
  - '(?i)(韩国法|law\.go\.kr|국가법령|대한민국\s*법)'
  # 谚文是强信号：含韩文的法律查询一律归本域
  - '(?i)[가-힣].{0,10}(법령|법률|조문|판례|헌법|민법|형법)'
  - '(?i)(韩国|韩语|韩文).{0,6}第\s*\d+\s*条'
- desc: 土壤/农业（ISRIC SoilGrids 土壤理化属性；当前上游降级，源已就位）
  engines_combo:
  - soilgrids
  - usda
  - openfoodfacts
  - anysearch
  fallback: anysearch
  name: soil_agri
  primary: soilgrids
  parallel: false
  patterns:
  - '(?i)(土壤|soil|土质|clay content|土壤属性|土壤类型)'
  - '(?i)(农业|作物|crop\s+(rotation|yield|farming|field|insurance)|耕地|农田)'
- desc: 国家标准检索（std.samr + openstd 全文）
  engines_combo:
  - std_samr
  - openstd
  fallback: std_samr
  name: standards
  parallel: true
  patterns:
  - (?i)(国家标准|国标|标准号|标准全文|GB/?T?\s?\d{4,5}|GB\s?\d{4,5})
  - (?i)(national standard|standard (number|search))
