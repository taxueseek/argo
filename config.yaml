cache:
  db_path: ~/.cache/unified-search/cache.db
  enabled: true
  max_size_mb: 200
  ttl: 3600

domains:
- desc: 微信公众号文章搜索
  engines_combo:
  - wechat_sogou
  fallback: wechat_sogou
  name: wechat_search
  parallel: false
  patterns:
  - (?i)(公众号|微信文章|微信公众号|wechat.*article|mp\.weixin)
  - (?i)(搜狗微信|微信搜索|搜公众号)
  primary: wechat_sogou
- desc: Hacker News 搜索
  engines_combo:
  - hackernews
  fallback: hackernews
  name: hackernews_search
  parallel: false
  patterns:
  - (?i)(hacker.?news|hn|news\.ycombinator)
  - (?i)(hackernews|hn\s+search)
  primary: hackernews
- desc: Stack Overflow 搜索
  engines_combo:
  - stackoverflow
  fallback: stackoverflow
  name: stackoverflow_search
  parallel: false
  patterns:
  - (?i)(stack.?overflow|stackoverflow|编程问题|代码问题|技术问答)
  - (?i)(python.*error|javascript.*error|java.*error|debug.*code|fix.*bug)
  primary: stackoverflow
- desc: 学术搜索（Google Scholar）
  engines_combo:
  - google_scholar
  - arxiv
  fallback: google_scholar
  name: scholar_search
  parallel: false
  patterns:
  - (?i)(google.?scholar|学术论文|论文搜索|research.*paper|journal.*article)
  - (?i)(sci-hub|学术文献|学位论文|会议论文)
  primary: google_scholar
- desc: V2EX 社区搜索
  engines_combo:
  - v2ex
  fallback: v2ex
  name: v2ex_search
  parallel: false
  patterns:
  - (?i)(v2ex|v2ex\.com)
  - (?i)(技术社区|程序员社区|开发者论坛)
  primary: v2ex
- desc: 同花顺热点/强势股
  engines_combo:
  - ths_hot
  fallback: ths_hot
  name: ths_hot_search
  parallel: false
  patterns:
  - (?i)(同花顺热点|强势股|涨停原因|题材归因|热点板块|今日强势)
  - (?i)(hot stocks|trending stocks|market theme|momentum)
  primary: ths_hot
- desc: 财联社电报
  engines_combo:
  - cls_telegraph
  fallback: cls_telegraph
  name: cls_telegraph_search
  parallel: false
  patterns:
  - (?i)(财联社|cls\.cn|电报|快讯|财经快讯)
  primary: cls_telegraph
- desc: 东财全球资讯
  engines_combo:
  - em_global_news
  fallback: em_global_news
  name: em_news_search
  parallel: false
  patterns:
  - (?i)(东财资讯|全球资讯|7x24|财经快讯|市场快讯)
  - (?i)(eastmoney news|global news|financial news)
  primary: em_global_news
- desc: 基金筛选/基金数据
  engines_combo:
  - eastmoney
  - anysearch
  fallback: anysearch
  name: fund_query
  parallel: false
  patterns:
  - (?i)(基金|公募|私募|ETF|LOF|FOF|基金经理|基金净值|基金排行|选基)
  primary: eastmoney
  quote: true
- desc: 股票/行情查询
  engines_combo:
  - eastmoney
  - anysearch
  fallback: anysearch
  name: stock_query
  parallel: false
  patterns:
  - (?i)(股价|行情|涨跌|K线|大盘|指数|涨停|跌停|板块|概念股)
  - (?i)(stock|quote|price|market\s+cap)
  - A股|港股|美股|股票|ETF|板块
  primary: eastmoney
  quote: true
- desc: 财经资讯/研报/公告
  engines_combo:
  - byted
  - eastmoney
  - anysearch
  fallback: eastmoney
  name: financial_news
  parallel: true
  patterns:
  - (?i)(研报|财报|公告|财经|宏观|央行政策|降息|加息|CPI|GDP|PMI)
  - (?i)(financial|earnings|report|announcement)
  primary: byted
- desc: 全网热搜/热榜
  engines_combo:
  - baidu_hot
  - toutiao_hot
  - bilibili_hot
  - ths_hot
  fallback: baidu_hot
  name: hot_trending
  parallel: true
  patterns:
  - (?i)(热搜|热榜|热搜榜|实时热搜|今日热搜|今天热搜|微博热搜|百度热搜|B站热搜|bilibili热搜|头条热榜|抖音热榜|热门话题|trending now|hot search|top trends)
  primary: baidu_hot
- desc: 加密货币/币种查询
  engines_combo:
  - coingecko
  fallback: coingecko
  name: crypto_search
  parallel: false
  patterns:
  - (?i)(比特币|以太坊|莱特币|狗狗币|加密货币|虚拟货币|数字货币|币价|币种|山寨币|空气币|代币|区块链|挖矿|钱包地址|token 经济|稳定币)
  - (?i)\b(bitcoin|ethereum|btc|eth|crypto|altcoin|defi|nft|blockchain|coin)\b
  primary: coingecko
- desc: Rust 包/库查询（crates.io）
  engines_combo:
  - crates
  - github
  fallback: crates
  name: package_search
  parallel: false
  patterns:
  - (?i)(crates\.io|cargo 包|rust 包|rust 库|crate 库|rust crate|rust 依赖|rust 生态|rust.*\bcrate|好用的 crate)
  - (?i)\b(crates\.io|crates|crate|cargo\s+package|serde)\b
  primary: crates
- desc: 英文单词/词典查询
  engines_combo:
  - free_dictionary
  fallback: free_dictionary
  name: dictionary_search
  parallel: false
  patterns:
  - (?i)(词典|字典|英英|英汉词典|英文单词|单词.*意思|英文.*意思|怎么读|咋读|读音|查词|define|definition|dictionary|meaning of|the word)
  - (?i)\b[a-z]{3,}\b\s*什么意思|什么意思\s*\b[a-z]{3,}\b|[a-zA-Z]{3,}.*(意思是什么|的意思)
  primary: free_dictionary
- desc: 动漫/二次元百科（萌娘百科）
  engines_combo:
  - moegirl
  - zh_wikipedia
  fallback: moegirl
  name: anime_encyclopedia
  parallel: false
  patterns:
  - (?i)(萌娘百科|二次元|ACG|动漫|番剧|新番|番组|声优|手办|同人|轻小说|漫画|动画|galgame|vtuber|虚拟主播|东方project|型月|fate)
  primary: moegirl
- desc: 书籍/图书搜索（Open Library）
  engines_combo:
  - open_library
  - anysearch
  fallback: anysearch
  name: book_search
  parallel: true
  patterns:
  - (?i)(小说|书籍|图书|书单|好书|荐书|书荒|名著|畅销书|电子书|看书|出版社|ISBN|小说推荐|科幻小说|推理小说)
  - (?i)\b(book|novel|isbn|ebook|bestseller)\b
  primary: open_library
- desc: 音乐/影视/播客媒体搜索
  engines_combo:
  - itunes
  - musicbrainz
  fallback: itunes
  name: media_search
  parallel: true
  patterns:
  - (?i)(歌曲|音乐|专辑|新歌|单曲|MV|mp3|歌词|歌手|乐队|音乐人|主唱|好听的歌|好歌推荐|听歌|歌单|的歌|电影(?!梗概)|电视剧|纪录片|影视|大片|主题曲|片尾曲|插曲|播客|有声书)
  - (?i)\b(music|song|album|movie|film|tv show|podcast|soundtrack|soundtrack|lyrics|singer|band)\b
  primary: itunes
- desc: 图片/素材搜索（Openverse 开放版权图库）
  engines_combo:
  - openverse
  fallback: openverse
  name: image_search
  parallel: false
  patterns:
  - (?i)(图片|壁纸|照片|图库|素材|插画|无版权|免费图片|头像|背景图|表情图|png|jpg 图片|壁纸下载)
  - (?i)\b(wallpaper|photo|image|picture|illustration|stock photo|free image)\b
  primary: openverse
- desc: 知识实体/维基数据查询
  engines_combo:
  - wikidata
  - wikipedia
  fallback: wikidata
  name: entity_search
  parallel: false
  patterns:
  - (?i)(维基数据|wikidata|知识实体|实体查询|词条实体|QID|SPARQL|知识图谱)
  primary: wikidata
- desc: 知乎/观点/经验/评测
  engines_combo:
  - zhihu
  - anysearch
  fallback: anysearch
  name: zhihu_content
  parallel: true
  patterns:
  - (?i)(知乎|怎么看待|如何评价|体验|评测|对比|推荐|哪个好|值得买|好不好|要不要|推荐吗|求推荐|有什么)
  primary: zhihu
- desc: 学术论文搜索
  engines_combo:
  - arxiv
  - openalex
  - crossref
  - semantic_scholar
  fallback: semantic_scholar
  name: academic
  parallel: true
  patterns:
  - (?i)(论文|paper|arXiv|preprint|DOI|引用|citation|学术)
  - \b\d{4}\.\d{4,5}\b
  - (?i)(transformer|attention\s+mechanism|neural\s+network|deep\s+learning|machine\s+learning|BERT|GPT)
  primary: arxiv
- desc: 购物评测/选购推荐
  engines_combo:
  - zhihu
  - anysearch
  fallback: anysearch
  name: shopping
  parallel: true
  patterns:
  - (?i)(评测|推荐|哪个好|值得买|选购|入手|踩坑|避雷|best|review|comparison)
  primary: zhihu
- desc: 语义发现/开放式调研（Exa 语义引擎）
  engines_combo:
  - exa
  - anysearch
  fallback: anysearch
  name: semantic_discovery
  parallel: false
  patterns:
  - (?i)(find me|discover|explore|landscape|ecosystem|what are the best|top.*tools|emerging|trending.*202[56])
  - (?i)(有哪些值得关注|最新进展|行业格局|赛道分析|盘点一下|梳理一下)
  primary: exa
  cost_tier: api
- desc: 技术深度研究
  engines_combo:
  - semantic_scholar
  - arxiv
  - openalex
  - github
  - exa
  fallback: arxiv
  name: tech_deep
  parallel: true
  patterns:
  - (?i)(research|deep dive|综述|survey|state of the art|SOTA)
  - (?i)(原理|底层|实现|源码分析|架构设计|论文)
  primary: semantic_scholar
- desc: 代码搜索/开源项目
  engines_combo:
  - github
  - anysearch
  fallback: anysearch
  name: code_search
  parallel: true
  patterns:
  - (?i)(github|source code|代码|源码|开源|函数|API|实现|用法|example|snippet)
  - (?i)\b(repo|repository|library|package|npm|pip|cargo)\b
  primary: github
- desc: 网络梗/流行语/俚语/黑话
  engines_combo:
  - itotii
  - urban_dictionary
  - know_your_meme
  - anysearch
  fallback: itotii
  name: meme_slang
  parallel: true
  patterns:
  - (?i)(梗(?!概)|meme|俚语|slang|黑话|流行语|网络用语|网络热词|玩梗|出圈|抽象话|缩写|圈层用语|语录|表情包|梗百科|热梗)
  - (?i)(这是什么梗|啥意思|什么意思.*梗|梗.*意思|internet culture)
  primary: itotii
- desc: 事实查询/快速问答
  engines_combo:
  - duckduckgo
  - wikipedia
  - wolframalpha
  fallback: duckduckgo
  name: fact_check
  parallel: true
  patterns:
  - (?i)(what is|who is|when did|where is|how many|how much)
  - (?i)(是什么|是谁|什么时候|在哪里|多少|多少钱)
  primary: duckduckgo
- desc: 实时新闻/事件
  engines_combo:
  - byted
  - duckduckgo
  fallback: duckduckgo
  name: news_realtime
  parallel: true
  patterns:
  - (?i)(最新新闻|最新进展|今天发生|突发|breaking)
  - (?i)\b(news|latest)\b
  primary: byted
- desc: 中文通用搜索
  engines_combo:
  - bocha
  - byted
  - wechat_sogou
  fallback: bocha
  name: chinese_general
  parallel: true
  patterns:
  - '[一-鿿]'
  primary: bocha
- desc: 本地中文搜索
  engines_combo:
  - local_search
  - bocha
  fallback: local_search
  name: local_chinese
  parallel: true
  patterns:
  - (?i)(百度|搜狗|site:baidu.com|site:sogou.com)
  primary: local_search
- desc: 本地新闻搜索
  engines_combo:
  - local_search
  - byted
  fallback: byted
  name: local_news
  parallel: true
  patterns:
  - (?i)(本地新闻|bing news|google news|news rss)
  primary: local_search
- desc: 本地代码搜索
  engines_combo:
  - local_search
  - github
  - anysearch
  fallback: anysearch
  name: local_code
  parallel: true
  patterns:
  - (?i)(stackoverflow|npm package|gitlab repo|github repo|site:stackoverflow.com)
  primary: local_search
- desc: 本地学术搜索
  engines_combo:
  - local_search
  - arxiv
  - semantic_scholar
  fallback: arxiv
  name: local_academic
  parallel: true
  patterns:
  - (?i)(arxiv api|semantic scholar|crossref|pubmed|site:arxiv.org)
  primary: local_search
- desc: 本地参考百科
  engines_combo:
  - local_search
  - wikipedia
  - duckduckgo
  fallback: duckduckgo
  name: local_reference
  parallel: true
  patterns:
  - (?i)(wikipedia api|wiktionary|wikiquote|nominatim|openstreetmap)
  primary: local_search
- desc: 本地通用搜索（兜底）
  engines_combo:
  - local_search
  - anysearch
  fallback: anysearch
  name: local_general
  parallel: true
  patterns:
  - (?i)(本地搜索|local search|零成本|free search)
  primary: local_search
- desc: 社交平台/UGC/舆论
  engines_combo:
  - twitter
  - reddit
  - xiaohongshu
  - bilibili
  - weibo
  fallback: reddit
  name: social
  parallel: true
  patterns:
  - (?i)(小红书|抖音|推特|twitter|reddit|b站|bilibili|微博|v2ex|评论|帖子|热门|trending|viral|opinion|sentiment|舆论|舆情|种草|拔草|用户体验|口碑)
  - (?i)(xhs|douyin|tweet|retweet|up主|博主|粉丝|点赞|转发|收藏)
  primary: twitter
  quote: false

engines:
  local_search:
    type: cli
    enabled: true
    label: "Local Search 聚合"
    cost_tier: free
    qps: 10
    priority: 1
    period: "second"
    cost_per_call: 0.0
    cost_unit: "free"
    cmd:
    - python3
    - sub-skills/local-search/search_v3.py
    search_args:
    - '{query}'
    - --n
    - '{n}'
    - --mode
    - '{mode}'
    - --json
    env: {}
  anysearch:
    cmd:
    - python3
    - ~/.claude/skills/argo/scripts/anysearch_http.py
    enabled: true
    label: "AnySearch"
    cost_tier: free
    qps: 5
    priority: 1
    period: "second"
    cost_per_call: 0.0
    cost_unit: "free"
    coverage: ["general", "tech"]
    desc: "通用搜索主力，本地 CLI，零 token"
    env: {}
    search_args:
    - search
    - '{query}'
    - '-n'
    - '{n}'
    type: cli
  arxiv:
    enabled: true
    label: "arXiv学术论文"
    cost_tier: free
    qps: 1
    priority: 7
    period: "second"
    cost_per_call: 0.0
    cost_unit: "free"
    coverage: ["academic"]
    desc: "arXiv 论文搜索"
    format: xml
    method: GET
    query_param: search_query
    timeout: 15
    type: http
    url: http://export.arxiv.org/api/query
  bocha:
    body:
      count: '{n}'
      freshness: oneYear
      query: '{query}'
      summary: true
    enabled: true
    label: "博查搜索"
    cost_tier: low
    qps: 5
    priority: 9
    limit: 10000
    period: "month"
    cost_per_call: 0.0001
    cost_unit: "credit"
    coverage: ["chinese", "general"]
    desc: "博查搜索 API（中文）"
    headers:
      Authorization: Bearer {BOCHA_API_KEY}
      Content-Type: application/json
    method: POST
    timeout: 8
    type: http
    url: https://api.bochaai.com/v1/web-search
  brave:
    enabled: false
    label: "Brave"
    cost_tier: low
    coverage: ["general"]
    desc: "Brave Search API"
    extra_params:
      count: '{n}'
    format: json
    headers:
      Accept: application/json
      Accept-Encoding: gzip
      X-Subscription-Token: '{BRAVE_API_KEY}'
    method: GET
    query_param: q
    timeout: 8
    type: http
    url: https://api.search.brave.com/res/v1/web/search
  byted:
    body:
      Count: '{n}'
      NeedSummary: true
      Query: '{query}'
      SearchType: web
    enabled: true
    label: "字节搜索"
    cost_tier: low
    qps: 5
    priority: 2
    period: "second"
    cost_per_call: 0.0
    cost_unit: "free"
    coverage: ["general", "news", "chinese"]
    desc: "字节搜索 API，中文通用/news"
    headers:
      Authorization: Bearer {WEB_SEARCH_API_KEY}
      Content-Type: application/json
      X-Traffic-Tag: skill_web_search
    method: POST
    output_map:
      item_source: SiteName
      item_summary: Summary
      item_title: Title
      item_url: Url
      items: Result.WebResults
    timeout: 8
    type: http
    url: https://open.feedcoopapi.com/search_api/web_search
  crossref:
    enabled: false
    label: "Crossref"
    cost_tier: free
    coverage: ["academic"]
    desc: "Crossref DOI 元数据 API"
    extra_params:
      mailto: unified-search@local
      rows: '{n}'
    format: json
    method: GET
    query_param: query
    timeout: 12
    type: http
    url: https://api.crossref.org/works
  duckduckgo:
    enabled: true
    label: "DuckDuckGo"
    cost_tier: free
    qps: 5
    priority: 13
    period: "second"
    cost_per_call: 0.0
    cost_unit: "free"
    coverage: ["general"]
    desc: "DuckDuckGo Instant Answer API（T2 替代）"
    format: json
    method: GET
    query_param: q
    timeout: 5
    type: http
    url: https://api.duckduckgo.com/
  exa:
    enabled: true
    label: "Exa语义搜索"
    cost_tier: api
    qps: 1
    priority: 14
    limit: 1000
    period: "month"
    cost_per_call: 0.0
    cost_unit: "free"
    coverage: ["semantic", "general", "english", "chinese"]
    desc: "Exa 语义搜索（embedding 匹配 + 内容摘要，1000次/月免费）"
    timeout: 15
    type: exa
  eastmoney:
    enabled: true
    label: "东财金融"
    cost_tier: free
    qps: 1
    priority: 3
    period: "second"
    cost_per_call: 0.0
    cost_unit: "free"
    coverage: ["finance", "stock", "fund"]
    desc: "东方财富，金融数据首选"
    timeout: 12
    type: eastmoney
  v2ex:
    enabled: true
    label: "V2EX"
    cost_tier: free
    qps: 3
    priority: 19
    period: "second"
    cost_per_call: 0.0
    cost_unit: "free"
    coverage: ["chinese", "tech", "community", "discussion"]
    desc: "V2EX（中文技术社区搜索）"
    timeout: 10
    type: v2ex
  google_scholar:
    enabled: true
    label: "GoogleScholar"
    cost_tier: free
    qps: 2
    priority: 18
    period: "second"
    cost_per_call: 0.0
    cost_unit: "free"
    coverage: ["academic", "paper", "research"]
    desc: "Google Scholar（学术论文搜索，HTTP 页面解析）"
    timeout: 12
    type: google_scholar
  hackernews:
    enabled: true
    label: "HackerNews"
    cost_tier: free
    qps: 5
    priority: 16
    period: "second"
    cost_per_call: 0.0
    cost_unit: "free"
    coverage: ["tech", "news", "discussion", "english"]
    desc: "Hacker News（Algolia API，科技新闻+讨论）"
    timeout: 8
    type: hackernews
  stackoverflow:
    enabled: true
    label: "StackOverflow"
    cost_tier: free
    qps: 3
    priority: 17
    limit: 300
    period: "day"
    cost_per_call: 0.0
    cost_unit: "free"
