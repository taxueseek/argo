- desc: 美国法律判例与联邦法规（CourtListener + Federal Register）
  # 2026-09-16 接入 federal_register：补「美国行政法规原文」这块盲区。
  # 原先 us_legal 只覆盖法院判例，而 rules / proposed rules / notices 属行政
  # 法规体系，是另一类一手证据（搜「AI 监管新规」时判例源给不出法规原文）。
  engines_combo:
  - courtlistener
  - federal_register
  - anysearch
  fallback: courtlistener
  name: us_legal
  parallel: false
  patterns:
  - (?i)(supreme\s+court|court\s+of\s+appeals|circuit\s+court|case\s+law|precedent|docket\s+number|courtlistener)
  - (?i)\b(roe\s+v\.?\s*wade|marbury\s+v\.?\s*madison|brown\s+v\.?\s*board|miranda\s+v\.?\s*arizona)\b
  - (美国判例|美国最高法院|判例法|联邦法院|美国法律)
  - (?i)(federal\s+register|proposed\s+rule|final\s+rule|federal\s+regulation|\bCFR\b|\bFR\s+\d+)
  - (美国联邦公报|联邦法规|行政法规|拟议规则|公开征求意见)
  primary: courtlistener
- desc: 地球科学/遥感数据（USGS 地震 + GDACS 多灾种 + NASA CMR/图像）
  # combo_budget(fast)=2 只取前 2 位。GDACS 是多灾种预警（洪水/台风/野火/
  # 地震）的答案源，usgs 只覆盖地震、nasa_cmr/images 只给数据集与图像，
  # 全是窄模态。anysearch 作通用兜底必须在前 2 位，否则中文自然语言查询
  # 被窄源吃满预算返回 0（实测 2026-09-13「地震 预警」走
  # [usgs, nasa_images] 得 0 条）。
  engines_combo:
  - usgs
  - gdacs
  - anysearch
  - nasa_cmr
  - nasa_images
  - soilgrids
  fallback: usgs
  name: earth_science
  parallel: true
  patterns:
  - (地震|震级|余震|地质|遥感|卫星数据|震中)
  - (?i)(earthquake|seismic|usgs|geology|remote\s+sensing|satellite\s+data)
  primary: usgs
- desc: 安全漏洞情报（NVD + OSV 开源漏洞 + CISA KEV 在野利用 + crt.sh 证书情报）
  # 通用兜底源 anysearch 必须留在前 2 位：combo_budget(depth=fast)=2，
  # 截断只按声明顺序取前 N 个。原先 [nvd, crt_sh, anysearch] 使两个
  # 窄模态源吃满预算，中文自然语言查询（如「log4j 漏洞 影响」）两源
  # 均返回 0（实测 2026-09-12），而 anysearch 有 10 条。
  #
  # 2026-09-16 接入 osv / cisa_kev，放在 anysearch 之后（位次 3、4）：
  #   nvd      —— CVE 编号 + CVSS 严重度（官方口径）
  #   osv      —— 按包查，聚合 GHSA/PyPA/Go/RustSec，给出**影响版本区间**
  #   cisa_kev —— 官方确认「已被真实攻击利用」，是修复优先级最高的一档
  # 三者互补构成完整判断链（严重度 → 影响范围 → 是否在野利用），彼此不重复。
  # 位置放在兜底源之后是刻意的：它们在小预算下不参与通用路由，只在 deep/
  # research 或用户显式点名时生效——避免用 1KB+ 的结构化事实挤掉中文召回。
  engines_combo:
  - nvd
  - anysearch
  - osv
  - cisa_kev
  - crt_sh
  fallback: anysearch
  name: security_search
  parallel: false
  patterns:
  # 裸 CVE 此前不认：第一条要求写成完整的 CVE-2024-1234，于是「CVE 漏洞」
  # 这种最自然的说法一个域都不命中，掉进通用兜底、nvd 选不上。
  - (?i)\bCVE(-|\b)
  - (?i)(安全漏洞|漏洞公告|漏洞情报|漏洞利用|漏洞评分|漏洞扫描|漏洞修复|CVSS|CVE|NVD|安全通告|zero.?day|零日漏洞|0day)
  - (?i)(security (advisory|vulnerability|bulletin)|cisa kev)
  - (?i)(在野利用|已被利用|\bkev\b|exploited in the wild)
  - (?i)(依赖漏洞|组件漏洞|包漏洞|\bOSV\b|供应链攻击|软件成分分析|SBOM)
  # 常见漏洞类型：用户往往直接说类型而不是「漏洞」二字
  - (?i)(SQL\s*注入|命令注入|代码注入|反序列化|远程代码执行|\bRCE\b|权限提升|提权|越权访问|跨站脚本|\bXSS\b|\bCSRF\b|目录穿越|路径穿越)
  primary: nvd
- desc: 产品生命周期（endoflife.date）
  engines_combo:
  - endoflife
  - anysearch
  fallback: anysearch
  name: lifecycle_search
  parallel: false
  patterns:
  - (?i)(生命周期|停止维护|停止支持|停止更新|停更|end.of.life|\beol\b|何时停止|支持到)
  - (?i)(lifecycle|still (supported|maintained)|security (fix|patch) until)
  primary: endoflife
- desc: 包依赖状态（deps.dev）
  engines_combo:
