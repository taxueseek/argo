- desc: 同花顺热点/强势股
  engines_combo:
  - ths_hot
  - anysearch
  fallback: anysearch
  name: ths_hot_search
  parallel: false
  patterns:
  - (?i)(同花顺热点|强势股|涨停原因|题材归因|热点板块|今日强势)
  - (?i)(hot stocks|trending stocks|market theme|动量因子|动量策略|momentum stocks?)
  primary: ths_hot
- desc: 财联社电报
  engines_combo:
  - cls_telegraph
  - jin10
  fallback: jin10
  name: cls_telegraph_search
  parallel: false
  patterns:
  # 「金十」让位给 jin10_flash（2026-10-22）：本域 patterns 含「快讯/财经快讯」，
  # 与 jin10_flash 的触发词重叠——实测「金十 7x24 快讯」被本域截走（用财联社
  # +金十双源去搜金十快讯）。unless 后落到 jin10_flash，财联社本域查询不受影响。
  - match: '(?i)(财联社|cls\.cn|财联社电报|电报快讯|电报原文|快讯|财经快讯)'
    unless: '(?i)(金十|jin10)'
  primary: cls_telegraph
- desc: 东财全球资讯
  engines_combo:
  - em_global_news
  - cls_telegraph
  fallback: cls_telegraph
  name: em_news_search
  parallel: false
  patterns:
  # 「金十」让位给 jin10_flash（2026-10-22）：本域 patterns 含 `7x24`，jin10_flash
  # 的触发词含「金十|7x24快讯」，两域重叠——实测「金十 7x24 快讯」被本域截走。
  # 让位后落到 jin10_flash；东财本域查询（东财资讯/全球资讯）不受影响。
  - match: '(?i)(东财资讯|全球资讯|7x24|财经快讯|市场快讯)'
    unless: '(?i)(金十|jin10)'
  - (?i)(eastmoney news|global news|financial news)
  primary: em_global_news
- desc: 基金筛选/基金数据
  engines_combo:
  - eastmoney
  - anysearch
  fallback: anysearch
  name: fund_query
  parallel: false
  patterns:
  - match: '(?i)(基金净值|基金排行|基金经理|公募基金|私募基金|公募|私募|选基|买基金|基金定投|基金收益|基金持仓|基金代码|基金份额代码)'
    unless: '(?i)(管理办法|条例|法规|规定|征求意见|证监会令|逐条解读|政策解读|立方米|平米)'
  - (?i)\b(ETF|LOF|FOF)\b
  primary: eastmoney
  quote: true
- desc: 美股申报文件（SEC EDGAR 官方全文检索）
  engines_combo:
  - sec_edgar
  - anysearch
  fallback: anysearch
  name: sec_filings
  parallel: false
  patterns:
  - (?i)\b(10-K|10-Q|8-K|13F|DEF 14A|S-1)\b
  - (?i)(sec\s+filing|edgar|form\s+10-?[kq]|proxy\s+statement)
  - (招股书|财报申报|年报申报|季报申报|证券申报|申报文件)
  primary: sec_edgar
- desc: 港股公告（港交所披露易一手公告）
  engines_combo:
  - hkex
  - anysearch
  fallback: anysearch
  name: hk_filings
  parallel: false
  patterns:
  - (?i)(港股|港交所|披露易|hkex|H股|红筹|同股不同权)
  - (?i)\b\d{5}\.HK\b
  primary: hkex
- desc: 商品期货行情（上期所官方日行情）
  engines_combo:
  - shfe
  - anysearch
  fallback: anysearch
  name: futures_market
  parallel: false
  patterns:
  - (沪铜|沪铝|沪锌|沪铅|沪镍|沪锡|沪金|沪银|螺纹钢|热轧卷板|热卷|黄金期货|白银期货|原油期货|上期所|上海期货交易所)
  - (?i)(\bSHFE\b|copper\s+futures|crude\s+oil\s+futures|rebar\s+futures)
  primary: shfe
- desc: 美股结构化财务（SEC XBRL companyfacts：营收/净利/资产/EPS 年度值）
  engines_combo:
  - sec_companyfacts
  - anysearch
  fallback: anysearch
  name: us_fundamentals
  parallel: false
  patterns:
  # 2026-10-25 补 unless：zh 词形的财务查询一律让位 stock_query（sina/eastmoney
  # 对 A/US 两地上市都能交付，sec_companyfacts 只认 CIK，宁德时代这类 A 股
  # 企业落本域全废）——与「XX 股价」既有分流约定同构：zh 词走 stock_query，
  # 英文词形或美股语境才进本域。与 stock_query 新增的财务 pattern 成对出现，
  # 改一处必须同步另一处。
  # 2026-11-06 补语言门 `(?=[^\n]*[\u4e00-\u9fff])`：除名单里的 zh 词形（营收/
  # 净利润/财报/资产负债表…）本意是「zh 问法让位 stock_query」，实际却把英文
  # 财务查询一起否掉了——除名单含 revenue/net income/financials 的中文对应词，
  # 而否定是「命中任一即否」，于是「AAPL annual revenue net income financials」
  # 触发词命中、除名单也命中，本域失效、落 us_stock。要求「查询里至少有一个
  # 汉字」才让位，正好是原注释的口径（英文词形或美股语境才进本域），
  # 「宁德时代 毛利率 现金流」这类 zh 查询行为不变。
  - match: '(?i)(营收|营业收入|净利润|净利|利润|财务数据|财务指标|annual\s+revenue|revenue|net\s+income|earnings|financials|fundamentals|balance\s+sheet|资产负债表|现金流|cash\s+flow|\bEPS\b|每股收益|总资产|总负债|毛利)'
    unless: '(?i)(?=[^\n]*[\u4e00-\u9fff])(A股|沪深|沪市|深市|上证|深证|北交所|创业板|科创板|年报|季报|财报|营收|营业收入|净利润|净利|利润|财务数据|财务指标|资产负债表|现金流|每股收益|总资产|总负债|毛利)'
  primary: sec_companyfacts

- desc: 美股筛选/分析（Finviz + Seeking Alpha；须排在 stock_query 前，避免「美股/ticker」被 A 股域吸走）
  # 通用兜底源必须留在前 2 位（combo_budget=2，见 security_search 注）。
  # finviz/seeking_alpha 皆为英文窄源，中文问法（「英伟达 财报」）两源皆 0；
  # exa 5 条、anysearch 10 条。
  engines_combo:
  - finviz
  - exa
  - yahoo_finance
  - seeking_alpha
  - anysearch
  - eastmoney
  - tencent_kline
  fallback: anysearch
  name: us_stock
  parallel: true
  patterns:
  - (?i)(NASDAQ|NYSE|美股|盘前|盘后|premarket|afterhours)
  - (?i)\b(AAPL|TSLA|NVDA|MSFT|GOOG|GOOGL|AMZN|META|AMD|NFLX)\b
  primary: finviz
  early_stop_min_results: 1
- desc: A股/港股行情与资金流（答案型快照，1 条即可 early-stop）
  engines_combo:
  - sina_quote
  - tencent_quote
  - em_flow
  - eastmoney
  - anysearch
  fallback: anysearch
  name: stock_query
  parallel: false
  patterns:
  - (?i)(股价|行情|涨跌|K线|大盘|大盘指数|指数行情|股票指数|沪深指数|上证指数|涨停|跌停|行业板块|板块行情|概念板块|板块轮动|概念股)
  - (?i)(\bstock\b|stock price|share price|market\s+cap)
  - A股|港股|股票|ETF|板块
  - (资金流|主力资金|北向|龙虎榜|大宗交易|换手率)
  # 2026-10-25 补：财务数值/估值类。A/US 分流沿用「XX 股价」既有约定——
  # zh 词且无美股标记进本域（sina/eastmoney 双地覆盖），美股标记与 10-K
  # 让位 us_*。裸「财报/年报」是披露浏览归 financial_news（「英伟达 财报」
  # 是双向锁既有约定），本域只收数值/估值词形；howto（怎么写年报/模板）
  # 让位通用域。实测 A 股企业「年报 营收」「市盈率 估值」此前分别落
  # us_fundamentals 与 chinese_general。us_fundamentals 同日加了对应的
  # zh 词形 unless，两处成对。
  - match: '(?i)(营收|营业收入|净利润|净利|利润|毛利率|市盈率|市净率|股息率|净资产收益率|\bROE\b|估值|现金流)'
    unless: '(?i)(美股|NASDAQ|NYSE|纳斯达克|标普|10-?[KQ]|\bSEC\b|EDGAR|怎么写|模板|格式|范文|入门|公告)'
  primary: sina_quote
  quote: true
  early_stop_min_results: 1
  # 源保底分（score_floors）：行情快照是「答案型」结果，标题是数字而非网页，
  # token 覆盖率天然低；权威/时效保底避免被陈旧新闻页压制。
  # 由 search.local_five_dim_rerank 统一消费，新源改这里不改排序代码。
  score_floors:
    sina_quote: {relevance: 1.0, authority: 0.85, freshness: 0.85}
    tencent_quote: {relevance: 1.0, authority: 0.85, freshness: 0.85}
    em_flow: {relevance: 0.9, authority: 0.85, freshness: 0.85}
- desc: 汇率/中间价查询（实时汇率快照 + 每日中间价牌价，答案型）
  # 2026-10-16 新增。此前「人民币 汇率 中间价」类查询落到 macro_data：
  # 该域 combo 以 fred/worldbank 打头且 early_stop_min_results=1，FRED 对
  # 人民币汇率返回 0 条 → 零结果恢复链拉来 local_bing，交付维基/百科词条；
  # 而 fx_rate 虽在 combo 里却位于次 5（fast 预算窗 2、auto 3，永不参与自动
  # 路由），且单别名词（「人民币汇率」）会解析出 CNY→CNY 退化货币对。
  # 本域把 FX 意图提到 macro_data 之前独拥：fx_rate 进位次 1 进预算窗，
  # eastmoney（东方财富资讯检索，中间价/在岸离岸快讯的原生来源）进位次 2
  # 补「今日中间价」的时效语义；frankfurter（ECB 官方参考价）留位次 3 走
  # deep/恢复链。early_stop_min_results=3：fx_rate 一次只产 2 条（即期+
  # 反向），不足以单独收工，强制 eastmoney 并行补位；3 条以上才停。
  engines_combo:
  - fx_rate
  - cfets
  - eastmoney
  - frankfurter
  - anysearch
  fallback: anysearch
  name: fx_query
  parallel: true
  patterns:
  - match: '(?i)(中间价|牌价|汇率|外币兑换|换汇)'
    # 代码语境里的「汇率/中间价」是在问库或接口，不是要今天的牌价。
    # 实测「示例金融库 开源 接口 汇率 中间价 python github」被 fx_query
    # 抢走，只返回一条 USD/CNY 中间价，用户要的库文档一条没有。
    unless: '(?i)(python|github|api|接口|库|数据源|代码|开源|pip|npm|教程|安装)'
  - (?i)(exchange\s+rate|fx\s+rate|currency\s+rate|usd\s*/?\s*cny|usdcny|cny\s*/?\s*usd|\bcnh\b|offshore\s+yuan)
  - 离岸人民币|在岸人民币|离岸美元
  - (人民币|美元|欧元|英镑|日元|港币|港元|加元|澳元|瑞郎|新加坡元).{0,6}(升值|贬值|买入价|卖出价|钞买价|汇买价|中间价|走势)
  - (人民币|美元|欧元|英镑|日元|港币|港元|加元|澳元|瑞郎|新加坡元)\s*[/／兑対]\s*(人民币|美元|欧元|英镑|日元|港币|港元|加元|澳元|瑞郎|新加坡元)
  - match: '(?i)外汇'
    unless: '(?i)(储备|python|github|api|接口|库|数据源|代码|开源)'
  primary: fx_rate
  early_stop_min_results: 3
  # 源保底分（score_floors）：汇率快照是「答案型」结果（标题是数字而非网页，
  # token 覆盖率天然低）；权威/时效保底避免被泛新闻页压制。
  score_floors:
    fx_rate: {relevance: 1.0, authority: 0.85, freshness: 0.9}
    eastmoney: {relevance: 0.9, authority: 0.8, freshness: 0.85}
- desc: 宏观数据查询（FRED 时序数据 + 官方口径宏观值）
  # 汇率/中间价意图由 fx_query 域独享（先于本域命中），本域不再声明
  # 「汇率|兑人民币|兑美元」触发词；fx_rate/frankfurter 留在 combo 供
  # deep/research 与零结果恢复链触达（test_domain_zero_result_recovery 锁定）。
  engines_combo:
  - fred
  - worldbank
  - nbs_stats
  - eurostat
  - fx_rate
  - frankfurter
  - anysearch
  fallback: anysearch
  name: macro_data
  parallel: false
  patterns:
  - (?i)(美国|美).{0,4}(CPI|通胀|失业率|非农|PPI|GDP增速|零售销售|M2|PCE)
  - (通胀率|失业率|非农就业|国债收益率|美债收益率|十年期国债|10年期国债|三十年期国债|30年期国债|两年期国债|2年期国债|联邦基金利率|美联储利率|隔夜回购|SOFR|美元指数|货币供应)
  - (?i)\b(US\s+CPI|unemployment\s+rate|treasury\s+yield|fed\s+funds\s+rate|nonfarm\s+payrolls?|US\s+GDP|M2\s+supply|USD\s+CNY|exchange\s+rate)\b
  - (中国|美国|日本|德国|印度|世界).{0,6}(GDP|通胀|CPI|失业率|人口数据|人口统计|贸易额|贸易数据|进出口|经济增长)
  - (GDP|通货膨胀|CPI|失业率|人口数据|经济增长率)
  primary: fred
  early_stop_min_results: 1
  # 源保底分：汇率/官方宏观数据是「答案型」（见 stock_query 注）
  score_floors:
    fx_rate: {relevance: 0.9, authority: 0.85, freshness: 0.85}
    worldbank: {relevance: 0.85, authority: 0.85}
- desc: 化学/药学化合物检索
  engines_combo:
