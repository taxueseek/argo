    desc: 中国天气网城市实况（城市联想取 cityid → sk JSON，免认证，两步）
    # 数据型源：回答的是天气数据而非与查询词面匹配的文档（同 weather 豁免）
    relevance_check: false
    # 准入校验用查询：本引擎按城市名查询，通用探针词取不到 cityid，会被判 empty。
    canary_query: 上海天气
    quality_queries:
    - id: weather_cn_sh
      query: 上海天气
      category: weather
    - id: weather_cn_bj
      query: 北京气温
      category: weather
    timeout: 10
execution:
  default_timeout: 8
  max_parallel_engines: 3
  parallel_timeout: 6
  retry_count: 1
  retry_on_empty: true
  # 单引擎墙钟硬预算（秒）：含该引擎全部重试尝试，超预算即停、由编排层切备选源。
  # 背景：重试会叠乘（引擎级 × HTTP 级 × 超时），anysearch 曾因此跑出 31s
  # （retry_count=1 → 2 次 × max_retries=1 → 2 次 × 8s = 32s 最坏）。
  # 用户体感阈值 10s；且应 ≥ default_timeout(8s)，否则单次正常尝试会被截断。
  # 调小 → 更快切备选但可能误杀慢网下的正常源；调大 → 更容忍慢源但体感变差。
  per_engine_budget_s: 10
  budget:
    fast:
      max_cost_per_query: 0.0
      allow_paid: false
    auto:
      max_cost_per_query: 0.01
      allow_paid: true
    deep:
      max_cost_per_query: 1.0
      allow_paid: true
    budget:
      max_cost_per_query: 0.005
      allow_paid: false
      quota_threshold: 0.2
output:
  format: auto
  include_routing_decision: true
  include_scores: true

# ── 语义证据层（可选，默认关闭）─────────────────────────────────────────
# 用 classifier.dev 的零样本分类，为显式核验链路（search --verify /
# research --verify）补一层「正文是否支持该查询主张」的语义判定。密度分测
# 「像不像证据块」，它测「是否支持」——实测两者近乎反向，假前提主张只有语义
# 层能表达（详见 scripts/semantic_evidence.py 头部说明与
# reports/classifier-dev-argo/A、B、F）。
# 开启：此处 enabled: true，或设环境变量 ARGO_SEMANTIC_EVIDENCE=1（env 优先）。
# 关闭时零影响：无网络调用、无新增字段、输出与未接入时逐位一致。
#
# 注意：本文件随仓库一起发布。**个人/本机开启请用环境变量**（写进
# ~/.config/argo/env 或单次命令前缀），不要改这里的 enabled 后提交——否则
# 发布出去的默认值就从「关闭」变成「开启」了。
semantic_evidence:
  enabled: false
  endpoint: "https://classifier.dev"
  # 单次批量分类的超时（秒）。服务不可达时核验链路最多多等这么久，然后静默降级。
  timeout_s: 5
  # fast：决策模型一次往返；smart：低置信度条目转推理模型复核（慢，配额小 10 倍）
  tier: fast

# ── 网络出口调度（issue #13，2026-09-14）────────────────────────────────
# 解析优先级：rules 域名命中 > ARGO_PROXY 环境变量 > 本段 url > 标准环境变量
# （HTTPS_PROXY/HTTP_PROXY/ALL_PROXY，NO_PROXY 一直被尊重）> 直连。
# 三档典型环境：
#   A. TUN/全局代理（Clash TUN 等）：什么都不用配，直连即可达。
#   B. 本地混合端口：设 ARGO_PROXY=http://127.0.0.1:7890，或下方 url 填同值。
#   C. 按源分流：rules 给必须代理的域配 URL、给直连更优的域配 "direct"。
network:
  proxy:
    # 全局代理 URL；空 = 不设 argo 级全局（回落到环境变量）。
    # 例: url: "http://127.0.0.1:7890"
    url: ""
    # 按域名后缀匹配的覆盖规则；值 = 代理 URL 或 "direct"（强制直连）。
    # 例:
    #   "github.com": "http://127.0.0.1:7890"
    #   "bochaai.com": "direct"
    # gdeltproject.org 显式走本地 Clash：GDELT 按出口 IP 限流（1 调用/5 秒，
    # 触发后冷却以分钟计），argo 的真直连路径对它 TLS 握手超时（_ssl.c 实测
    # 10s 打穿），curl 经 Clash TUN 分流可达但慢（14s）——显式指定本机代理
    # 端口最稳（2026-09-17 的「死源」下线判定=429 连发+握手超时两根因叠加）。
    # 其他环境按本机代理端口改写。
    rules:
      "gdeltproject.org": "http://127.0.0.1:7897"
