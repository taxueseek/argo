  parallel: false
  patterns:
  - (?i)(metar|taf|aviation\s*weather|airport\s*weather|aviationweather\.gov|航空气象|机场天气|机场气象|飞行气象|通航气象)
- desc: 天气查询（和风天气 + 免 Key 天气引擎 + 中国天气网）
  # weather_cn 前置于 weather：国内城市实况实测 0.46s（两步直连）vs weather
  # 子进程双源 1.5-4.3s；串行阶梯下位次即墙钟，快而权威的源先交付，early-stop
  # 命中后不再起慢源。weather 仍在本域（海外城市 wttr 主用）+ fallback 链可达。
  engines_combo:
  - qweather
  - byted
  - weather_cn
  - weather
  fallback: qweather
  name: weather_query
  parallel: false
  patterns:
  # 「天气/温度」是气候议题的高频子串（气候变化、极端天气、全球变暖），
  # 裸词命中会把议题句锁死进天气实况源（实测返回「当前 30°C」）。这里用
  # 「除非」（unless）挂在**这一条触发词**上，而不是整个域：气候议题词只让
  # 「天气/温度」这类裸词失效，不影响本域其它触发词。也不用收窄词表——收窄
  # （只留「天气预报」）会丢掉最自然的「北京天气」，「未来一周」这类预报词
  # 永远列不全（2026-09-19 实测，让位表方案就是这样把「上海天气 未来一周」
  # 误让位的）。
  - match: '(?i)(天气|气温|温度|预报|下雨|降水|多少度|weather|forecast)'
    unless: '(?i)(气候变化|极端天气|全球变暖|天气趋势|天气研究|天气影响|天气对)'
  # 日韩天气触发词（修复「東京の天気」「서울 날씨」漏召）
  - (?i)(天気|気温|温度|予報|雨|雪|何度)
  - (?i)(날씨|기온|온도|예보|몇\s*도)
  primary: qweather
