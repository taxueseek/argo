[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "argo-search"
version = "2.10.1"
description = "专为 AI Agent 打造的统一搜索、网页提取与证据核验工具与 MCP 服务"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["mcp", "mcp-server", "search", "web-search", "agent", "llm", "claude", "cursor"]
authors = [
    { name = "taxueseek" }
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
fast = [
    "curl_cffi>=0.7.0",
    "rapidfuzz>=3.0.0",
]

[project.scripts]
argo = "argo_search.cli:main"
argo-search = "argo_search.cli:main"
argo-mcp = "argo_search.mcp:main"

[tool.setuptools]
packages = ["argo_search"]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# 超时不写在这里：没装 pytest-timeout 的环境会把未知配置项变成警告噪音，
# 而门禁输出必须干净。CI 用显式 --timeout=120（见 .github/workflows/ci.yml）。
markers = [
    "live: 需要真实网络的用例（PR 不跑，nightly 跑）",
    "slow: 单条超过 5 秒的用例",
    "gate: 门禁自检（体积/静态/口径），改动这些依赖时必须跑",
]
